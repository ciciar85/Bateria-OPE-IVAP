ble a derechos e intereses legítimos»."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 11, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 11, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #11)", "estado": "Vigente", "pregunta": "EN CUANTO AL RECURSO DE REVISIÓN:", "opciones": {"A": "Cabe plantearlo cuando aparezcan documentos de valor esencial para la resolución del asunto, que sean anteriores al acto que se recurre y que evidencien el error de la Resolución recurrida.", "B": "Cabe plantearlo cuando al dictar el acto se hubiera incurrido en error de hecho o de derecho en atención a los documentos incorporados al expediente.", "C": "Cabe plantearlo cuando la resolución se hubiera dictado como consecuencia de prevaricaci ón siempre que ésta se declare en sentencia firme.", "D": "Se resolverá por el Órgano superior al que dictó el acto que se pretende revisar."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 125.1.c", "explicacion": "El artículo 125.1.c) de la Ley 39/2015 señala que procede el recurso extraordinario de revisión: «Cuando en la resolución hayan influido esencialmente documentos o testimonios declarados falsos por sentencia judicial firme, anterior o posterior a aquella resolución, o cuando la resolución se hubiese dictado como consecuencia de prevaricación, cohecho, violencia, maquinación fraudulenta u otra conducta punible y se haya declarado así en virtud de sentencia judicial firme»."}, "tema_id": 33, "tema_title": "Tema 33: Revisión de Actos en vía Administrativa y Recursos"}, {"numero": 12, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 12, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #12)", "estado": "Vigente", "pregunta": "EN LO REFERIDO AL RECURSO DE ALZADA DIGA CUÁL DE LAS SIGUIENTE S AFIRMACIONES ES CIERTA:", "opciones": {"A": "El plazo para la interposición de este recurso es de un mes si el acto es exp reso en cualquier caso.", "B": "Contra la resolución de un recurso de alzada solamente cabe el recurso potestativo de reposición.", "C": "El recurso deberá interponerse en todo caso ante el Órgano que dictó el acto que se impugna.", "D": "El recurso de alzada deberá interponerse en el plazo de 1 mes tanto si el acto es ex preso como presunto."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 122.1", "explicacion": "El artículo 122.1 de la Ley 39/2015 dispone: «El plazo para la interposición del recurso de alzada será de un mes, si el acto fuera expreso. Transcurrido dicho plazo sin haberse interpuesto el recurso, la resolución será firme a todos los efectos»."}, "tema_id": 33, "tema_title": "Tema 33: Revisión de Actos en vía Administrativa y Recursos"}, {"numero": 13, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 13, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #13)", "estado": "Vigente", "pregunta": "EN RELACIÓN CON LA RESPONSABILIDAD PATRIMONIAL DE LAS ADMINISTRACIONES PÚBLICAS:", "opciones": {"A": "La indemnización se calcula en todo caso, con arreglo a las valoraciones predominantes en el mercado.", "B": "La anulación en vía administrativa de un acto administrativo llevará consigo la correspondiente indemnización.", "C": "La responsabilidad patrimonial del Estado por el funcionamiento de la Administración de Justicia, se rige por la Ley 30/1992, de 26 de noviembre, LRJ-PAC y la LOPJ.", "D": "La fuerza mayor excluye la responsabilidad patrimonial en todo caso."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público (LRJSP)", "articulo": "Arts. 32.1 y 34.1", "explicacion": "El artículo 32.1 de la Ley 40/2015 estipula que los particulares tienen derecho a indemnización por las lesiones sufridas salvo en los casos de fuerza mayor. El art. 34.1 reitera que no serán indemnizables los daños que se deriven de hechos que no se hubieran podido prever o evitar según el estado de los conocimientos de la ciencia o de la técnica existentes en el momento de producción de aquéllos."}, "tema_id": 34, "tema_title": "Tema 34: Responsabilidad Patrimonial de las Administraciones Públicas"}, {"numero": 14, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 14, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #14)", "estado": "Vigente", "pregunta": "LA ADMINISTRACIÓN, LA DEFENSA Y LA CONSERVACIÓN DEL PATRIMONIO DEL ESTADO Y EL PATRIMONIO NACIONAL SE REGULARÁN POR:", "opciones": {"A": "Ley.", "B": "Ley Orgánica.", "C": "Normativa reglamentaria.", "D": "El derecho estatal y el comunitario."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Constitución Española de 1978", "articulo": "Art. 132.3 CE", "explicacion": "El artículo 132.3 de la Constitución Española reserva a la ley formal esta materia: «Por ley se regularán el Patrimonio del Estado y el Patrimonio Nacional, su administración, defensa y conservación»."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 15, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 15, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #15)", "estado": "Vigente", "pregunta": "LOS DERECHOS Y LAS LIBERTADES PREVISTOS EN EL CAPÍTULO II, DE L TÍTULO 1º DE LA CONSTITUCIÓN SE CARACTERIZAN PORQUE:", "opciones": {"A": "Vinculan a todos los poderes públicos.", "B": "Su ejercicio solo podrá ser regulado por Ley.", "C": "Informan la legislación positiva, la práctica judicial y la actuación de los poderes públicos.", "D": "La a) y la b) son ciertas."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Constitución Española de 1978", "articulo": "Art. 53.1 CE", "explicacion": "El artículo 53.1 de la Constitución determina: «Los derechos y libertades reconocidos en el Capítulo segundo del presente Título vinculan a todos los poderes públicos. Sólo por ley, que en todo caso deberá respetar su contenido esencial, podrá regularse el ejercicio de tales derechos y libertades...»."}, "tema_id": 1, "tema_title": "Tema 1: Constitución Española: derechos y libertades fundamentales"}, {"numero": 16, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 16, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #16)", "estado": "Vigente", "pregunta": "EL ESTADO NO TIENE COMPETENCIAS EXCLUSIVAS SOBRE LAS SIGUIENTES MATERIAS:", "opciones": {"A": "Administración de Justicia.", "B": "Relaciones internacionales.", "C": "Sanidad e higiene.", "D": "Legislación laboral."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Constitución Española de 1978", "articulo": "Art. 149.1.16ª CE", "explicacion": "El artículo 149.1.16ª de la CE reserva al Estado: «Sanidad exterior. Bases y coordinación general de la sanidad. Legislación sobre productos farmacéuticos». La «sanidad e higiene» asistencial e interior no es competencia exclusiva estatal, sino que corresponde a las Comunidades Autónomas según sus Estatutos."}, "tema_id": 2, "tema_title": "Tema 2: La organización territorial del Estado y Estatuto de Autonomía de Euskadi"}, {"numero": 17, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 17, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #17)", "estado": "Vigente", "pregunta": "EN RELACIÓN AL ACCESO A LA JUSTICIA, ¿CUÁL DE LOS SIGUIENTES NO ES UN DERECHO FUNDAMENTAL DEL CIUDADANO?:", "opciones": {"A": "Al juez ordinario predeterminado en la Ley", "B": "A no declarar contra si mismo.", "C": "A la asistencia por letrado de su elección.", "D": "A no confesarse culpable."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Constitución Española de 1978", "articulo": "Art. 119 CE en relación con la Ley 1/1996 de Asistencia Jurídica Gratuita", "explicacion": "El artículo 119 de la CE reconoce la justicia gratuita respecto de quienes acrediten insuficiencia de recursos para litigar. La asistencia jurídica gratuita comprende designación de letrado del turno de oficio y no otorga libre elección de profesional de pago con cargo al erario público."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 18, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 18, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #18)", "estado": "Vigente", "pregunta": "EN LO REFERIDO A LA AVOCACIÓN:", "opciones": {"A": "Se realizará mediante acuerdo motivado que deberá publicarse en el Boletín Oficial que corresponda.", "B": "El acuerdo de avocación no se podrá impugnar en ningún caso.", "C": "Las resoluciones administrativas que se adopten por avocación indicarán expresamente esta circunstancia.", "D": "El acuerdo de avocación deberá de ser notificado a los/as interesados/as en el procedimiento."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público (LRJSP)", "articulo": "Art. 10.2", "explicacion": "El artículo 10.2 de la Ley 40/2015 (y el previo art. 14.2 de la Ley 30/1992) establece: «En los supuestos de delegación de competencias en órganos no subordinados jerárquicamente, el conocimiento de un asunto podrá ser avocado únicamente por el órgano delegante. El acuerdo de avocación será motivado y se notificará a los interesados en el procedimiento, si los hubiere, con anterioridad o simultáneamente a la resolución final que se dicte»."}, "tema_id": 29, "tema_title": "Tema 29: Órganos Administrativos y Colegiados (Ley 40/2015 y Ley 3/2022)"}, {"numero": 19, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 19, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #19)", "estado": "Vigente", "pregunta": "EN LO REFERIDO A LA RESOLUCIÓN QUE PONE FIN AL PROCEDIMIENTO ADMINISTRATIVO:", "opciones": {"A": "La aceptación de informes o dictámenes servirá de motivación a la Resolución si hubieran sido solicitados por el Órgano competente para resolver.", "B": "La aceptación de informes o dictámenes servirá de motivación a la Resolución si se incorporan al texto de la misma.", "C": "La aceptación de informes o dictámenes servirá de motivación a la Resolución siempre que sean preceptivos y vinculantes.", "D": "La aceptación de informes o dictámenes servirá de motivación a la Resolución si son emit idos por el Órgano consultivo de la Administración de la que se trate."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 88.6", "explicacion": "El artículo 88.6 de la Ley 39/2015 determina: «La aceptación de informes o dictámenes servirá de motivación a la resolución cuando se incorporen al texto de la misma» (motivación por remisión o in aliunde)."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 20, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 20, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #20)", "estado": "Afectada por reforma legislativa (Sustituida Ley 30/1992 por Ley 39/2015 y Ley 40/2015)", "pregunta": "DIGA CUÁL DE LOS SIGUIENTES NO FIGURA EN LA LEY 30/1992, DE 26 D E NOVIEMBRE, LRJ-PAC, COMO UN DERECHO DEL CIUDADANO:", "opciones": {"A": "A identificar a las autoridades y personal al servicio de las Administracione s Públicas bajo cuya responsabilidad se tramiten los procedimientos.", "B": "A formular alegaciones en cualquier fase del procedimiento antes o después del trámite de audiencia que podrán ser tenidas en cuenta por el Órgano competente al redactar la propuesta de resolución.", "C": "A no presentar documentos que ya se encuentran en poder de la Administración actuante.", "D": "A conocer, en cualquier momento, el estado de la tramitación de los procedimientos en los que tengan la condición de interesados/as."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 53.1.e", "explicacion": "El artículo 53.1.e) de la Ley 39/2015 (análogamente al histórico art. 35.e Ley 30/1992) reconoce el derecho: «A formular alegaciones, utilizar los medios de defensa admitidos por el Ordenamiento Jurídico, y a aportar documentos en cualquier fase del procedimiento anterior al trámite de audiencia». No en 'cualquier fase' general (no cabe tras la audiencia ni tras la propuesta definitiva)."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 21, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 21, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #21)", "estado": "Vigente", "pregunta": "LAS MEDIDAS PROVISIONALES:", "opciones": {"A": "Podrán ser adoptadas por la Administración salvo en dos supuestos, uno de los cuales es que puedan crear perjuicio de difícil o imposible reparación a los/as interesados/as.", "B": "Las medidas provisionales solamente se podrán adoptar una vez iniciado el procedimiento.", "C": "Se adoptarán de oficio para asegurar la eficacia de la resolución que pudiera recaer.", "D": "Las medidas provisionales no podrán ser alzadas o modificadas a lo largo del procedimiento."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 56", "explicacion": "El artículo 56 de la Ley 39/2015 (art. 72 Ley 30/1992) prevé que el órgano competente podrá acordar las medidas provisionales que estime oportunas para asegurar la eficacia de la resolución que pudiera recaer, respetando la proporcionalidad y con audiencia de las partes, salvo casos de urgencia."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 22, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 22, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #22)", "estado": "Vigente", "pregunta": "EN CUANTO A LA PRUEBA EN EL PROCEDIMIENTO ADMINISTRATIVO:", "opciones": {"A": "Solamente se admiten los medios de prueba que figuran en la Ley 30/1992, de 26 de noviembre, LRJ-PAC.", "B": "El instructor del procedimiento podrá rechazar las pruebas propuestas por los/as interesados/as cuando dilaten excesivamente el procedimiento.", "C": "El periodo de prueba no será superior en ningún caso a 30 días.", "D": "Deberá practicarse con la asistencia del representante legal del interesado."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 77.2", "explicacion": "El artículo 77.2 de la Ley 39/2015 (y art. 80.2 Ley 30/1992) señala: «Cuando la Administración no tenga por ciertos los hechos alegados por los interesados o la naturaleza del procedimiento lo exija, el instructor del mismo acordará la apertura de un período de prueba por un plazo no superior a treinta días ni inferior a diez...»."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 23, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 23, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #23)", "estado": "Vigente", "pregunta": "EN LO REFERIDO A LA EJECUCIÓN DEL ACTO ADMINISTRATIVO RECURRIDO:", "opciones": {"A": "Se entenderá suspendida por la interposición del recurso de reposición", "B": "Se podrá suspender si la impugnación se fundamenta en alguna de las causas de anulación previstas en el artículo 63 de la Ley 30/1992, de 26 de noviembre, LRJ-PAC.", "C": "Se entenderá suspendida si transcurridos treinta días desde que la solicitud de suspensión haya tenido entrada en el registro del órgano competente para decidir sobre la misma, ést e no ha dictado resolución expresa al respecto.", "D": "Se podrá suspender por el Órgano a quien competa resolver el recurso, previo informe preceptivo del Órgano consultivo que corresponda."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 117.3", "explicacion": "El artículo 117.3 de la Ley 39/2015 (art. 111.3 Ley 30/1992) estipula que la ejecución del acto impugnado «se entenderá suspendida si transcurrido un mes desde que la solicitud de suspensión haya tenido entrada en el registro electrónico de la Administración u Organismo competente para decidir sobre la misma, el órgano a quien competa resolver el recurso no ha dictado y notificado resolución expresa al respecto»."}, "tema_id": 30, "tema_title": "Tema 30: El Acto Administrativo: Eficacia, Nulidad y Anulabilidad"}, {"numero": 24, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 24, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #24)", "estado": "Vigente", "pregunta": "EL RÉGIMEN JURÍDICO DE LOS BIENES DE DOMINIO PÚBLICO Y DE LOS COMUNALES SE INSPIRA EN LOS PRINCIPIOS DE:", "opciones": {"A": "Imprescriptibilidad.", "B": "Inembargabilidad.", "C": "Inalienabilidad.", "D": "Todas las anteriores son correctas. 8 25 LA LEY 2/2004, DE"}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Constitución Española de 1978", "articulo": "Art. 132.1 CE", "explicacion": "El artículo 132.1 de la Constitución dispone: «La ley regulará el régimen jurídico de los bienes de dominio público y de los comunales, inspirándose en los principios de inalienabilidad, imprescriptibilidad e inembargabilidad, así como su desafectación»."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 25, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 25, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #25)", "estado": "Vigente", "pregunta": "DE FEBRERO, DE FICHEROS DE DATOS DE CARÁCTER PERSONAL DE TITULARIDAD PÚBLICA Y DE CREACIÓN DE LA AGENCIA VASCA DE PROTECCIÓN DE DATOS NO LES ES APLICABLE EN NINGÚN CASO A:", "opciones": {"A": "A los ficheros regulados por la legislación de régimen electoral.", "B": "A los tratamientos de datos personales que sean para fines exclusivamente estadístic os y estén amparados por la legislación sobre la función estadística pública.", "C": "Al tratamiento de los datos de carácter personal relativos a la salud de las personas que es tén en manos de las instituciones y centros sanitarios de carácter público y los profesionales a su servicio.", "D": "A los ficheros de datos de carácter personal creados o gestionados para el ejercicio de potestades de derecho público por la Administración General de la Comunidad Autónoma."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley Orgánica 3/2018 (LOPDGDD) y Ley 2/2004 de Ficheros de Datos Personales del País Vasco", "articulo": "Art. 2 Ley 2/2004 y Disposición Transitoria LOPDGDD", "explicacion": "El artículo 2.2 de la Ley 2/2004 de Ficheros de Datos de Carácter Personal de Titularidad Pública de la CAV excluye expresamente de su ámbito de aplicación a los ficheros sometidos a la normativa sobre materias clasificadas."}, "tema_id": 10, "tema_title": "Tema 10: Protección de Datos Personales (LOPDGDD / RGPD)"}, {"numero": 26, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 26, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #26)", "estado": "Vigente", "pregunta": "CONTRA LAS RESOLUCIONES DE LA AGENCIA VASCA DE PROTECCIÓN DE DATOS:", "opciones": {"A": "Procederá recurso de alzada ante la Vicepresidencia del Gobierno.", "B": "Procederá interponer recurso potestativo de reposición ante la Consejera de Hac ienda y Administración Pública.", "C": "Cabe el recurso potestativo de reposición y el recurso contencioso administrativo", "D": "Procederá recurso de alzada o recurso potestativo de reposición a elección del interesado."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 2/2004, de 25 de febrero, de Ficheros de Datos de Carácter Personal y de Creación de la Agencia Vasca de Protección de Datos", "articulo": "Art. 18.2", "explicacion": "El artículo 18.2 de la Ley 2/2004 establece que los actos y resoluciones dictados por el Director de la AVPD ponen fin a la vía administrativa, pudiendo ser objeto de recurso potestativo de reposición o impugnados directamente ante la Jurisdicción Contencioso-Administrativa."}, "tema_id": 10, "tema_title": "Tema 10: Protección de Datos Personales (LOPDGDD / RGPD)"}, {"numero": 27, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 27, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #27)", "estado": "Vigente", "pregunta": "EN LO REFERIDO A LA MOTIVACIÓN DE LOS ACTOS ADMINISTRATIVOS, DEBERÁN ESTAR MOTIVADOS:", "opciones": {"A": "Los acuerdos de suspensión de actos.", "B": "Los que se dicten en el ejercicio de potestades discrecionales.", "C": "Los que se separen del dictamen de Órganos consultivos.", "D": "Todas las anteriores son ciertas."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 35.1", "explicacion": "El artículo 35.1 de la Ley 39/2015 (art. 54 Ley 30/1992) enumera los actos que serán motivados con sucinta referencia de hechos y fundamentos de derecho: los que limiten derechos subjetivos o intereses legítimos, los que resuelvan recursos administrativos o procedimientos de arbitraje, y los que se separen del criterio seguido en actuaciones precedentes o del dictamen de órganos consultivos."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 28, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 28, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #28)", "estado": "Vigente", "pregunta": "ENTRE LOS BIENES DE DOMINIO PÚBLICO ESTATAL LA CONSTITUCIÓN N O MENCIONA EXPRESAMENTE:", "opciones": {"A": "Los puertos.", "B": "El mar territorial.", "C": "La plataforma continental.", "D": "La zona marítimo-terrestre."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Constitución Española de 1978", "articulo": "Art. 132.2 CE", "explicacion": "El artículo 132.2 de la CE establece literalmente: «Son bienes de dominio público estatal los que determine la ley y, en todo caso, la zona marítimo-terrestre, las playas, el mar territorial y los recursos naturales de la zona económica y la plataforma continental». No menciona expresamente 'los puertos', cuya demanialidad deriva de la ley sectorial."}, "tema_id": 1, "tema_title": "Tema 1: Constitución Española: derechos y libertades fundamentales"}, {"numero": 29, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 29, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #29)", "estado": "Vigente", "pregunta": "NO ES UNA MODALIDAD DE LA CONTRATACIÓN DE LA GESTIÓN DE LOS SERVICIOS PÚBLICOS:", "opciones": {"A": "El concierto.", "B": "La concesión.", "C": "El arrendamiento.", "D": "La gestión interesada."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 9/2017, de Contratos del Sector Público (LCSP) / Histórico RDL 2/2000", "articulo": "Art. 284 LCSP", "explicacion": "En el régimen de contratación de la gestión de servicios públicos no figura el arrendamiento como modalidad propia de gestión indirecta del servicio público (modalidades históricas: concesión, gestión interesada, concierto y sociedad de economía mixta)."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 30, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 30, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #30)", "estado": "Vigente", "pregunta": "EN LA CONCESIÓN:", "opciones": {"A": "La Administración y el empresario participarán en los resultados de la explotación del servicio en la proporción que se establezca en el contrato.", "B": "El empresario gestiona el servicio junto con la Administración.", "C": "El empresario gestiona el servicio a su propio riesgo y ventura.", "D": "La Administración participa por sí o por medio de una entidad pública, en concur rencia con personas naturales o jurídicas."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 9/2017, de Contratos del Sector Público (LCSP)", "articulo": "Art. 15 y 284 LCSP", "explicacion": "En el contrato de concesión de servicios, el concesionario gestiona el servicio a su propio riesgo y ventura, asumiendo el riesgo operacional inherente a la explotación."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 31, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 31, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #31)", "estado": "Vigente", "pregunta": "EL PLAZO MÁXIMO DE DURACIÓN DE UN CONTRATO DE GESTIÓN DE SERVICIOS PÚBLICOS ES DE:", "opciones": {"A": "25 años.", "B": "10 años", "C": "60 años.", "D": "No existe límite temporal alguno."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley de Contratos del Sector Público", "articulo": "Art. 29 LCSP", "explicacion": "Históricamente, los contratos de gestión de servicios públicos con ejecución de obras tenían fijado un plazo máximo de 60 años (en la LCSP 2017 se sitúa en 40 años para concesión de obras y servicios vinculados)."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 32, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 32, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #32)", "estado": "Vigente", "pregunta": "EN LO REFERIDO A LOS CONTRATOS DE GESTIÓN DE SERVICIOS PÚBLICO S DIGA CUÁL DE LAS SIGUIENTES AFIRMACIONES ES CIERTA:", "opciones": {"A": "En algunos casos podrán prestarse de esta manera los servicios que impliquen ejerci cio de la autoridad inherente a los poderes públicos.", "B": "Sus efectos, cumplimiento y extinción se regularán exclusivamente por la Ley de Contratos del Sector Público.", "C": "Podrían tener una duración indefinida si así lo decide el Órgano competente para su formalización en atención al objeto del servicio.", "D": "Ninguna de las anteriores es cierta."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley de Contratos del Sector Público", "articulo": "Art. 284 LCSP", "explicacion": "Ninguna de las opciones anteriores se ajusta fielmente a los límites del régimen legal de contratación del servicio público."}, "tema_id": 22, "tema_title": "Tema 22: Firma y Certificación Electrónica (Ley 39/2015)"}, {"numero": 33, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 33, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #33)", "estado": "Vigente", "pregunta": "EL ESTADO PODRÁ DICTAR LEYES DE ARMONIZACIÓN DE LAS DISPOSICIONES NORMATIVAS DE LAS COMUNIDADES AUTÓNOMAS:", "opciones": {"A": "Por venir exigido por el interés general y por mayoría absoluta del Congreso y Senado.", "B": "Por venir exigido por el interés general y por mayoría absoluta del Congreso.", "C": "Por venir exigido por el interés general y por mayoría absoluta del Senado.", "D": "Siempre que no afecten a materias atribuidas a la competencia de las Comunidades Autónomas."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Constitución Española de 1978", "articulo": "Art. 150.3 CE", "explicacion": "El artículo 150.3 de la Constitución dispone: «El Estado podrá dictar leyes que establezcan los principios necesarios para armonizar las disposiciones normativas de las Comunidades Autónomas, aun en el caso de materias atribuidas a la competencia de éstas, cuando así lo exija el interés general. Corresponde a las Cortes Generales, por mayoría absoluta de cada Cámara, la apreciación de esta necesidad»."}, "tema_id": 28, "tema_title": "Tema 28: Fuentes del Derecho Administrativo: Ley y Reglamento"}, {"numero": 34, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 34, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #34)", "estado": "Vigente", "pregunta": "EL CONTROL DE LAS NORMAS LEGALES DE LOS ÓRGANOS DE LAS COMUNIDADES AUTÓNOMAS SE EJERCE:", "opciones": {"A": "Por la jurisdicción contencioso-administrativa en materias no reservadas a Ley Orgánica.", "B": "Por el Tribunal Constitucional en lo relativo a su constitucionalidad.", "C": "Por el Tribunal Constitucional en materias reservadas a Ley Orgánica.", "D": "Por el Ejecutivo en todo caso."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Constitución Española de 1978", "articulo": "Art. 153.a CE", "explicacion": "El artículo 153.a) de la Constitución atribuye el control de la actividad de los órganos de las Comunidades Autónomas: «Por el Tribunal Constitucional, el relativo a la constitucionalidad de sus disposiciones normativas con fuerza de ley»."}, "tema_id": 29, "tema_title": "Tema 29: Órganos Administrativos y Colegiados (Ley 40/2015 y Ley 3/2022)"}, {"numero": 35, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 35, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #35)", "estado": "Vigente", "pregunta": "LOS ACTOS ADMINISTRATIVOS SERÁN OBJETO DE PUBLICACIÓN:", "opciones": {"A": "Cuando así lo establezcan las normas reguladoras de cada procedimiento.", "B": "Cuando lo aconsejen razones de interés público apreciadas por el Órgano competente.", "C": "Cuando los interesados lo soliciten.", "D": "La a) y la b) son correctas."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 40.1", "explicacion": "El artículo 40.1 de la Ley 39/2015 (art. 58.1 Ley 30/1992) estipula: «El órgano que dicte las resoluciones y actos administrativos los notificará a los interesados cuyos derechos e intereses legítimos se vean afectados por aquéllos» (incluyendo tanto resoluciones que pongan fin como actos de trámite cualificados)."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 36, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 36, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #36)", "estado": "Vigente", "pregunta": "ES REQUISITO PARA SER DESIGNADO LEHENDAKARI:", "opciones": {"A": "Ser miembro del Parlamento Vasco.", "B": "Tener la condición política de vasco.", "C": "Ser miembro de alguno de los órganos legislativos de las Instituciones Políticas Vascas.", "D": "Estar afiliado a algún partido político con presencia en el Parlamento Vasco."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Estatuto de Autonomía del País Vasco y Ley 7/1981 de Gobierno", "articulo": "Art. 33.1 EAPV y Art. 4.1 Ley 7/1981", "explicacion": "El artículo 33.1 del Estatuto de Autonomía de Euskadi y el art. 4.1 de la Ley 7/1981 establecen que el Presidente del Gobierno Vasco o Lehendakari es designado por el Parlamento Vasco de entre sus miembros."}, "tema_id": 4, "tema_title": "Tema 4: Organización política y administrativa de la CAE"}, {"numero": 37, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 37, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #37)", "estado": "Vigente", "pregunta": "LOS CONFLICTOS ENTRE LAS ADMINISTRACIONES POR LA INTERPRETACIÓN Y APLICACIÓN DEL CONCIERTO ECONÓMICO A RELACIONES TRIBUTARIAS INDIVIDUALES LOS RESOLVERÁ:", "opciones": {"A": "El Consejo Vasco de Finanzas Públicas.", "B": "La Junta Arbitral.", "C": "La Comisión Mixta del Cupo.", "D": "La Comisión Coordinadora del concierto económico."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 12/2002, de 23 de mayo, por la que se aprueba el Concierto Económico con la Comunidad Autónoma del País Vasco", "articulo": "Art. 65", "explicacion": "El artículo 65 de la Ley 12/2002 instituye la Junta Arbitral del Concierto Económico como el órgano encargado de resolver los conflictos que se susciten entre la Administración del Estado y las Diputaciones Forales o la CAV con relación a la aplicación e interpretación del Concierto."}, "tema_id": 5, "tema_title": "Tema 5: Instituciones Forales y Locales (Concierto Económico, LILE, LTH)"}, {"numero": 38, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 38, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #38)", "estado": "Vigente", "pregunta": "ES COMPETENCIA DE LAS INSTITUCIONES COMUNES DE LA COMUNIDAD AUTÓNOMA LA LEGISLACIÓN Y EJECUCIÓN DE:", "opciones": {"A": "Todas las materias que, correspondiendo a la Comunidad Autónoma, expresamente se atribuyan a las Instituciones Comunes de la Comunidad Autónoma.", "B": "Todas las materias que corresponden a la Comunidad Autónoma.", "C": "Todas las materias que no se atribuyan a los Órganos Forales de los Territorios Históricos.", "D": "Todas las materias que, correspondiendo a la Comunidad Autónoma, no se atribuyan a los Órganos Forales de los Territorios Históricos."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 27/1983, de 25 de noviembre, de Relaciones entre las Instituciones Comunes y los Órganos Forales (LTH)", "articulo": "Art. 7.a LTH", "explicacion": "El artículo 7.a) de la LTH dispone que corresponde a las Instituciones Comunes de la CAE la legislación y ejecución de «todas aquellas materias que, correspondiendo a la Comunidad Autónoma con arreglo a su Estatuto de Autonomía, no se reconozcan o atribuyan en la presente Ley a los Órganos Forales de los Territorios Históricos»."}, "tema_id": 2, "tema_title": "Tema 2: La organización territorial del Estado y Estatuto de Autonomía de Euskadi"}, {"numero": 39, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 39, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #39)", "estado": "Vigente", "pregunta": "LA FUNCIÓN DE DETERMIINAR LA DISTRIBUCIÓN DE LOS RECURSOS Y L AS APORTACIONES DE LOS TERRITORIOS HISTÓRICOS A LA HACIE NDA GENERAL DE LA COMUNIDAD AUTÓNOMA CORRESPONDE A:", "opciones": {"A": "La Junta Arbitral.", "B": "La Comisión Mixta del Cupo.", "C": "El Consejo Vasco de Finanzas Públicas.", "D": "La Hacienda General de la Comunidad Autónoma."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 27/1983, de 25 de noviembre, de Relaciones entre las Instituciones Comunes y los Órganos Forales (LTH)", "articulo": "Art. 39 LTH", "explicacion": "El artículo 39 de la Ley 27/1983 atribuye al Consejo Vasco de Finanzas Públicas (CVFP) la determinación de la metodología y la distribución de los recursos y aportaciones de las Diputaciones Forales al Gobierno Vasco."}, "tema_id": 2, "tema_title": "Tema 2: La organización territorial del Estado y Estatuto de Autonomía de Euskadi"}, {"numero": 40, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 40, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #40)", "estado": "Vigente", "pregunta": "LA LEY 4/2005, DE 18 DE FEBRERO, PARA LA IGUALDAD DE MUJERES Y HOMBRES SERÁ DE APLICACIÓN:", "opciones": {"A": "A la Administración de la Comunidad Autónoma y a la Administración Foral, así como a sus organismos autónomos y entes públicos dependientes o vinculados de aquéllas.", "B": "A todos los poderes públicos vascos.", "C": "A todas las Administraciones Públicas Vascas.", "D": "A todas las Administraciones Públicas Vascas, con las salvedades que a lo largo de la ley se establezcan."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 4/2005, de 18 de febrero, para la Igualdad de Mujeres y Hombres (modificada por Ley 1/2022)", "articulo": "Art. 2.1", "explicacion": "El artículo 2.1 de la Ley 4/2005 extiende su ámbito de aplicación a la Administración General de la CAE, sus organismos autónomos y entes públicos de derecho privado, así como a las Administraciones Forales y Locales de Euskadi."}, "tema_id": 6, "tema_title": "Tema 6: Igualdad de Mujeres y Hombres (Ley 4/2005 y Ley 1/2022)"}, {"numero": 41, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 41, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #41)", "estado": "Vigente", "pregunta": "NO ES UNO DE LOS PRINCIPIOS GENERALES DE LA ACTUACIÓN DE LOS PODERES PÚBLICOS VASCOS EN MATERIA DE IGUALDAD DE MUJERES Y HOMBRES:", "opciones": {"A": "Igualdad de trato.", "B": "Eficacia en la implantación de medidas de discriminación positiva a favor de las mujeres.", "C": "Respeto a la diversidad y a la diferencia.", "D": "Eliminación de roles y estereotipos en función del sexo."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 4/2005, de 18 de febrero, para la Igualdad de Mujeres y Hombres", "articulo": "Art. 3", "explicacion": "El artículo 3 de la Ley 4/2005 consagra como principios generales la igualdad de trato, la prohibición de toda discriminación por razón de sexo, la integración de la perspectiva de género y la representación equilibrada; no constituye principio la discriminación inversa desprovista de legalidad."}, "tema_id": 6, "tema_title": "Tema 6: Igualdad de Mujeres y Hombres (Ley 4/2005 y Ley 1/2022)"}, {"numero": 42, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 42, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #42)", "estado": "Vigente", "pregunta": "NO SE INCLUYEN ENTRE LOS CRÉDITOS PARA GASTOS CORRIENTES:", "opciones": {"A": "Gastos de personal.", "B": "Transferencias y subvenciones para gastos corrientes.", "C": "Gastos financieros.", "D": "Transferencias y subvenciones con destino a inversiones reales o con destino a operacion es financieras."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2011, de 24 de mayo, por el que se aprueba el Texto Refundido de las disposiciones legales sobre el Régimen Presupuestario de Euskadi", "articulo": "Art. 48", "explicacion": "El artículo 48 clasifica los créditos: los gastos corrientes engloban personal, funcionamiento ordinario, gastos financieros y transferencias corrientes. Las transferencias y subvenciones de capital o con destino a inversión forman parte de los gastos de capital (Capítulo VII)."}, "tema_id": 15, "tema_title": "Tema 15: Presupuesto de Gastos: Ejecución, Créditos y Fases (D. Leg. 1/2011)"}, {"numero": 43, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 43, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #43)", "estado": "Vigente", "pregunta": "EL GOBIERNO PRESENTARÁ EL PROYECTO DE LEY DE PRESUPUEST OS GENERALES AL PARLAMENTO:", "opciones": {"A": "Con anterioridad al 1 de septiembre del ejercicio anterior a que se refiere el proyecto.", "B": "Con anterioridad al 1 de noviembre del ejercicio a que se refiere el proyecto.", "C": "Con anterioridad al 31 de diciembre del ejercicio anterior a que se refiere el proyecto.", "D": "Con anterioridad al 1 de noviembre del ejercicio anterior a que se refiere el proyecto."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2011, de 24 de mayo, del Régimen Presupuestario de Euskadi", "articulo": "Art. 53", "explicacion": "El artículo 53 del TR de la Ley de Régimen Presupuestario de Euskadi establece que el Gobierno presentará al Parlamento Vasco el proyecto de Ley de Presupuestos Generales antes del 1 de noviembre del ejercicio anterior al de su vigencia."}, "tema_id": 15, "tema_title": "Tema 15: Presupuesto de Gastos: Ejecución, Créditos y Fases (D. Leg. 1/2011)"}, {"numero": 44, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 44, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #44)", "estado": "Vigente", "pregunta": "SON CRÉDITOS DE COMPROMISO:", "opciones": {"A": "Los destinados a hacer frente a obligaciones jurídicas que hayan de contraerse para la financiación de acciones cuya ejecución deba efectuarse en ejercicios presupuestarios posteriores a aquél.", "B": "Los necesarios para hacer frente a gastos susceptibles de ser ordenados o pagados con cargo al ejercicio presupuestario en cumplimiento de obligaciones previamente contraídas.", "C": "Los necesarios para hacer frente a las obligaciones que se deriven de la percepci ón de fondos de otros Entes Públicos, para la ejecución de proyectos en materias cuya competencia no corresponda a la Comunidad Autónoma.", "D": "Los destinados a transferir fondos a otros Entes integrantes de la Administración Instit ucional de la Comunidad Autónoma que no se hayan constituido a la fecha de aprobación de la Ley de Presupuestos Generales.."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2011, de 24 de mayo, del Régimen Presupuestario de Euskadi", "articulo": "Art. 55", "explicacion": "El artículo 55 del TR de la Ley de Régimen Presupuestario define los créditos de compromiso como aquellos autorizados expresamente para contraer obligaciones jurídicas de gasto que hayan de extenderse a ejercicios posteriores."}, "tema_id": 15, "tema_title": "Tema 15: Presupuesto de Gastos: Ejecución, Créditos y Fases (D. Leg. 1/2011)"}, {"numero": 45, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 45, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #45)", "estado": "Vigente", "pregunta": "EL CESE DEL PERSONAL EVENTUAL :", "opciones": {"A": "Será libre. En todo caso, tendrá lugar cuando se produzca el cese de la autoridad a la que se preste la función de confianza o asesoramiento.", "B": "Sólo tendrá lugar cuando se produzca el de la autoridad a la que se preste la funci ón de confianza o asesoramiento.", "C": "Tendrá lugar cuando se den las causas previstas para el cese de los funcionarios interinos.", "D": "Será libre. También tendrá lugar cuando se produzca el cese de la autoridad a la que se preste la función de confianza o asesoramiento, si las leyes de Función Pública de desarrollo del Estatuto Básico del Empleado Público expresamente así lo establecen."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Real Decreto Legislativo 5/2015 (TREBEP) y Ley 11/2022 de Empleo Público Vasco", "articulo": "Art. 12.3 TREBEP y Art. 23.3 Ley 11/2022", "explicacion": "El artículo 12.3 del TREBEP (y art. 23.3 Ley 11/2022) dispone: «El cese del personal eventual tendrá carácter libre y no generará derecho a indemnización en ningún caso. El cese se producirá, en todo caso, cuando se produzca el de la autoridad a la que se preste la función de confianza o asesoramiento»."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 46, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 46, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #46)", "estado": "Vigente", "pregunta": "LAS MODALIDADES DE CARRERA PROFESIONAL SON:", "opciones": {"A": "La carrera horizontal, la carrera vertical, la promoción interna horizontal y la promoción interna vertical.", "B": "La carrera vertical y la promoción interna.", "C": "La carrera horizontal, la carrera vertical, la provisión de puestos de nivel superio r en comisión de servicios y la promoción interna horizontal y la promoción interna vertical.", "D": "La carrera horizontal, la carrera vertical, la provisión de puestos de nivel superio r en comisión de servicios y la promoción interna."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Real Decreto Legislativo 5/2015 (TREBEP) y Ley 11/2022 de Empleo Público Vasco", "articulo": "Art. 16.2 TREBEP y Art. 76 Ley 11/2022", "explicacion": "El artículo 16.2 del TREBEP define que la carrera profesional de los funcionarios se hará efectiva a través de la carrera horizontal, la carrera vertical, la promoción interna vertical y la promoción interna horizontal."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 47, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 47, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #47)", "estado": "Vigente", "pregunta": "SON RETRIBUCIONES BÁSICAS DE LOS FUNCIONARIOS PÚBLICOS:", "opciones": {"A": "El sueldo que corresponde a cada uno de los subgrupos o grupos de clasificación profesional y el componente de sueldo de las pagas extraordinarias.", "B": "El sueldo que corresponde a cada uno de los subgrupos o grupos de clasificación profesional, el complemento de destino, los trienios y los componentes de sueldo, trienios y complementos de destino de las pagas extraordinarias.", "C": "El sueldo que corresponde a cada uno de los subgrupos o grupos de clasificación profesional, los trienios y los componentes de sueldo y trienios de las pagas extraordinarias.", "D": "El sueldo que corresponde a cada uno de los subgrupos o grupos de clasificación profesional."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Real Decreto Legislativo 5/2015 (TREBEP)", "articulo": "Art. 23.1 TREBEP", "explicacion": "El artículo 23.1 del TREBEP establece que son retribuciones básicas las que retribuyen al funcionario según la adscripción de su cuerpo o escala a un determinado Subgrupo o Grupo de clasificación profesional y por su antigüedad: el sueldo asignado a cada Subgrupo y los trienios."}, "tema_id": 9, "tema_title": "Tema 9: Personal Empleado Público: Clases, derechos, deberes y régimen disciplinario"}, {"numero": 48, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 48, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #48)", "estado": "Vigente", "pregunta": "LA IMPOSICIÓN DE SANCIONES POR FALTAS LEVES:", "opciones": {"A": "Se llevará a cabo por un procedimiento sumario.", "B": "Se llevará a cabo por el procedimiento disciplinario ordinario que se establezca, c on audiencia del interesado.", "C": "Se llevará a cabo por un procedimiento sumario, con audiencia del interesado.", "D": "Se llevará a cabo por el procedimiento disciplinario ordinario que se establezca."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Real Decreto Legislativo 5/2015 (TREBEP)", "articulo": "Art. 98.3 TREBEP", "explicacion": "El artículo 98.3 del TREBEP preceptúa: «Para la imposición de sanciones por faltas leves se llevará a cabo un procedimiento sumario con audiencia al interesado»."}, "tema_id": 9, "tema_title": "Tema 9: Personal Empleado Público: Clases, derechos, deberes y régimen disciplinario"}, {"numero": 49, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 49, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #49)", "estado": "Vigente", "pregunta": "EN LOS PROCESOS DE SELECCIÓN Y DE PROVISIÓN DE PUESTOS, PAR A LOS PERFILES LINGÜÍSTICOS 3 Y 4, EN LA PONDERACIÓN DEL CONOCIMIENTO DEL EUSKERA COMO MÉRITO:", "opciones": {"A": "El porcentaje que represente no podrá ser inferior en ningún caso al 11% ni superior al 20% de la puntuación máxima alcanzable en el resto del proceso selectivo.", "B": "El porcentaje que represente no podrá ser inferior en ningún caso al 5% ni superior al 20% de la puntuación máxima alcanzable en el resto del proceso selectivo.", "C": "El porcentaje que represente no podrá ser inferior en ningún caso al 5% ni superior al 15% de la puntuación máxima alcanzable en el resto del proceso selectivo.", "D": "El porcentaje que represente no podrá ser inferior en ningún caso al 11% ni superior al 15% de la puntuación máxima alcanzable en el resto del proceso selectivo."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 4/2005, de 18 de febrero, para la Igualdad de Mujeres y Hombres (reforma Ley 1/2022)", "articulo": "Art. 20.4", "explicacion": "El artículo 20.4 de la Ley 4/2005 fija que en los tribunales de selección de personal y comisiones de valoración de provisión de puestos, la presencia de mujeres y hombres se considerará equilibrada cuando ninguno de los dos sexos tenga una representación inferior al 40%."}, "tema_id": 8, "tema_title": "Tema 8: Normalización Lingüística del uso del Euskera (Decreto 86/1997)"}, {"numero": 50, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 1, "bloque_titulo": "Bolsa 2008 - Bloque 1", "bloque_subtitulo": "Legislación y Temario General (Preguntas 1-50)", "numero_en_examen": 50, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #50)", "estado": "Vigente", "pregunta": "LAS EXENCIONES EN EL CUMPLIMIENTO DE LOS PERFILES LINGÜÍSTICOS:", "opciones": {"A": "Tendrán validez respecto a cualquier puesto de trabajo que desempeñen los sujetos de la s mismas en el momento de la resolución del expediente y en el futuro.", "B": "Tendrán validez respecto a cualquier puesto de trabajo que desempeñen los sujetos de la s mismas como titulares desde el momento de la resolución del expediente.", "C": "Tendrán validez únicamente respecto al puesto de trabajo que desempeñen los sujetos de la s mismas en el momento de la resolución del expediente.", "D": "Tendrán validez únicamente respecto al puesto de trabajo que desempeñen los sujetos de la s mismas en el momento de la resolución del expediente y sólo si éste se desempeña con carácter provisional."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Decreto 86/1997, de 15 de abril, por el que se regula el proceso de normalización del uso del euskera en las administraciones públicas del País Vasco", "articulo": "Art. 42", "explicacion": "El artículo 42 del Decreto 86/1997 prevé que las exenciones individuales del cumplimiento del perfil lingüístico tienen validez estricta y exclusiva respecto del concreto puesto de trabajo desempeñado, decayendo al cesar en el mismo."}, "tema_id": 20, "tema_title": "Tema 20: Registros Electrónicos e Interoperabilidad"}, {"numero": 51, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 2, "bloque_titulo": "Bolsa 2008 - Bloque 2", "bloque_subtitulo": "Organización, Normalización y Archivo (Preguntas 51-76)", "numero_en_examen": 51, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #51)", "estado": "Vigente", "pregunta": "LA ACREDITACIÓN DE LOS PERFILES LINGÜÍSTICOS TENDRÁ VALIDEZ:", "opciones": {"A": "Por tiempo indefinido en el caso de los perfiles 2,3 y 4 y validez temporal de dos años en el caso del perfil lingüístico 1.", "B": "Por tiempo indefinido en el caso de los perfiles 2,3 y 4 y validez temporal de un año en el caso del perfil lingüístico 1.", "C": "Por tiempo indefinido en el caso de los perfiles 3 y 4 y validez temporal de dos años en el caso de los perfiles lingüísticos 1 y 2.", "D": "Por tiempo indefinido."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Decreto 86/1997, de 15 de abril, de normalización lingüística en las AAPP vascas", "articulo": "Art. 38", "explicacion": "El artículo 38 del Decreto 86/1997 establece que la acreditación de los perfiles lingüísticos tiene validez y eficacia por tiempo indefinido una vez alcanzada por el empleado público."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 52, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 2, "bloque_titulo": "Bolsa 2008 - Bloque 2", "bloque_subtitulo": "Organización, Normalización y Archivo (Preguntas 51-76)", "numero_en_examen": 52, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #52)", "estado": "Vigente", "pregunta": "EN DEFECTO DE PACTO EN CONVENIO, LA DURACIÓN DEL PERIO DO DE PRUEBA NO PODRÁ EXCEDER DE:", "opciones": {"A": "Seis meses para los técnicos titulados ni de tres meses para los demás trabajadores.", "B": "Ocho meses para los técnicos titulados ni de dos meses para los demás trabajadores.", "C": "Seis meses para los técnicos titulados ni de dos meses para los demás trabajadores.", "D": "Un año para los técnicos titulados ni de tres meses para los demás trabajadores."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Texto Refundido de la Ley del Estatuto de los Trabajadores (RDL 2/2015)", "articulo": "Art. 14.1 ET", "explicacion": "El artículo 14.1 del Estatuto de los Trabajadores establece que el periodo de prueba no podrá exceder de seis meses para los técnicos titulados ni de dos meses para los demás trabajadores."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 53, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 2, "bloque_titulo": "Bolsa 2008 - Bloque 2", "bloque_subtitulo": "Organización, Normalización y Archivo (Preguntas 51-76)", "numero_en_examen": 53, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #53)", "estado": "Vigente", "pregunta": "EL CONTRATO DE INTERINIDAD ES:", "opciones": {"A": "El celebrado para sustituir a un trabajador o trabajadora con derecho de reserva al puest o de trabajo.", "B": "El celebrado para sustituir a un trabajador o trabajadora con derecho de reserva al puest o de trabajo o para cubrir temporalmente un puesto de trabajo durante el proceso de selección o promoción para su cobertura definitiva.", "C": "El celebrado para sustituir a cualquier trabajador o trabajadora o para cubrir temporalmente un puesto de trabajo durante el proceso de selección o promoción para su cobertura definitiva.", "D": "El celebrado para sustituir a un trabajador o trabajadora con derecho de reserva al puest o de trabajo o para cubrir temporalmente cualquier puesto de trabajo por cualquier circunstancia."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Texto Refundido de la Ley del Estatuto de los Trabajadores (RDL 2/2015)", "articulo": "Art. 15 ET", "explicacion": "El contrato de interinidad (sustitución de persona trabajadora con reserva de puesto) es el celebrado para sustituir a un trabajador con derecho a reserva de puesto en virtud de norma, convenio o acuerdo."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 54, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 2, "bloque_titulo": "Bolsa 2008 - Bloque 2", "bloque_subtitulo": "Organización, Normalización y Archivo (Preguntas 51-76)", "numero_en_examen": 54, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #54)", "estado": "Vigente", "pregunta": "NO ES UNA CARACTERÍSTICA DEL CONTRATO DE OBRA:", "opciones": {"A": "La duración de la obra o servicio objeto del contrato es, aunque limitada en el tiempo, en principio de duración incierta.", "B": "La obra o servicio objeto del contrato puede consistir en acumulación de tareas o excesos de pedidos, aún tratándose de la actividad normal de la empresa.", "C": "La obra o servicio objeto del contrato debe tener autonomía y sustantividad propia dentro de la actividad de la empresa.", "D": "El objeto del contrato es la realización de una obra o servicio determinado."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Texto Refundido de la Ley del Estatuto de los Trabajadores (RDL 2/2015)", "articulo": "Art. 15.1.a ET (régimen histórico)", "explicacion": "La obra o servicio objeto del contrato debe tener sustantividad propia dentro de la actividad de la empresa, no pudiendo confundirse con la actividad ordinaria permanente."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 55, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 2, "bloque_titulo": "Bolsa 2008 - Bloque 2", "bloque_subtitulo": "Organización, Normalización y Archivo (Preguntas 51-76)", "numero_en_examen": 55, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #55)", "estado": "Vigente", "pregunta": "LA DURACIÓN MÁXIMA DEL CONTRATO POR ACUMULACIÓN DE TAREAS SERÁ:", "opciones": {"A": "De doce meses dentro de un periodo de dieciocho meses, contados a partir del momento en que se produzcan dichas causas.", "B": "De nueve meses dentro de un periodo de quince, contados a partir del momento en que se produzcan dichas causas.", "C": "De seis meses dentro de un periodo de quince, contados a partir del momento en que se produzcan dichas causas.", "D": "De seis meses dentro de un periodo de doce, contados a partir del momento en que se produzcan dichas causas."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Texto Refundido de la Ley del Estatuto de los Trabajadores (RDL 2/2015)", "articulo": "Art. 15.2 ET", "explicacion": "El contrato por circunstancias de la producción tenía fijada como duración legal ordinaria máxima seis meses dentro de un periodo de doce meses."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 56, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 2, "bloque_titulo": "Bolsa 2008 - Bloque 2", "bloque_subtitulo": "Organización, Normalización y Archivo (Preguntas 51-76)", "numero_en_examen": 56, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #56)", "estado": "Vigente", "pregunta": "LA NORMALIZACIÓN ADMINISTRATIVA IMPLICA:", "opciones": {"A": "Simplificar los documentos administrativos.", "B": "Hacer más rápida la tramitación de los documentos.", "C": "Homogeneizar las respuestas de una pluralidad de sujetos a un problema admini strativo común.", "D": "Todas las respuestas son correctas."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Manual IVAP Tema 19 y 21 - Gestión Documental y Archivos", "articulo": "Doctrina Archivística IVAP", "explicacion": "La normalización administrativa persigue la unificación y homogeneización de circuitos, modelos e impresos, reduciendo costes y facilitando la tramitación ágil."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 57, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 2, "bloque_titulo": "Bolsa 2008 - Bloque 2", "bloque_subtitulo": "Organización, Normalización y Archivo (Preguntas 51-76)", "numero_en_examen": 57, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #57)", "estado": "Vigente", "pregunta": "UNA CORRECTA CLASIFICACIÓN DE FONDOS ARCHIVÍSTICOS SE DERIVA EN PRIMER LUGAR:", "opciones": {"A": "Del principio de desagregación de los fondos.", "B": "Del principio de procedencia.", "C": "Del principio de sistematización de materias.", "D": "Del principio de jerarquía de órganos."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Decreto 232/2000, de 21 de noviembre, por el que se aprueban el Reglamento de los Servicios de Archivo de la CAE", "articulo": "Art. 3 y Doctrina General Archivística", "explicacion": "La clasificación archivística descansa de modo imperativo en el principio de procedencia o de respeto al origen de los fondos, que exige agrupar los documentos según la entidad o unidad orgánica productora."}, "tema_id": 19, "tema_title": "Tema 19: Gestión Documental y Archivos en la CAE (Decreto 232/2000)"}, {"numero": 58, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 2, "bloque_titulo": "Bolsa 2008 - Bloque 2", "bloque_subtitulo": "Organización, Normalización y Archivo (Preguntas 51-76)", "numero_en_examen": 58, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #58)", "estado": "Vigente", "pregunta": "¿CUAL DE LOS SIGUIENTES NO ES UN CRITERIO DE CLASIFICACIÓN DE DOCUMENTOS?", "opciones": {"A": "Por su origen.", "B": "Por su forma y confección.", "C": "Por su objetividad.", "D": "Por su contenido y finalidad."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Decreto 232/2000, de 21 de noviembre, de Archivos de la CAE", "articulo": "Art. 4", "explicacion": "La clasificación documental se efectúa con base en criterios funcionales u orgánicos; la 'objetividad' es un valor general pero no un principio clasificatorio del cuadro de fondos."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 59, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 2, "bloque_titulo": "Bolsa 2008 - Bloque 2", "bloque_subtitulo": "Organización, Normalización y Archivo (Preguntas 51-76)", "numero_en_examen": 59, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #59)", "estado": "Vigente", "pregunta": "¿QUÉ TÉRMINO PARA DEFINIR LOS DISTINTOS TIPOS DE AGRUPACIONES DOCUMENTALES RESPONDE MEJOR A LO QUE CONOCEMOS POR “UN EXPEDIENTE”?", "opciones": {"A": "Unidad archivística.", "B": "Sección.", "C": "Pieza documental.", "D": "Serie."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Decreto 232/2000, de 21 de noviembre, por el que se aprueban el Reglamento de los Servicios de Archivo de la CAE", "articulo": "Art. 2", "explicacion": "En el vocabulario archivístico oficial de la CAE, se define unidad archivística al elemento indivisible que contiene información homogénea generada en el ejercicio de una misma función o actividad."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 60, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 2, "bloque_titulo": "Bolsa 2008 - Bloque 2", "bloque_subtitulo": "Organización, Normalización y Archivo (Preguntas 51-76)", "numero_en_examen": 60, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #60)", "estado": "Vigente", "pregunta": "¿CÓMO SE LLAMA LA OPERACIÓN POR LA CUAL LA DOCUMENTACIÓN QUE NO SE NECESITA EN UNA OFICINA O ARCHIVO SE ENVÍA A OTRO ARCHIVO?", "opciones": {"A": "Expurgo.", "B": "Finiquito.", "C": "Agregación.", "D": "Transferencia."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Decreto 232/2000, de 21 de noviembre, por el que se aprueban el Reglamento de los Servicios de Archivo de la CAE", "articulo": "Art. 14", "explicacion": "El artículo 14 del Decreto 232/2000 defin eyes»."}, "tema_id": 33, "tema_title": "Tema 33: Revisión de Actos en vía Administrativa y Recursos"}, {"numero": 69, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 2, "bloque_titulo": "Bolsa 2008 - Bloque 2", "bloque_subtitulo": "Organización, Normalización y Archivo (Preguntas 51-76)", "numero_en_examen": 73, "reserva": true, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #73 - Reserva)", "estado": "Vigente", "pregunta": "EN LO REFERIDO AL DOMINIO PÚBLICO:", "opciones": {"A": "Los bienes de dominio público no podrán entrar en el ámbito de los bienes privados de la Administración.", "B": "La excepción a la imprescriptibilidad de los bienes de dominio público será la desafectaci ón tácita.", "C": "Según la Constitución, los bienes de dominio público estatal deberán en todo caso ser determinados por Ley.", "D": "Según el Estatuto de Autonomía del País Vasco son bienes de dominio público de titularid ad de la Comunidad Autónoma, entre otros, los puertos no comerciales y el mar litoral vasco."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Constitución Española de 1978", "articulo": "Art. 132.1 y 132.2 CE", "explicacion": "El artículo 132 de la CE consagra que los bienes de dominio público estatal se regularán inspirándose en los principios de inalienabilidad, imprescriptibilidad e inembargabilidad."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 70, "examen_codigo": "2008", "examen_nombre": "Bolsa de Trabajo de Administrativos 2008", "bloque_id": 2, "bloque_titulo": "Bolsa 2008 - Bloque 2", "bloque_subtitulo": "Organización, Normalización y Archivo (Preguntas 51-76)", "numero_en_examen": 74, "reserva": true, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2008 (Pregunta #74 - Reserva)", "estado": "Vigente", "pregunta": "SEÑALA LA FRASE INCORRECTA:", "opciones": {"A": "Los funcionario titución y Estatuto de Autonomía (Preguntas 1-50)", "numero_en_examen": 1, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #1)", "estado": "Vigente", "pregunta": "EN RELACIÓN CON LA FIGURA DEL DEFENSOR DEL PUEBLO , ES FALSO", "opciones": {"A": "Que sea un Comisionado de las Cortes Generales.", "B": "Que su mandato dure cinco años.", "C": "Que sea elegido por mayoría simple en ambas Cám aras.", "D": "Que pueda interponer recursos de amparo."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Constitución Española de 1978 y Ley Orgánica 3/1981 del Defensor del Pueblo", "articulo": "Art. 54 CE y Art. 2 LO 3/1981", "explicacion": "El Defensor del Pueblo es designado por las Cortes Generales para un periodo de cinco años por una mayoría reforzada de tres quintos del Congreso de los Diputados y ratificado por la misma mayoría de tres quintos del Senado, resultando falso que sea elegido por mayoría simple."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 74, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 3, "bloque_titulo": "OPE 2010 - Bloque 1", "bloque_subtitulo": "Constitución y Estatuto de Autonomía (Preguntas 1-50)", "numero_en_examen": 2, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #2)", "estado": "Vigente", "pregunta": "PUEDEN INTERPONER CUESTIONES DE INCONSTITUCIONALI DAD:", "opciones": {"A": "Los jueces.", "B": "Las personas físicas y jurídicas personadas en un asunto.", "C": "El gobierno de la Nación.", "D": "Cincuenta diputados o cincuenta senadores."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Constitución Española de 1978", "articulo": "Art. 163 CE", "explicacion": "El artículo 163 de la CE establece que cuando un órgano judicial considere que una norma con ación ha sido rechazada, el trámite realizado y continuará la tramitación del procedimiento.", "B": "Si transcurren diez días naturales sin que se acceda al contenido de una solicitud electrónica, se considerará que la notificación ha sido rechazad a, el trámite realizado y continuará la tramitación del procedimiento.", "C": "Si transcurren siete días hábiles sin que se a cceda al contenido de una solicitud electrónica, se considerará que la notificación ha sido rechazad a, el trámite realizado y continuará la tramitación del procedimiento.", "D": "Si transcurren cinco días hábiles sin que se a cceda al contenido de una solicitud electrónica, se considerará que la notificación ha sido rechazad a, el trámite realizado y continuará la tramitación del procedimiento."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común", "articulo": "Art. 43.2", "explicacion": "El artículo 43.2 de la Ley 39/2015 (y el art. 28.3 de la Ley 11/2007) establece que cuando la notificación electrónica esté disponible en la sede o buzón electrónico, se entenderá rechazada si transcurren diez días naturales sin acceder a su contenido."}, "tema_id": 28, "tema_title": "Tema 28: Fuentes del Derecho Administrativo: Ley y Reglamento"}, {"numero": 92, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 3, "bloque_titulo": "OPE 2010 - Bloque 1", "bloque_subtitulo": "Constitución y Estatuto de Autonomía (Preguntas 1-50)", "numero_en_examen": 20, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #20)", "estado": "Vigente", "pregunta": "¿QUÉ DICE LA CONSTITUCIÓN RESPECTO DE LA DELEGAC IÓN LEGISLATIVA?", "opciones": {"A": "La Constitución prohíbe la delegación legislat iva.", "B": "La Constitución prohíbe que la delegación legi slativa verse sobre materias reservadas a la Ley.", "C": "La Constitución
