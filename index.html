taciones."}, "tema_id": 5, "tema_title": "Tema 5: Instituciones Forales y Locales (Concierto Económico, LILE, LTH)"}, {"numero": 298, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 6, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #6)", "estado": "Vigente", "pregunta": "Según establece la Ley por la que se aprueba el Concierto, la aportación del País Vasco al Estado consistirá en un cupo global (indíquese la respuesta INCORRECTA):", "opciones": {"A": "Que está integrado por los correspondientes a cada uno de sus Territorios Históricos como contribución a todas las cargas del Estado que no asuma la Comunidad Autónoma del País Vasco.", "B": "Cuya metodología de señalamiento es aprobada mediante ley votada por las Cortes Generales.", "C": "Cuyo cálculo se aprueba por Ley cada 10 años, previo acuerdo de la Comisión Mixta del Concierto Económico.", "D": "Para cuyo cálculo deberá restarse del cupo correspondiente a cada Territorio Histórico la parte imputable de los tributos no concertados."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 12/2002, de 23 de mayo, del Concierto Económico.", "articulo": "Arts. 48 y 49 Ley 12/2002.", "explicacion": "Es incorrecto porque la metodología del señalamiento del Cupo y la Ley quinquenal de Cupo se aprueba cada **cinco años** (quinquenalmente), no cada 10 años."}, "tema_id": 5, "tema_title": "Tema 5: Instituciones Forales y Locales (Concierto Económico, LILE, LTH)"}, {"numero": 299, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 7, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #7)", "estado": "Vigente", "pregunta": "Las Unidades de Igualdad:", "opciones": {"A": "Son unidades administrativas de coordinación, de carácter informal, creadas por la Ley 4/2005 y reguladas por el Decreto 213/2007, de 26 de diciembre.", "B": "Son unidades administrativas de coordinación, de carácter formal, creadas por la Ley 4/2005 y reguladas por el Decreto 213/2007, de 26 de diciembre.", "C": "Son unidades administrativas de coordinación que forman parte de Emakunde.", "D": "Son unidades administrativas de coordinación que forman parte de Berdinsarea."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 4/2005 para la Igualdad de Mujeres y Hombres y Decreto 213/2007.", "articulo": "Art. 12 Ley 4/2005 y Art. 1 Decreto 213/2007.", "explicacion": "Las unidades para la igualdad son estructuras o unidades administrativas de coordinación y asesoramiento técnico de **carácter formal**, creadas por el art. 12 de la Ley 4/2005 y reguladas por el Decreto 213/2007, existentes en cada Departamento del Gobierno Vasco."}, "tema_id": 6, "tema_title": "Tema 6: Igualdad de Mujeres y Hombres (Ley 4/2005 y Ley 1/2022)"}, {"numero": 300, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 8, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #8)", "estado": "Vigente", "pregunta": "Indique qué tipo de contenido NO es exigible como mínimo en una sede electrónica:", "opciones": {"A": "Tablón de anuncios y edictos.", "B": "Formulario de sugerencias y quejas.", "C": "Fecha y hora oficial.", "D": "Perfil del contratante."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 40/2015 (art. 38) y Real Decreto 203/2021 (Reglamento de actuación electrónica).", "articulo": "Art. 11 Real Decreto 203/2021.", "explicacion": "El perfil de contratante se aloja en la Plataforma de Contratación Pública (Ley 9/2017), pudiendo existir enlace directo desde la sede, pero entre el contenido obligatorio mínimo intrínseco de la sede figuran la identificación, fecha/hora oficial, catálogo de trámites, canal de sugerencias/quejas y tablón de anuncios."}, "tema_id": 7, "tema_title": "Tema 7: Administración Electrónica y Sede Electrónica"}, {"numero": 301, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 9, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #9)", "estado": "Vigente", "pregunta": "En particular, los medios o soportes donde se almacenen los documentos de un expediente asegurarán:", "opciones": {"A": "La identificación de los usuarios y el control de accesos.", "B": "La identificación de los interesados.", "C": "La firma de los interesados.", "D": "La posibilidad de hacer copias en papel."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 39/2015 del Procedimiento Administrativo Común.", "articulo": "Art. 70.3 Ley 39/2015.", "explicacion": "\"Los medios o soportes en que se almacenen documentos deberán contar con medidas de seguridad que garanticen la integridad, autenticidad, confidencialidad, calidad, protección y conservación de los documentos almacenados. En particular, asegurarán la identificación de los usuarios y el control de accesos...\""}, "tema_id": 21, "tema_title": "Tema 21: El Documento y Expediente Administrativo Electrónico"}, {"numero": 302, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 10, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #10)", "estado": "Vigente", "pregunta": "En el marco de la normalización lingüística, corresponde al Instituto Vasco de Administración Pública (IVAP), entre otras, las siguientes tareas:", "opciones": {"A": "Ampliar la oferta de formación generalista en euskera y continuar suministrando recursos para apoyar a las y los empleados en la normalización del euskera.", "B": "Coordinar todos los planes y organizar el seguimiento de los mismos así como su evaluación final.", "C": "Intercambiar experiencias en materia de normalización lingüística y poner en marcha proyectos conjuntos.", "D": "Acreditar la obtención del certificado BIKAIN."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 16/1983 sobre creación y regulación del IVAP y Decreto 86/1997.", "articulo": "Art. 3 Ley 16/1983 / Planes de Normalización del Euskera en la CAE.", "explicacion": "Corresponde al IVAP la formación y capacitación lingüística del personal empleado público de las administraciones vascas, facilitando recursos formativos y materiales de apoyo."}, "tema_id": 8, "tema_title": "Tema 8: Normalización Lingüística del uso del Euskera (Decreto 86/1997)"}, {"numero": 303, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 11, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #11)", "estado": "Vigente", "pregunta": "De acuerdo con el Estatuto Básico del Empleado Público (Real Decreto Legislativo 5/2015, de 30 de octubre), cuál de las siguientes retribuciones NO percibirán los funcionarios interinos:", "opciones": {"A": "Pagas extraordinarias.", "B": "Complemento por la progresión alcanzada dentro del sistema de carrera administrativa.", "C": "Complemento por el grado de interés, iniciativa o esfuerzo con el que desarrolla su trabajo.", "D": "Trienios."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Real Decreto Legislativo 5/2015 (TREBEP).", "articulo": "Art. 25 y Art. 16-17 TREBEP.", "explicacion": "El TREBEP reconoce a los interinos las retribuciones básicas (incluidos trienios, art. 25.2), pagas extras y complementos del puesto/productividad. La carrera horizontal/progresión en la carrera administrativa requiere la condición de funcionario de carrera (art. 16.2), salvo los supuestos de equiparación por jurisprudencia posterior no contemplados como derecho originario en el texto legal del TREBEP en su redacción inicial."}, "tema_id": 9, "tema_title": "Tema 9: Personal Empleado Público: Clases, derechos, deberes y régimen disciplinario"}, {"numero": 304, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 12, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #12)", "estado": "Vigente", "pregunta": "En relación con el consentimiento en materia de tratamiento de datos personales, puede afirmarse que:", "opciones": {"A": "El responsable del tratamiento de datos debe ser capaz de acreditar que el interesado consintió, sea de forma activa o pasiva, el tratamiento de sus datos.", "B": "El interesado no tiene derecho a retirar en cualquier momento el consentimiento prestado.", "C": "Los menores de edad no pueden dar su consentimiento válidamente en ningún caso.", "D": "El consentimiento debe consistir en una manifestación de voluntad inequívoca por la que interesado acepta, ya sea mediante una declaración o una clara acción afirmativa, el tratamiento de datos personales que le conciernen."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Reglamento (UE) 2016/679 (RGPD) y Ley Orgánica 3/2018 (LOPDGDD).", "articulo": "Art. 4.11 RGPD y Art. 6 LOPDGDD.", "explicacion": "El consentimiento debe ser libre, específico, informado e inequívoco, expresado mediante una declaración o una clara acción afirmativa (no cabe el consentimiento tácito o pasivo)."}, "tema_id": 10, "tema_title": "Tema 10: Protección de Datos Personales (LOPDGDD / RGPD)"}, {"numero": 305, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 13, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #13)", "estado": "Vigente", "pregunta": "Si hay más de una empresa o administración presentes en un mismo centro de trabajo, quien tiene la obligación de informar sobre las medidas de emergencia y extinción de incendios del lugar de trabajo es:", "opciones": {"A": "La autoridad sanitaria del territorio en que radique el centro de trabajo principal de la empresa o administración correspondiente.", "B": "El titular del centro de trabajo.", "C": "La autoridad laboral de la provincia en que radique el centro de trabajo principal de la empresa o administración correspondiente.", "D": "Los servicios de extinción de incendios y primeros auxilios del municipio en que se encuentre el centro de trabajo."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 31/1995 de Prevención de Riesgos Laborales y Real Decreto 171/2004 de Coordinación de Actividades Empresariales.", "articulo": "Art. 24.2 Ley 31/1995.", "explicacion": "\"El empresario titular del centro de trabajo adoptará las medidas necesarias para que aquellos otros empresarios que desarrollen actividades en su centro de trabajo reciban la información y las instrucciones adecuadas... sobre las medidas de emergencia a aplicar.\""}, "tema_id": 11, "tema_title": "Tema 11: Prevención de Riesgos Laborales (Ley 31/1995)"}, {"numero": 306, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 14, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #14)", "estado": "Vigente", "pregunta": "A la hora de prestar primeros auxilios a una persona accidentada o enferma hay que actuar siguiendo unas pautas básicas que responden a:", "opciones": {"A": "La regla PAS: proteger a la persona accidentada o enferma llevándola a un lugar seco y que no esté en la intemperie; avisar a los servicios sanitarios y socorrerla.", "B": "La regla PES: proteger a la persona accidentada o enferma llevándola a un lugar seco y que no esté a la intemperie; escuchar a la persona para saber qué le sucede y transmitirlo rápidamente a los servicios médicos y socorrerla siguiendo un orden de prioridades.", "C": "La regla PAS: proteger el lugar de los hechos, avisar en cuanto sea posible a los servicios sanitarios y socorrer a la víctima siguiendo un orden de prioridades.", "D": "La regla PAS: proteger a la persona accidentada o enferma llevándola a un lugar seco y que no esté a la intemperie, abrigar a esa persona para que mantenga el calor corporal y socorrerla siguiendo un orden de prioridades."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Manual Oficial de Primeros Auxilios IVAP / Código Penal", "articulo": "Protocolo PAS y Art. 195 CP", "explicacion": "La regla de oro ante cualquier accidente o auxilio es el protocolo PAS: Proteger (a la víctima y a uno mismo de nuevos peligros), Avisar (a los servicios de emergencia 112) y Socorrer (aplicar los primeros auxilios necesarios sin sobrepasar los conocimientos)."}, "tema_id": 13, "tema_title": "Tema 13: Nociones Básicas de Primeros Auxilios"}, {"numero": 307, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 15, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #15)", "estado": "Vigente", "pregunta": "La transparencia gubernamental consiste en que:", "opciones": {"A": "La información sobre las actividades de los organismos públicos sea creada y esté a disposición de la ciudadanía, sin excepciones, de manera oportuna y en formatos de datos abiertos sin límites para la utilización.", "B": "La información sobre las actividades de los organismos públicos sea creada y esté a disposición de la ciudadanía, con excepciones limitadas, de manera oportuna y en formatos de datos abiertos sin límites para la utilización.", "C": "La respuesta a las solicitudes de información realizada por la ciudadanía debe realizarse inmediatamente.", "D": "El acceso a cualquier información por parte de la ciudadanía es totalmente libre."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 19/2013 de Transparencia y Ley 3/2026 de Transparencia de Euskadi.", "articulo": "Arts. 14 y 15 Ley 19/2013.", "explicacion": "El acceso a la información pública es la regla general, pero está sujeto a **excepciones tasadas y limitadas** (seguridad, protección de datos personales, intereses económicos y comerciales, procesos judiciales)."}, "tema_id": 14, "tema_title": "Tema 14: Gobierno Abierto, Buen Gobierno y Transparencia (Ley 19/2013 y Ley 3/2026)"}, {"numero": 308, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 16, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #16)", "estado": "Vigente", "pregunta": "La autorización del gasto:", "opciones": {"A": "Es el acto por el cual se formaliza, una vez efectuados los trámites legales que sean procedentes, la realización concreta de obras, la prestación o suministro de bienes y servicios o subvenciones, con la consiguiente reserva del crédito de pago por el importe y condiciones exactamente determinadas.", "B": "Se entiende por tal la operación por la que el responsable expide, en relación con una obligación contraída, el mandamiento de pago contra la Tesorería General del País Vasco.", "C": "Es la operación de registrar en cuentas los créditos o cantidades exigibles por motivo de que haya sido acreditada satisfactoriamente la prestación objeto de la «Disposición» o el cumplimiento de las condiciones acordadas o establecidas al respecto.", "D": "Es el acto por el cual se acuerda su realización por importe máximo, cierto o aproximado con cargo a un determinado crédito de pago, reservando a tal fin la totalidad o una parte disponible del mismo."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2011 (Régimen Presupuestario de Euskadi).", "articulo": "Art. 43.1 D. Leg. 1/2011.", "explicacion": "La autorización (fase A) es el acto administrativo por el que se acuerda la realización de un gasto con cargo a un crédito de pago por cuantía cierta o aproximada, reservando a tal fin el crédito presupuestario disponible."}, "tema_id": 15, "tema_title": "Tema 15: Presupuesto de Gastos: Ejecución, Créditos y Fases (D. Leg. 1/2011)"}, {"numero": 309, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 17, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #17)", "estado": "Vigente", "pregunta": "La gestión de todos los ingresos que forman parte del presupuesto y las distintas operaciones que se realizan con los mismos es lo que se denomina:", "opciones": {"A": "Ejecución del presupuesto.", "B": "Autorización del presupuesto.", "C": "Remisión del presupuesto.", "D": "Intervención del presupuesto."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2011 de Régimen Presupuestario de Euskadi.", "articulo": "Art. 51 D. Leg. 1/2011.", "explicacion": "La ejecución del presupuesto de ingresos comprende la gestión, liquidación, contraimiento y recaudación de los derechos económicos de la Hacienda General del País Vasco."}, "tema_id": 16, "tema_title": "Tema 16: Presupuesto de Ingresos: Fases y Devoluciones (D. Leg. 1/2011)"}, {"numero": 310, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 18, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #18)", "estado": "Vigente", "pregunta": "Al cierre de un ejercicio presupuestario, todos los saldos de derechos reconocidos en dicho ejercicio pendientes de recaudación y no anulados:", "opciones": {"A": "Se cargan al siguiente ejercicio, pero no de forma automática, a través de un proceso contable llamado «Ejecución de residuos».", "B": "Se eliminan en el siguiente ejercicio de forma automática, a través de un proceso contable llamado «Eliminación de residuos».", "C": "Se cargan al siguiente ejercicio de forma automática, a través de un proceso contable llamado «Paso de pendientes».", "D": "Se cargan al siguiente ejercicio de forma automática, a través de un proceso contable llamado «Paso de residuos»."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2011, de 24 de mayo, del Régimen Presupuestario de Euskadi", "articulo": "Art. 56 D. Leg. 1/2011", "explicacion": "El artículo 56 del TR de la Ley de Régimen Presupuestario de Euskadi consagra el principio de anualidad presupuestaria: al cierre del ejercicio presupuestario, los créditos que no estén vinculados al cumplimiento de obligaciones reconocidas quedarán anulados de pleno derecho."}, "tema_id": 16, "tema_title": "Tema 16: Presupuesto de Ingresos: Fases y Devoluciones (D. Leg. 1/2011)"}, {"numero": 311, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 19, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #19)", "estado": "Vigente", "pregunta": "Los principios constitucionales con arreglo a los cuales se llevará a cabo el acceso al empleo público son los siguientes:", "opciones": {"A": "Publicidad, transparencia e imparcialidad y profesionalidad de los miembros de los órganos de selección.", "B": "Igualdad, mérito y capacidad.", "C": "Igualdad, mérito, capacidad y transparencia.", "D": "Publicidad de las convocatorias e imparcialidad y profesionalidad de los miembros de los órganos de selección."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Constitución Española de 1978 y TREBEP.", "articulo": "Art. 23.2 y 103.3 CE; Art. 55.1 TREBEP.", "explicacion": "Los principios consagrados expresamente en la Constitución Española como rectores del acceso a la función pública son **igualdad, mérito y capacidad**. Los demás son principios rectores legales de selección."}, "tema_id": 9, "tema_title": "Tema 9: Personal Empleado Público: Clases, derechos, deberes y régimen disciplinario"}, {"numero": 312, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 20, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #20)", "estado": "Vigente", "pregunta": "De acuerdo con el Estatuto Básico del Empleado Público (Real Decreto Legislativo 5/2015, de 30 de octubre), el procedimiento de libre designación como procedimiento de provisión de puestos de trabajo del personal funcionario de carrera:", "opciones": {"A": "No requiere de convocatoria pública puesto que se trata de un procedimiento en el que el órgano competente apreciará discrecionalmente la idoneidad del candidato.", "B": "Constituye el procedimiento ordinario de provisión de puestos de trabajo del personal funcionario de carrera.", "C": "Podrá utilizarse para la provisión de cualquier puesto de trabajo de personal funcionario.", "D": "Requerirá en todo caso una convocatoria pública en la que se deberán especificar los requisitos exigidos para el desempeño del puesto."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "TREBEP (Real Decreto Legislativo 5/2015).", "articulo": "Art. 80.2 TREBEP.", "explicacion": "\"La libre designación con convocatoria pública consiste en la apreciación discrecional por el órgano competente de la idoneidad de los candidatos en relación con los requisitos exigidos para el desempeño del puesto. Las convocatorias incluirán los requisitos fijados en la relación de puestos de trabajo...\""}, "tema_id": 18, "tema_title": "Tema 18: Acceso al Empleo Público y Provisión de Puestos (Ley 11/2022 y TREBEP)"}, {"numero": 313, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 21, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #21)", "estado": "Vigente", "pregunta": "¿Qué datos identificativos mínimos deben de llevar las cajas de documentos (unidades de instalación) del sistema de archivos?", "opciones": {"A": "Área competencial, identificador alfanumérico y años extremos de la documentación que contiene.", "B": "Departamento, serie e identificador alfanumérico.", "C": "Departamento, unidad productora, serie e identificador alfanumérico.", "D": "Área competencial, servicio, número de caja y fechas extremas."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Decreto 232/2000, de 21 de noviembre, de Archivos de la CAE", "articulo": "Art. 16 Decreto 232/2000", "explicacion": "La carpetilla de un expediente debe reflejar los elementos identificativos esenciales mínimos: número de expediente, título o extracto del asunto, fechas extremas de inicio y término, y unidad orgánica productora."}, "tema_id": 19, "tema_title": "Tema 19: Gestión Documental y Archivos en la CAE (Decreto 232/2000)"}, {"numero": 314, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 22, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #22)", "estado": "Vigente", "pregunta": "Si se consultan los datos del padrón de habitantes de un Ayuntamiento a través de las plataformas de intermediación de datos, el resultado tiene consideración de:", "opciones": {"A": "Volante de empadronamiento.", "B": "Documento electrónico de empadronamiento.", "C": "Certificado de empadronamiento.", "D": "Fichero de datos de intermediación."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común", "articulo": "Art. 28.2 Ley 39/2015", "explicacion": "El artículo 28.2 de la Ley 39/2015 autoriza a las Administraciones a consultar o recabar directamente los datos del padrón de habitantes a través de las plataformas de intermediación de datos, sin exigir al interesado la aportación física del volante o certificado de empadronamiento."}, "tema_id": 20, "tema_title": "Tema 20: Registros Electrónicos e Interoperabilidad"}, {"numero": 315, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 23, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #23)", "estado": "Vigente", "pregunta": "¿Qué es un documento electrónico?", "opciones": {"A": "Información de cualquier naturaleza archivada en un soporte y susceptible de identificación y tratamiento diferenciado.", "B": "Información archivada en un soporte electrónico según un formato determinado y susceptible de identificación y tratamiento diferenciado.", "C": "Objeto digital administrativo que contiene la información objeto (datos) y los datos asociados a ésta (firma y metadatos).", "D": "Información de cualquier naturaleza en forma electrónica, archivada en un soporte electrónico según un formato determinado y susceptible de identificación y tratamiento diferenciado."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015 del Procedimiento Administrativo Común.", "articulo": "Art. 26.1 Ley 39/2015.", "explicacion": "\"Se entiende por documentos administrativos administrativos válidos los emitidos por escrito, a través de medios electrónicos... que contengan información de cualquier naturaleza en forma electrónica, archivada en un soporte electrónico según un formato determinado y susceptible de identificación y tratamiento diferenciado.\""}, "tema_id": 21, "tema_title": "Tema 21: El Documento y Expediente Administrativo Electrónico"}, {"numero": 316, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 24, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #24)", "estado": "Vigente", "pregunta": "¿Cuál de los siguientes aspectos SÍ es un principio fundamental de la gestión de la excelencia en la gestión de organizaciones:", "opciones": {"A": "La orientación a los principios fundacionales.", "B": "El liderazgo y constancia en los resultados.", "C": "El desarrollo de publicidad.", "D": "La gestión por procesos y hechos."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Real Decreto 1112/2018 sobre accesibilidad de los sitios web y aplicaciones para dispositivos móviles del sector público", "articulo": "Pautas WCAG 2.1 / RD 1112/2018", "explicacion": "Las directrices internacionales de accesibilidad web (WCAG 2.1) establecen 4 principios fundamentales: Perceptible, Operable, Comprensible y Robusto."}, "tema_id": 19, "tema_title": "Tema 19: Gestión Documental y Archivos en la CAE (Decreto 232/2000)"}, {"numero": 317, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 25, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #25)", "estado": "Vigente", "pregunta": "La Ley 19/2013, de 9 de diciembre, de transparencia, acceso a la información pública y buen gobierno:", "opciones": {"A": "Reconoce el acceso a la información pública sin límite alguno.", "B": "Ordena el acceso a la información pública con algunos límites, entre los que cabe destacar las relaciones exteriores y la igualdad de las partes en los procesos judiciales y la tutela judicial efectiva.", "C": "Ordena el acceso a la información pública con algunos límites, entre los que cabe destacar el principio de solidaridad, irretroactividad y mínima intervención.", "D": "Condiciona el acceso a la información pública al pago de las correspondientes tasas locales e impuestos estatales."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 19/2013 de Transparencia, Acceso a la Información Pública y Buen Gobierno.", "articulo": "Art. 14.1 apartados c) y f) Ley 19/2013.", "explicacion": "El art. 14 de la Ley 19/2013 limita el derecho de acceso cuando perjudique a las relaciones exteriores, la seguridad pública, la prevención y sanción de ilícitos, y la igualdad de las partes en los procesos judiciales y la tutela judicial efectiva."}, "tema_id": 14, "tema_title": "Tema 14: Gobierno Abierto, Buen Gobierno y Transparencia (Ley 19/2013 y Ley 3/2026)"}, {"numero": 318, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 26, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #26)", "estado": "Vigente", "pregunta": "La accesibilidad cognitiva:", "opciones": {"A": "Requiere que la Administración Pública prepare a las personas que prestan el servicio con relación a las necesidades de los diferentes colectivos, adecuando su actuación a dichas necesidades específicas.", "B": "No otorga importancia a la lectura fácil, entendiéndola como elemento menor y secundario.", "C": "No exige la adaptación a las capacidades de todas las personas con problemas de lectura y escritura.", "D": "Requiere que la Administración Pública utilice un lenguaje complejo e indirecto."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Criterios de Accesibilidad Universal y Lectura Fácil", "articulo": "Norma UNE 153010:2012 y Ley 39/2015", "explicacion": "La accesibilidad cognitiva tiene como finalidad hacer el entorno, los documentos y los servicios comprensibles y utilizables para todas las personas, prestando especial atención a personas con dificultades de comprensión o discapacidad intelectual."}, "tema_id": 24, "tema_title": "Tema 24: Atención a la Ciudadanía, Quejas y Sugerencias"}, {"numero": 319, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 27, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #27)", "estado": "Vigente", "pregunta": "La lectura en la web (en pantalla):", "opciones": {"A": "Es igual que la lectura ordinaria en papel.", "B": "Ha cambiado los hábitos de lectura, en cuanto los textos en pantalla no se leen de la misma manera que en papel.", "C": "Resulta más cómoda en todo caso.", "D": "Exige que los textos se redacten según los patrones de los textos en papel."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Guía de Comunicación Web del Gobierno Vasco", "articulo": "Manual de Usabilidad y Estilo Web IVAP", "explicacion": "Diversos estudios de seguimiento ocular (eyetracking) demuestran que la lectura en pantallas digitales sigue predominantemente un patrón en forma de 'F', escaneando primero las líneas superiores horizontales y bajando por el margen izquierdo."}, "tema_id": 25, "tema_title": "Tema 25: Comunicación Escrita y Notificaciones Administrativas"}, {"numero": 320, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 28, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #28)", "estado": "Vigente", "pregunta": "A la disciplina que estudia los aspectos no semánticos del lenguaje, como el volumen de la voz, los silencios o el ritmo con el que se habla, se le denomina:", "opciones": {"A": "Proxémica.", "B": "Kinésica.", "C": "Paralingüística.", "D": "Parasemántica."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Manual IVAP Tema 26 - Comunicación Oral", "articulo": "Doctrina de Comunicación No Verbal IVAP", "explicacion": "La paralingüística es la disciplina auxiliar de la comunicación no verbal que estudia los elementos vocales no semánticos de la voz (tono, volumen, ritmo, entonación, pausas y silencios)."}, "tema_id": 26, "tema_title": "Tema 26: Comunicación Oral y No Verbal (Atención presencial y telefónica)"}, {"numero": 321, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 29, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #29)", "estado": "Vigente", "pregunta": "La ISBD (Descripción Bibliográfica Internacional Normalizada) recoge una serie de normas internacionales sobre la forma y el contenido de los datos a consignar en:", "opciones": {"A": "La descripción bibliográfica de un documento.", "B": "La indización de un documento o determinación de puntos de acceso.", "C": "La signatura topográfica de un documento.", "D": "El registro de un documento."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Manual IVAP Tema 27 - Documentación y Bibliotecas", "articulo": "Normas IFLA e ISBD", "explicacion": "La ISBD (International Standard Bibliographic Description / Descripción Bibliográfica Internacional Normalizada) es la norma internacional formulada por la IFLA que establece la puntuación, estructura y áreas para la catalogación uniforme de materiales bibliográficos."}, "tema_id": 27, "tema_title": "Tema 27: Centros de Documentación y Bibliotecas (Ley 11/2007)"}, {"numero": 322, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 30, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #30)", "estado": "Vigente", "pregunta": "¿Cuál de las siguientes afirmaciones es, de acuerdo con la Constitución, INCORRECTA?:", "opciones": {"A": "Las Cortes Generales podrán delegar en el Gobierno la potestad de dictar normas con rango de ley mediante una ley de delegación.", "B": "Las Cortes Generales podrán delegar en el Gobierno la potestad de dictar normas con rango de ley, pero no en cualquier materia.", "C": "La Constitución contempla la existencia de otras normas que, sin ser leyes en sentido estricto (realizadas por las Cortes), tienen su mismo rango y fuerza.", "D": "El art. 82 CE permite a las Cortes atribuir al Gobierno, mediante una ley de delegación, la potestad de dictar una norma con fuerza de ley denominada decreto-ley."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Constitución Española de 1978.", "articulo": "Arts. 82 y 86 CE.", "explicacion": "Es la afirmación incorrecta porque la delegación de las Cortes al Gobierno da lugar a un **Decreto Legislativo** (art. 82 CE). El **Decreto-ley** (art. 86 CE) emana directamente de la potestad extraordinaria del Gobierno ante circunstancias de extraordinaria y urgente necesidad, sin delegación previa de las Cortes."}, "tema_id": 28, "tema_title": "Tema 28: Fuentes del Derecho Administrativo: Ley y Reglamento"}, {"numero": 323, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 31, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #31)", "estado": "Vigente", "pregunta": "La estructura organizativa actual de la Comunidad Autónoma del País Vasco:", "opciones": {"A": "Se elabora a partir de la Ley 7/1981 de Gobierno y del Decreto Legislativo 1/1997 por el que se aprueba el Texto Refundido de la Ley de Principios Ordenadores de la Hacienda General del País Vasco.", "B": "Viene recogida en la Ley 40/2015 de Régimen Jurídico del Sector Público.", "C": "Viene detallada en el Estatuto de Autonomía.", "D": "Está regulada en el Estatuto de Autonomía y en la Ley 40/2015 de Régimen Jurídico del Sector Público."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 7/1981, de Gobierno, y normativa de organización de la CAE", "articulo": "Ley 7/1981 y Decretos de Estructura Orgánica", "explicacion": "La estructura central de la Administración General de la CAE se organiza departamentalmente bajo la dirección del Lehendakari y los Consejeros, articulándose internamente en Viceconsejerías y Direcciones sectoriales."}, "tema_id": 4, "tema_title": "Tema 4: Organización política y administrativa de la CAE"}, {"numero": 324, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 32, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #32)", "estado": "Vigente", "pregunta": "Es un acto administrativo:", "opciones": {"A": "Una reclamación de responsabilidad patrimonial de la Administración.", "B": "Una propuesta de resolución sancionadora.", "C": "Una obra municipal.", "D": "Una solicitud de licencia para abrir un bar."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015 del Procedimiento Administrativo Común.", "articulo": "Arts. 34 y ss. Ley 39/2015.", "explicacion": "La propuesta de resolución es un acto administrativo de trámite cualificado dictado por el instructor. La solicitud y la reclamación son actos de particulares interesados; la obra municipal es una actuación material (hecho)."}, "tema_id": 30, "tema_title": "Tema 30: El Acto Administrativo: Eficacia, Nulidad y Anulabilidad"}, {"numero": 325, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 33, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #33)", "estado": "Vigente", "pregunta": "La incompetencia jerárquica manifiesta en la adopción de un acto administrativo:", "opciones": {"A": "Conlleva la anulabilidad.", "B": "Conlleva la nulidad.", "C": "Se trataría de una irregularidad no invalidante.", "D": "Conlleva la anulabilidad solo si el órgano es además incompetente por razón de la materia."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 39/2015 del Procedimiento Administrativo Común.", "articulo": "Art. 47.1.b y Art. 48 y 52 Ley 39/2015.", "explicacion": "El art. 47.1.b declara nulos de pleno derecho solo los actos dictados por órgano manifiestamente incompetente por razón de la **materia o del territorio**. La incompetencia **jerárquica** es un vicio de **mera anulabilidad**, subsanable por el superior jerárquico mediante convalidación (art. 52.3)."}, "tema_id": 30, "tema_title": "Tema 30: El Acto Administrativo: Eficacia, Nulidad y Anulabilidad"}, {"numero": 326, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 34, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #34)", "estado": "Vigente", "pregunta": "La finalidad de la abstención y recusación es:", "opciones": {"A": "Garantizar la imparcialidad de las decisiones administrativas.", "B": "Que en los procedimientos administrativos únicamente intervengan las personas que tengan los conocimientos requeridos en cada caso.", "C": "Que las resoluciones administrativas adoptadas en los procedimientos administrativos sean siempre expresas.", "D": "Garantizar el acceso al expediente de las personas interesadas."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 40/2015 de Régimen Jurídico del Sector Público.", "articulo": "Arts. 23 y 24 Ley 40/2015.", "explicacion": "El régimen de abstención y recusación busca garantizar la objetividad, neutralidad e **imparcialidad** de las autoridades y empleados públicos en la toma de decisiones administrativas."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 327, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 35, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #35)", "estado": "Vigente", "pregunta": "Una de las manifestaciones del principio de congruencia de la resolución que pone fin al procedimiento administrativo es que:", "opciones": {"A": "Si surgen materias conexas no planteadas por las personas interesadas, la Administración también las puede resolver sin necesidad de abrir un nuevo trámite de audiencia.", "B": "La Administración no está obligada a resolver cuando las normas aplicables son insuficientes.", "C": "La resolución no puede empeorar la situación jurídica de la persona que interpone un recurso ante la Administración.", "D": "La Administración se ha de limitar a resolver únicamente lo pedido por las personas interesadas."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015 del Procedimiento Administrativo Común.", "articulo": "Art. 88.2 y Art. 119.3 Ley 39/2015.", "explicacion": "\"En los procedimientos tramitados a solicitud del interesado, la resolución será congruente con las peticiones formuladas por éste, sin que en ningún caso pueda agravar su situación inicial\" (prohibición de la *reformatio in peius*)."}, "tema_id": 32, "tema_title": "Tema 32: Desarrollo y Fases del Procedimiento Administrativo Común"}, {"numero": 328, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 36, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #36)", "estado": "Vigente", "pregunta": "La resolución de un recurso de alzada:", "opciones": {"A": "Puede ser objeto de un recurso de reposición porque agota la vía administrativa.", "B": "No puede recurrirse en vía jurisdiccional.", "C": "Solo se interpone contra actos expresos.", "D": "Debe realizarse y notificarse en el plazo máximo de tres meses."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015 del Procedimiento Administrativo Común.", "articulo": "Art. 122.2 Ley 39/2015.", "explicacion": "\"El plazo máximo para dictar y notificar la resolución será de tres meses. Transcurrido este plazo sin que recaiga resolución, se podrá entender desestimado el recurso...\" Contra la resolución de una alzada no cabe ningún otro recurso administrativo ordinario, salvo el extraordinario de revisión."}, "tema_id": 33, "tema_title": "Tema 33: Revisión de Actos en vía Administrativa y Recursos"}, {"numero": 329, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 37, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #37)", "estado": "Vigente", "pregunta": "Para que la Administración Pública responda con su patrimonio de los daños causados a un particular:", "opciones": {"A": "Debe existir necesariamente una relación de causalidad entre el daño causado y la actividad administrativa causante del daño.", "B": "No siempre es necesario que exista una relación de causalidad entre el daño causado y la actividad administrativa causante del daño.", "C": "La legislación vigente establece que cualquier causa que contribuya al resultado final debe considerarse como causa del daño.", "D": "No es necesario que exista ninguna relación de causalidad entre el daño causado y la actividad administrativa causante del daño."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 40/2015 de Régimen Jurídico del Sector Público.", "articulo": "Art. 32.1 y Art. 32.2 Ley 40/2015.", "explicacion": "El daño alegado debe ser efectivo, evaluable económicamente e individualizado, y debe existir nexo causal directo entre la lesión y el funcionamiento de los servicios públicos."}, "tema_id": 34, "tema_title": "Tema 34: Responsabilidad Patrimonial de las Administraciones Públicas"}, {"numero": 330, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 38, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #38)", "estado": "Vigente", "pregunta": "Para buscar resultados contenidos en ficheros de un tipo determinado con Google se utiliza:", "opciones": {"A": "filetype:", "B": "infile:", "C": "filerequest:", "D": "documenttype:"}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Estándares de Búsqueda y Gestión de Archivos", "articulo": "Manual de Búsqueda Avanzada en Sistemas Informáticos", "explicacion": "El asterisco (*) y la interrogación (?) son los caracteres comodín estandarizados utilizados en sistemas informáticos para sustituir cadenas de caracteres múltiples o un único carácter en nombres y contenidos de ficheros."}, "tema_id": 1, "tema_title": "Tema 1: Constitución Española: derechos y libertades fundamentales"}, {"numero": 331, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 39, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #39)", "estado": "Vigente", "pregunta": "Los programas informáticos que proporcionan una interfaz de usuario para administrar archivos y directorios se denominan de diversas maneras. Entre ellas NO está:", "opciones": {"A": "Gestor de archivos.", "B": "Administrador de archivos.", "C": "Compilador de archivos.", "D": "Explorador de archivos."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Manual de Informática Básica IVAP", "articulo": "Fundamentos de Sistemas Informáticos IVAP", "explicacion": "El software de sistema operativo es el programa fundamental que administra los recursos de hardware y proporciona una interfaz para que el usuario y las aplicaciones interactúen con el ordenador."}, "tema_id": 1, "tema_title": "Tema 1: Constitución Española: derechos y libertades fundamentales"}, {"numero": 332, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 40, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #40)", "estado": "Vigente", "pregunta": "Exponentes del tipo de comunicación síncrona son:", "opciones": {"A": "Los correos electrónicos.", "B": "Los blogs.", "C": "Los grupos de noticias.", "D": "Las videoconferencias."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Manual IVAP Tema 7 y 26", "articulo": "Herramientas de Comunicación Electrónica IVAP", "explicacion": "La comunicación síncrona es aquella que acontece en tiempo real e interactivo entre los interlocutores (como la mensajería instantánea, el chat o la videoconferencia), a diferencia de la asíncrona (como el correo electrónico)."}, "tema_id": 26, "tema_title": "Tema 26: Comunicación Oral y No Verbal (Atención presencial y telefónica)"}, {"numero": 333, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 9, "bloque_titulo": "OPE 2022 - Parte B (Opción 1)", "bloque_subtitulo": "Supuestos Prácticos: Archivos, Contabilidad CAE y Personal", "numero_en_examen": 50, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #50)", "estado": "Vigente", "pregunta": "Una Administración precisa identificarse electrónicamente, como tal Administración, en un acto administrativo. ¿Cómo podrá hacerlo?", "opciones": {"A": "Redactando el acto, para su firma, bajo membrete del órgano que precisa identificarse.", "B": "La identificación se derivará, siempre, de la firma electrónica de la persona titular de ese órgano.", "C": "Mediante el uso de un sello electrónico basado en un certificado electrónico reconocido o cualificado que reúna los requisitos exigidos por la legislación de firma electrónica.", "D": "La Administración nunca se identifica electrónicamente."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 40/2015 de Régimen Jurídico del Sector Público.", "articulo": "Art. 40 Ley 40/2015.", "explicacion": "Las Administraciones Públicas podrán utilizar para su identificación electrónica y para la autenticación de los documentos administrativos electrónicos sellos electrónicos basados en certificados reconocidos o cualificados."}, "tema_id": 22, "tema_title": "Tema 22: Firma y Certificación Electrónica (Ley 39/2015)"}, {"numero": 334, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 9, "bloque_titulo": "OPE 2022 - Parte B (Opción 1)", "bloque_subtitulo": "Supuestos Prácticos: Archivos, Contabilidad CAE y Personal", "numero_en_examen": 51, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #51)", "estado": "Vigente", "pregunta": "Según la legislación de Función Pública Vasca, el sueldo del personal funcionario público:", "opciones": {"A": "No es un concepto legal específico retributivo del personal funcionario.", "B": "Son sus retribuciones mensuales totales.", "C": "Son sus retribuciones básicas totales.", "D": "Es una de las retribuciones básicas."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "TREBEP y Ley de Función Pública / Empleo Público Vasco.", "articulo": "Art. 23 TREBEP y Art. 115 Ley 11/2022.", "explicacion": "Las retribuciones básicas son los componentes retributivos fijados en función de la adscripción al Grupo/Subgrupo y la antigüedad; están integradas por el **sueldo** y los **trienios**."}, "tema_id": 9, "tema_title": "Tema 9: Personal Empleado Público: Clases, derechos, deberes y régimen disciplinario"}, {"numero": 335, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 9, "bloque_titulo": "OPE 2022 - Parte B (Opción 1)", "bloque_subtitulo": "Supuestos Prácticos: Archivos, Contabilidad CAE y Personal", "numero_en_examen": 52, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #52)", "estado": "Vigente", "pregunta": "Una funcionaria va a redactar la información básica de protección de datos de un tratamiento. ¿Cuál de las siguientes cuestiones NO es preciso incluir en esta información básica?", "opciones": {"A": "La finalidad del tratamiento.", "B": "La identidad de la persona responsable del tratamiento.", "C": "Los datos de contacto de la persona Delegada de Protección de datos.", "D": "La posibilidad de ejercer el derecho de supresión."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley Orgánica 3/2018 (LOPDGDD).", "articulo": "Art. 11 LOPDGDD.", "explicacion": "En la información básica (primera capa) debe figurar la identidad del responsable, la finalidad del tratamiento y la posibilidad de ejercer los derechos de acceso, rectificación, supresión y demás; los datos detallados del Delegado de Protección de Datos (DPD) se consignan en la información adicional (segunda capa)."}, "tema_id": 10, "tema_title": "Tema 10: Protección de Datos Personales (LOPDGDD / RGPD)"}, {"numero": 336, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 9, "bloque_titulo": "OPE 2022 - Parte B (Opción 1)", "bloque_subtitulo": "Supuestos Prácticos: Archivos, Contabilidad CAE y Personal", "numero_en_examen": 53, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #53)", "estado": "Vigente", "pregunta": "Su departamento ha editado una revista, el precio de cada ejemplar trimestral es de 11,54€. Según la ley de tasas y precios públicos, ¿en qué momento es exigible la cantidad de 11,54€?", "opciones": {"A": "En el momento en que se hace entrega del ejemplar de la revista.", "B": "En el momento en que finalizado el plazo voluntario de pago, éste no se ha producido.", "C": "En el momento de la formalización de la suscripción de la revista.", "D": "En el momento de su recaudación."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2011, de 24 de mayo, del Régimen Presupuestario de Euskadi", "articulo": "Art. 49 D. Leg. 1/2011", "explicacion": "La venta de publicaciones, libros o revistas editadas por departamentos de la Administración genera un ingreso público que se clasifica económicamente en el Capítulo 3 de Tasas, precios públicos y otros ingresos."}, "tema_id": 16, "tema_title": "Tema 16: Presupuesto de Ingresos: Fases y Devoluciones (D. Leg. 1/2011)"}, {"numero": 337, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 9, "bloque_titulo": "OPE 2022 - Parte B (Opción 1)", "bloque_subtitulo": "Supuestos Prácticos: Archivos, Contabilidad CAE y Personal", "numero_en_examen": 54, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #54)", "estado": "Vigente", "pregunta": "De acuerdo a la clasificación económica del presupuesto, ¿en qué capítulo de operaciones corrientes se deben recoger este tipo de ingresos?", "opciones": {"A": "Capítulo 4 de Transferencias y subvenciones recibidas para operaciones de capital.", "B": "Capítulo 1 de Operaciones de Capital.", "C": "Capítulo 7 de Transferencias y subvenciones recibidas para gastos corrientes.", "D": "Capítulo 3 de Tasas, Precios Públicos y otros ingresos de Derecho Público."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2011, de 24 de mayo, del Régimen Presupuestario de Euskadi", "articulo": "Art. 48 D. Leg. 1/2011", "explicacion": "Los gastos derivados de la adquisición de material de oficina o suministros no inventariables se imputan presupuestariamente al Capítulo 2: Gastos corrientes en bienes y servicios."}, "tema_id": 16, "tema_title": "Tema 16: Presupuesto de Ingresos: Fases y Devoluciones (D. Leg. 1/2011)"}, {"numero": 338, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 9, "bloque_titulo": "OPE 2022 - Parte B (Opción 1)", "bloque_subtitulo": "Supuestos Prácticos: Archivos, Contabilidad CAE y Personal", "numero_en_examen": 55, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #55)", "estado": "Vigente", "pregunta": "Un empleado del Gobierno Vasco le solicita un documento que acredite que ha realizado un curso de formación organizado por su Departamento. ¿Qué tipo de documento debe preparar?", "opciones": {"A": "Un correo electrónico.", "B": "Un certificado.", "C": "Una resolución.", "D": "Una notificación."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Decreto 232/2000, de 21 de noviembre, de Archivos de la CAE", "articulo": "Art. 22 Decreto 232/2000", "explicacion": "El préstamo de documentos y expedientes custodiados en archivos centrales o intermedios a las oficinas gestoras exige la formalización del correspondiente impreso de préstamo con constancia de la unidad solicitante y plazo de devolución."}, "tema_id": 25, "tema_title": "Tema 25: Comunicación Escrita y Notificaciones Administrativas"}, {"numero": 339, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 9, "bloque_titulo": "OPE 2022 - Parte B (Opción 1)", "bloque_subtitulo": "Supuestos Prácticos: Archivos, Contabilidad CAE y Personal", "numero_en_examen": 56, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #56)", "estado": "Vigente", "pregunta": "El Departamento de Seguridad ha formalizado un contrato menor de 14.999 euros (sin IVA) con la empresa Ikasbide para la impartición de 5 cursos online sobre seguridad vial, a celebrar en distintas fechas durante el presente ejercicio. En la tramitación presupuestaria de los documentos contables, ¿en qué momento surge la figura del tercero, la empresa Ikasbide?:", "opciones": {"A": "En el acto en el que se acuerda autorizar el gasto.", "B": "En el momento en que el responsable expide el mandamiento de pago contra la Tesorería General del País Vasco.", "C": "En la disposición del gasto, en el acto en el cual se formaliza la realización concreta de obras, la prestación o suministro de bienes y servicios o subvenciones.", "D": "Al finalizar la impartición de los 5 cursos."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2011 de Régimen Presupuestario de Euskadi.", "articulo": "Art. 44 D. Leg. 1/2011.", "explicacion": "En la fase de Disposición o Compromiso (fase D) se formaliza el acuerdo con una persona física o jurídica determinada (el tercero acreedor), individualizándolo con su CIF/NIF y fijando las condiciones exactas de la prestación."}, "tema_id": 15, "tema_title": "Tema 15: Presupuesto de Gastos: Ejecución, Créditos y Fases (D. Leg. 1/2011)"}, {"numero": 340, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 9, "bloque_titulo": "OPE 2022 - Parte B (Opción 1)", "bloque_subtitulo": "Supuestos Prácticos: Archivos, Contabilidad CAE y Personal", "numero_en_examen": 57, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #57)", "estado": "Vigente", "pregunta": "¿Qué documento contable es necesario contabilizar al formalizar el contrato con la empresa Ikasbide?", "opciones": {"A": "Documento A para autorizar el gasto.", "B": "Documento O de mandamiento de pago contra la Tesorería General del País Vasco para pagar los cursos.", "C": "Documento AD para autorizar el gasto y disponer de la prestación de forma simultánea.", "D": "Documento R para registrar el derecho reconocido."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2011, de 24 de mayo, del Régimen Presupuestario de Euskadi", "articulo": "Art. 57.a D. Leg. 1/2011", "explicacion": "Para iniciar el proceso de gasto público y reservar formalmente el crédito previsto, el primer documento contable a tramitar y registrar es el documento 'A' de Autorización del gasto."}, "tema_id": 15, "tema_title": "Tema 15: Presupuesto de Gastos: Ejecución, Créditos y Fases (D. Leg. 1/2011)"}, {"numero": 341, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 9, "bloque_titulo": "OPE 2022 - Parte B (Opción 1)", "bloque_subtitulo": "Supuestos Prácticos: Archivos, Contabilidad CAE y Personal", "numero_en_examen": 58, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #58)", "estado": "Vigente", "pregunta": "IL, funcionario de un departamento del Gobierno Vasco, ha encontrado en un armario varias cajas con copias de documentos contables de los años 2015 y 2016, ¿qué tratamiento deberían recibir dichas cajas?", "opciones": {"A": "Inventariar y transferir todas las cajas al archivo general.", "B": "Expurgar todas las cajas.", "C": "Expurgar únicamente las de 2016.", "D": "Guardarlas donde están hasta que cumplan 10 años."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Decreto 232/2000, de 21 de noviembre, de Archivos de la CAE", "articulo": "Art. 14 Decreto 232/2000", "explicacion": "El pase periódico y documentado de expedientes administrativos desde los archivos de oficina al Archivo Central del departamento se lleva a cabo mediante el procedimiento de transferencia documental con su correspondiente relación de entrega."}, "tema_id": 19, "tema_title": "Tema 19: Gestión Documental y Archivos en la CAE (Decreto 232/2000)"}, {"numero": 342, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 9, "bloque_titulo": "OPE 2022 - Parte B (Opción 1)", "bloque_subtitulo": "Supuestos Prácticos: Archivos, Contabilidad CAE y Personal", "numero_en_examen": 59, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #59)", "estado": "Vigente", "pregunta": "FG ha interpuesto recurso de reposición contra la resolución en la que se desestima una reclamación de responsabilidad patrimonial de la Administración. Después de 4 meses no ha recibido respuesta alguna, ¿cómo debe entenderse el silencio administrativo?", "opciones": {"A": "Como silencio positivo.", "B": "Como silencio negativo.", "C": "Como silencio estimatorio.", "D": "No hay silencio administrativo."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015 del Procedimiento Administrativo Común.", "articulo": "Art. 24.1, párrafo cuarto y Art. 124.2 Ley 39/2015.", "explicacion": "El plazo para resolver el recurso potestativo de reposición es de un mes. Transcurrido dicho plazo sin dictarse resolución, el silencio tiene carácter **desestimatorio (negativo)**, quedando expedita la vía contencioso-administrativa."}, "tema_id": 30, "tema_title": "Tema 30: El Acto Administrativo: Eficacia, Nulidad y Anulabilidad"}, {"numero": 343, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 9, "bloque_titulo": "OPE 2022 - Parte B (Opción 1)", "bloque_subtitulo": "Supuestos Prácticos: Archivos, Contabilidad CAE y Personal", "numero_en_examen": 60, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #60)", "estado": "Vigente", "pregunta": "IL, funcionario del Departamento de Desarrollo Económico, Sostenibilidad y Medio Ambiente, en régimen de teletrabajo va a asistir a una reunión hoy desde su domicilio por medio de una aplicación a la que todos los trabajadores y trabajadoras de la administración vasca tienen acceso ¿cuál es?", "opciones": {"A": "Zoom.", "B": "Teams.", "C": "Eventwo.", "D": "Eizu."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Criterios de Comunicación Digital del Gobierno Vasco", "articulo": "Guía de Estilo del Correo Electrónico Institucional IVAP", "explicacion": "Al redactar correos electrónicos institucionales se debe consignar un asunto claro y descriptivo, utilizar saludo y despedida protocolarios, cuidar la ortografía y evitar expresiones coloquiales o emoticonos inadecuados."}, "tema_id": 1, "tema_title": "Tema 1: Constitución Española: derechos y libertades fundamentales"}, {"numero": 344, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 61, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #61)", "estado": "Vigente", "pregunta": "Al finalizar la reunión IL debe enviar unos documentos por correo electrónico a los técnicos del departamento, ¿cómo es aconsejable que incluya los nombres y apellidos de las personas en el correo electrónico?", "opciones": {"A": "En la casilla cco.", "B": "En la casilla cc.", "C": "En la casilla “para”.", "D": "En correo encriptado."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Política de Seguridad de la Información del Gobierno Vasco", "articulo": "Esquema Nacional de Seguridad (RD 311/2022) y RGPD", "explicacion": "El envío de documentos adjuntos que contengan datos personales o sensibles debe efectuarse por canales corporativos seguros y cifrados para preservar la confidencialidad frente a interceptaciones no autorizadas."}, "tema_id": 10, "tema_title": "Tema 10: Protección de Datos Personales (LOPDGDD / RGPD)"}, {"numero": 345, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 62, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #62)", "estado": "Vigente", "pregunta": "¿Qué es lo que NO debe hacer IL al redactar un correo electrónico?", "opciones": {"A": "Rellenar el asunto, y que sea claro, corto y concreto.", "B": "Escribir en mayúscula todo el texto.", "C": "Solicitar la confirmación de lectura del correo electrónico.", "D": "Utilizar frases cortas y sencillas."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Reglas de Comunicación Escrita Digital", "articulo": "Netiqueta y Libro de Estilo Digital IVAP", "explicacion": "En las normas de netiqueta y cortesía telemática, la escritura continuada en letras MAYÚSCULAS en el cuerpo de un mensaje equivale a GRITAR al interlocutor, estando desaconsejada en las comunicaciones institucionales."}, "tema_id": 25, "tema_title": "Tema 25: Comunicación Escrita y Notificaciones Administrativas"}, {"numero": 346, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 63, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #63)", "estado": "Vigente", "pregunta": "JR funcionario interino del Organismo Autónomo LANBIDE, necesita sustituir una resolución original de la Dirección, en formato papel por un documento electrónico con valor jurídico administrativo, ¿cómo debe proceder?", "opciones": {"A": "Para ello deberá dirigirse a IZENPE.", "B": "Se deberá crear la copia electrónica auténtica por medio de un componente de digitalización segura, primeramente, y posteriormente se procederá a la destrucción del documento original.", "C": "Se deberá crear la copia electrónica auténtica por medio de un componente de digitalización segura y conservar el documento original.", "D": "Se escaneará el original y el responsable de Servicio lo firmará digitalmente."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015 del Procedimiento Administrativo Común.", "articulo": "Art. 27.3 Ley 39/2015 y Esquema Nacional de Interoperabilidad.", "explicacion": "Las copias electrónicas auténticas a partir de originales en papel se realizan mediante procesos de digitalización segura que garantizan metadatos y firma del órgano facultado; una vez obtenida la copia con plena validez jurídica, la norma prevé la destrucción reglamentada del papel de apoyo conforme al plan de archivos."}, "tema_id": 21, "tema_title": "Tema 21: El Documento y Expediente Administrativo Electrónico"}, {"numero": 347, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 64, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #64)", "estado": "Vigente", "pregunta": "JR debe firmar unos documentos digitalmente, ¿cuáles son los certificados de firma de los empleados y empleadas públicos al servicio de las administraciones públicas vascas?", "opciones": {"A": "Tarjeta IZENPE de empleado y PIN.", "B": "“Giltza profesional” Certificado en la nube con password y una clave de un solo uso.", "C": "Docusign.", "D": "La a y la b son correctas."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común", "articulo": "Art. 10 Ley 39/2015", "explicacion": "Los empleados públicos autorizados deben firmar los actos y documentos oficiales mediante su certificado electrónico cualificado de firma de empleado público emitido por prestadores de servicios de confianza admitidos (como Izenpe)."}, "tema_id": 22, "tema_title": "Tema 22: Firma y Certificación Electrónica (Ley 39/2015)"}, {"numero": 348, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 65, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #65)", "estado": "Vigente", "pregunta": "IN está redactando un oficio ¿cuál de las siguientes opciones es la más recomendada para expresar el lugar y la fecha?", "opciones": {"A": "Vitoria, 20-5-22", "B": "Vitoria/Gasteiz, a 20 de mayo de 2.022", "C": "Vitoria-Gasteiz a 20 de mayo de 2.022", "D": "Vitoria-Gasteiz, 20 de mayo de 2022"}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Estructura Normalizada del Oficio Administrativo", "articulo": "Manual IVAP Tema 25 - Comunicación Escrita", "explicacion": "El oficio es una comunicación escrita formal entre órganos de la Administración que consta de encabezamiento, referencia, texto expositivo, datación, antefirma y firma del titular del órgano remitente."}, "tema_id": 25, "tema_title": "Tema 25: Comunicación Escrita y Notificaciones Administrativas"}, {"numero": 349, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 66, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #66)", "estado": "Vigente", "pregunta": "Le piden que obtenga información sobre el número de hombres y mujeres residentes en la Comunidad Autónoma. ¿A qué página acudiría?", "opciones": {"A": "A la de Emakunde.", "B": "A la del Eustat.", "C": "A la de Lanbide.", "D": "A la de Gogora."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Aplicaciones Informáticas de Oficina", "articulo": "Manual de Hojas de Cálculo y Tratamiento de Datos IVAP", "explicacion": "En aplicaciones de hoja de cálculo (Excel / Calc), la función para contabilizar el número de celdas que contienen valores numéricos o que cumplen una determinada condición es CONTAR o CONTAR.SI."}, "tema_id": 4, "tema_title": "Tema 4: Organización política y administrativa de la CAE"}, {"numero": 350, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 67, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #67)", "estado": "Vigente", "pregunta": "Recibe un correo electrónico con un archivo con extensión jpg. Por tanto sabremos que es un archivo de:", "opciones": {"A": "Imagen.", "B": "Vídeo.", "C": "Texto.", "D": "Audio."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Manual de Prevención de Incidentes Informáticos", "articulo": "Política de Ciberseguridad del Gobierno Vasco", "explicacion": "Los archivos adjuntos de correo con extensiones ejecutables directas (.exe, .bat, .cmd, .scr) presentan un riesgo crítico de contener malware o código malicioso, debiendo ser bloqueados o no ejecutados por el usuario."}, "tema_id": 1, "tema_title": "Tema 1: Constitución Española: derechos y libertades fundamentales"}, {"numero": 351, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 68, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #68)", "estado": "Vigente", "pregunta": "La combinación de teclas Ctrl + C nos permite…", "opciones": {"A": "Cortar el texto seleccionado.", "B": "Eliminar el texto seleccionado.", "C": "Copiar el texto seleccionado.", "D": "Pegar el texto copiado."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Guía de Eficiencia Ofimática IVAP", "articulo": "Atajos de Teclado Universales", "explicacion": "La combinación estándar de teclas Ctrl + C ejecuta el comando de copiar los elementos o textos seleccionados al portapapeles del sistema operativo."}, "tema_id": 1, "tema_title": "Tema 1: Constitución Española: derechos y libertades fundamentales"}, {"numero": 352, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 69, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #69)", "estado": "Vigente", "pregunta": "Su directora le solicita que organice una reunión de una hora, por Teams, el próximo lunes, con objeto de informar sobre un programa de ayudas que va a convocar el Departamento. Para ello necesitará:", "opciones": {"A": "Saber el número de asistentes, reservar una sala y conocer la hora de la reunión.", "B": "Saber el nombre de los asistentes y reservar una sala con equipamiento audiovisual.", "C": "Saber el correo electrónico de los asistentes y la hora de la reunión.", "D": "Teams no es una herramienta adecuada para reuniones ya que es una plataforma de chats."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Herramientas de Trabajo Colaborativo del Gobierno Vasco", "articulo": "Manual de Gestión de Calendarios y Correo Electrónico", "explicacion": "Para concertar una reunión institucional eficaz se utiliza la herramienta de calendario compartida enviando una convocatoria formal con fecha, hora, sala o enlace virtual y orden del día adjunto."}, "tema_id": 1, "tema_title": "Tema 1: Constitución Española: derechos y libertades fundamentales"}, {"numero": 353, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 80, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #80)", "estado": "Vigente", "pregunta": "El Gobierno Vasco se encuentra con una obligación de pago que deriva de una sentencia firme que no tiene la debida cobertura presupuestaria ¿Cuándo debe proceder al pago?", "opciones": {"A": "No debe proceder al pago hasta que los próximos presupuestos establezcan la partida correspondiente.", "B": "Una vez se doten los fondos necesarios, de acuerdo con la normativa presupuestaria.", "C": "Inmediatamente tras la recepción del testimonio de la sentencia firme.", "D": "En el plazo de dos meses desde la recepción del testimonio de la sentencia firme."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Decreto Legislativo 1/2011 de Régimen Presupuestario de Euskadi y LJCA.", "articulo": "Art. 21 D. Leg. 1/2011.", "explicacion": "Si no existiera crédito suficiente en el presupuesto en vigor para cumplir la obligación de pago derivad
