": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 151, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #151)", "estado": "Vigente", "pregunta": "EL ÓRGANO COMPETENTE OTORGA DETERMINADAS AYUDAS AGRARIAS. CIERTA COOPERATIVA CONSIDERA QUE ESA RESOLUCIÓN RES ULTA DISCRIMINATORIA. INTERPONE EL RECURSO ADMINISTRATIV O PERTINENTE Y SOLICITA EN ÉL LA SUSPENSIÓN DE LA EFICACIA DEL ACTO IMPUGNADO. TREINTA DÍAS DESPUÉS, LA ADMINISTRACIÓN NO SE HA PR ONUNCIADO SOBRE TAL SOLICITUD. ANTE LA CONSULTA SOBRE LA CONSECUENCIA JURÍDICA DER IVADA DE ESE SILENCIO, ¿CUÁL SERÍA SU RESPUESTA?", "opciones": {"A": "Que la eficacia del acto se entenderá automát icamente suspendida.", "B": "Que la suspensión de la eficacia del acto se entenderá automáticamente levantada.", "C": "Que el recurso se entenderá automáticamente e stimado.", "D": "Que el acto impugnado se entenderá automática mente anulado."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común", "articulo": "Art. 39.1 y Art. 117.1", "explicacion": "La interposición de un recurso administrativo no suspende por sí misma la eficacia ni la ejecución del acto impugnado, el cual es inmediatamente ejecutivo conforme a la regla general de presunción de validez."}, "tema_id": 29, "tema_title": "Tema 29: Órganos Administrativos y Colegiados (Ley 40/2015 y Ley 3/2022)"}, {"numero": 185, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 152, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #152)", "estado": "Vigente", "pregunta": "CIERTA SOCIEDAD ANÓNIMA PRESENTÓ ANTE LA ADMINI STRACIÓN UNA RECLAMACIÓN POR DAÑOS Y PERJUICIOS. TRANSCURRIDO EL PLAZO LEGALMENTE ESTABLECIDO PARA E LLO, EL ÓRGANO ADMINISTRATIVO COMPETENTE ÁUN NO LE HABÍA RESPONDIDO. PRESENTÓ ENTONCES EL OPORTUNO RECURSO ADMINISTRATIV O PERO, TRES MESES MÁS TARDE, SIGUE SIN RECIBIR NINGUNA RESPUEST A DE LA ADMINISTRACIÓN. EN TAL SITUACIÓN ¿QUÉ HA DE ENTENDERSE?", "opciones": {"A": "Que el recurso ha sido estimado por silencio administrativo positivo.", "B": "Que el recurso ha sido desestimado por silenc io administrativo positivo.", "C": "Que el recurso ha sido estimado por silencio administrativo negativo.", "D": "Que el recurso ha sido desestimado por silenc io administrativo negativo."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común", "articulo": "Art. 24.1 y 122.1", "explicacion": "Transcurrido el plazo máximo para resolver el recurso administrativo sin que recaiga resolución expresa, el recurrente podrá entender desestimado su recurso por silencio administrativo negativo."}, "tema_id": 29, "tema_title": "Tema 29: Órganos Administrativos y Colegiados (Ley 40/2015 y Ley 3/2022)"}, {"numero": 186, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 153, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #153)", "estado": "Vigente", "pregunta": "LA ADMINISTRACIÓN CONVOCA UNAS OPOSICIONES. AL APARECER LA LISTA DE ADMITIDOS, SE ADVIERTE QUE UNA DE LAS ASPIRANTES TIENE PARENTESCO CON EL SECRETARIO DEL T RIBUNAL DE SELECCIÓN. POR ESTE MOTIVO, VARIOS OPOSITORES PRESENTAN ESCRIT O DE RECUSACIÓN CONTRA EL SECRETARIO. ¿ALTERA EN ALG AP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #171)", "estado": "Vigente", "pregunta": "¿QUÉ DEBERÍA HACERSE CON LAS PONENCIAS DE VARIO S CONGRESOS CELEBRADOS EN EL ESTADO A LOS QUE ASISTIÓ EL DIRECT OR O DIRECTORA DEL IVAP ENTRE LOS AÑOS 2000 Y 2003?", "opciones": {"A": "Transferirlos al archivo con la descripción d e “documentación del Director o Directora”.", "B": "Expurgarlos, ya que se trata de documentación de apoyo.", "C": "Transferirlos al archivo con la descripción d e “Congresos”.", "D": "Ninguna de las opciones es la correcta."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Decreto 232/2000, de 21 de noviembre, de Archivos de la CAE", "articulo": "Art. 18", "explicacion": "Los folletos, programas y ponencias de congresos tienen carácter de documentación informativa de apoyo temporal, susceptible de eliminación y expurgo en la oficina sin formalidades complejas."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 205, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 172, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #172)", "estado": "Vigente", "pregunta": "¿QUÉ TRATAMIENTO DEBERIAN RECIBIR LAS CAJAS CON LAS COPIAS DE DOCUMENTOS DEL REGISTRO DE ENTRADA Y DE SALIDA DE LOS AÑOS 2008 Y 2009?", "opciones": {"A": "Expurgar las entradas e inventariar las salid as para su transferencia al archivo.", "B": "Expurgar las salidas e inventariar las entrad as para su transferencia al archivo.", "C": "Expurgar todas las cajas.", "D": "Inventariar y transferir todas las cajas."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Decreto 232/2000, de 21 de noviembre, de Archivos de la CAE", "articulo": "Art. 18", "explicacion": "Las copias simples o duplicados de facturas o documentos contables que no constituyen originales primarios forman parte de documentación auxiliar susceptible de expurgo directo."}, "tema_id": 21, "tema_title": "Tema 21: El Documento y Expediente Administrativo Electrónico"}, {"numero": 206, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 173, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #173)", "estado": "Vigente", "pregunta": "¿QUÉ TRATAMIENTO DEBERIAN RECIBIR LAS CAJAS CON DOCUMENTOS CONTABLES, ORGANIZADOS POR NÚMERO DE APUNTE CONTABL E, DE LOS GASTOS DEL ORGANISMO DE LOS AÑOS 2000 A 2007?", "opciones": {"A": "Inventariarlas y transferirlas al archivo cor respondiente.", "B": "Expurgarlas por tratarse de copias.", "C": "Expurgar la documentación de más de 5 años y conservar el resto.", "D": "Ordenarlas cronológicamente, inventariarlas y transferirlas al archivo correspondiente."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Decreto 232/2000, de 21 de noviembre, de Archivos de la CAE", "articulo": "Art. 18", "explicacion": "Las copias o duplicados conservados de forma innecesaria en la oficina se deben destruir o expurgar para no sobrecargar el espacio del archivo de gestión."}, "tema_id": 15, "tema_title": "Tema 15: Presupuesto de Gastos: Ejecución, Créditos y Fases (D. Leg. 1/2011)"}, {"numero": 207, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 174, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #174)", "estado": "Vigente", "pregunta": "¿QUÉ TRATAMIENTO DEBERIAN RECIBIR LOS DOSSIERES DE PRENSA DE LAS ACTIVIDADES DEL IVAP?", "opciones": {"A": "Al tratarse de documentación de la Dirección, deben archivarse.", "B": "Al tratarse de documentación de apoyo, deben destruirse.", "C": "Al tratarse de dossieres, deben organizarse c ronológicamente.", "D": "Al tratarse de documentación administrativa, deben archivarse. \u0001 \u0001 \u0001 \u0001 \u0001 \u0001 \u0001 \u0001 CASO Nº 4.- Mikel A. entrega un recurso dirigido al Departamento de Justicia y Administración Pública del Gobierno Vasco, en el re gistro general del Gobierno de Navarra. En dicho registro no le dan entrada al doc umento argumentando que no es el registro del órgano competente para resolverlo. Mikel A. se dirige, entonces, al registro del Ayunt amiento de Vitoria-Gasteiz donde, en virtud de convenio de colaboración, le registran el recurso con fecha de 28 de julio de 2010. Posteriormente, el recurso llega al registro genera l central de la Administración de la Comunidad Autónoma del País Vasco, que le da como f echa de entrada la del 1 de agosto de 2010. El recurso presentado es desestimado por el órgano competente, aduciendo que se había presentado fuera de plazo, ya que la fecha de entrada en el registro general central de la Administración de la Comunidad Autónoma del P aís Vasco ha superado en 3 días el plazo máximo de presentación del recurso (el plazo vencía el 29 de julio). La comunicación de la resolución del recurso se le envía a Mikel A. con el siguiente documento: “Estimado Mikel: Siento comunicarte que presentaste el recurso fuera de plazo, ya que debías haberlo presentado como fecha límite el 29 de julio , pero en el registro general central ha tenido entrada el 1 de agosto. Es por ello que lo hemos desestimado. Un abrazo, El jefe del servicio de inspección (lugar y fecha)”"}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Decreto 232/2000, de 21 de noviembre, de Archivos de la CAE", "articulo": "Art. 18", "explicacion": "Los recortes y dossieres de prensa constituyen documentación de apoyo meramente informativo cuya destrucción física no requiere dictamen de la Comisión de Valoración Documental."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 208, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 175, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #175)", "estado": "Vigente", "pregunta": "¿ES CORRECTA LA ACTUACIÓN DEL REGISTRO DEL GOBI ERNO DE NAVARRA?", "opciones": {"A": "Sí, porque los escritos y documentos deben pr esentarse en el registro del órgano competente para resolverlos.", "B": "Sí, porque siendo otra administración pública necesitaba tener suscrito un convenio de colaboración.", "C": "No, porque entre los registros establecidos e n la Ley 30/1992 para la presentación de escritos dirigidos a las administraciones públicas, debe ent enderse comprendido el registro del Gobierno de Navarra.", "D": "Sí, porque los registros de otras Administrac iones Públicas, según el Decreto 72/2008 tienen sus propias normas de organización, con un funcionamiento independiente."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015 (y precedente Ley 30/1992)", "articulo": "Art. 16.4 LPACAP (Art. 38.4 Ley 30/1992)", "explicacion": "Las personas interesadas pueden presentar documentos en los registros de cualquier administración de una Comunidad Autónoma con la que exista concierto o en el marco de la interconexión registral."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 209, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 176, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #176)", "estado": "Vigente", "pregunta": "¿ES CORRECTO EL CÓMPUTO DE LOS PLAZOS REALIZADO PARA DESESTIMAR EL RECURSO?", "opciones": {"A": "No, porque debió tener en cuenta la fecha de presentación en el registro del Ayuntamiento y no la fecha de entrada en el registro del Departamento competente para resolverlo.", "B": "No, porque una vez que le han dado entrada en el registro del órgano competente, se entiende que lo han admitido como correcto y luego no se puede desestimar por esa causa.", "C": "Sí, porque la fecha en que empiezan a correr los plazos para la resolución del recurso se fija desde la fecha de entrada en el registro del órgano competente para su resolución.", "D": "Sí, porque una vez que el registro del Gobier no de Navarra no admitió el documento se entiende que no era correcto. \u0001 \u0001 \u0001 \u0001 \u0001 \u0001 \u0001 \u0001"}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común", "articulo": "Art. 31 y Art. 68", "explicacion": "La fecha válida que determina la tempestividad de una presentación efectuada por el ciudadano en cualquier registro habilitado es la fecha y hora de entrada en dicho registro inicial, no la de su posterior recepción interna."}, "tema_id": 33, "tema_title": "Tema 33: Revisión de Actos en vía Administrativa y Recursos"}, {"numero": 210, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 177, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #177)", "estado": "Vigente", "pregunta": "¿EL ESCRITO DE COMUNICACIÓN ES EL ADECUADO?", "opciones": {"A": "No, porque, siendo una carta, el saludo, la d espedida y el tono no son los correctos.", "B": "No, porque, siendo una notificación, el salud o, la despedida y el tono no son los correctos.", "C": "Sí, porque el saludo, la despedida y el tono utilizados contribuyen a personalizar y a acercarnos al receptor del escrito, según indican las normas de calidad del lenguaje.", "D": "Sí, porque se da la información directamente y se omiten las referencias legales que enturbian y hacen incomprensibles los textos."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Manual IVAP Tema 25 - Comunicación Escrita y Notificaciones", "articulo": "Modelos de Notificación Administrativa", "explicacion": "En las notificaciones formales de actos o resoluciones no se incluyen fórmulas de cortesía epistolar personal (saludos o despedidas informales) al tratarse de un acto formal de traslado resolutorio."}, "tema_id": 25, "tema_title": "Tema 25: Comunicación Escrita y Notificaciones Administrativas"}, {"numero": 211, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 178, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #178)", "estado": "Vigente", "pregunta": "¿CUÁL DE LAS SIGUIENTES OPCIONES CONSIDERA QUE ES LA MÁS ADECUADA PARA EXPRESAR EL LUGAR Y LA FECHA?", "opciones": {"A": "Vitoria, 19-8-2010.", "B": "Vitoria-Gasteiz a 19 de Agosto del 2010.", "C": "En Vitoria-Gasteiz, 19 de agosto del 2.010.", "D": "Vitoria-Gasteiz, 19 de agosto de 2010. CASO Nº 5.- La notificación de la desestimación del recurso se hace de forma electrónica. El departamento ha puesto a disposició n de Mikel A. la notificación el 19 de agosto de 2010. Mikel A., que no había señalado dicho medio electró nico para relacionarse con la administración, el día 10 de septiembre ve que tien e un aviso en su buzón de correo electrónico pero no accede al contenido de la notificación. La administración ha entendido que Mikel A. ha rech azado la notificación y va a enviar la publicación de la misma al Boletín Oficial. \u0001 \u0001 \u0001 \u0001 \u0001 \u0001 \u0001 \u0001 \u0001"}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Manual IVAP Tema 25 - Libro de Estilo", "articulo": "Datación de Documentos Administrativos", "explicacion": "La fórmula oficial recomendada para la fecha en las comunicaciones administrativas de la CAE es: Nombre de la localidad, día del mes en número, 'de' mes en minúscula, 'de' y año en cuatro dígitos (ej. Vitoria-Gasteiz, 19 de agosto de 2010)."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 212, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 179, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #179)", "estado": "Vigente", "pregunta": "¿CUÁNDO SE PUEDEN UTILIZAR SÓLO MEDIOS ELECTRÓN ICOS PARA LAS NOTIFICACIONES A LOS CIUDADANOS Y CIUDADANAS?", "opciones": {"A": "Siempre, porque los planes de modernización a dministrativa requieren de la utilización de los medios electrónicos como preferentes.", "B": "Siempre que lo decida la administración ya qu e es un medio más barato.", "C": "Únicamente cuando la persona interesada haya señalado como preferente o consentido el medio electrónico para relacionarse con la administración.", "D": "Únicamente cuando se desconozca el domicilio de la persona interesada."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común", "articulo": "Art. 14 y Art. 41.1", "explicacion": "Para las personas físicas no obligadas a relacionarse electrónicamente, sólo cabe utilizar medios telemáticos exclusivos cuando el ciudadano haya manifestado expresamente su consentimiento o elegido dicho canal."}, "tema_id": 25, "tema_title": "Tema 25: Comunicación Escrita y Notificaciones Administrativas"}, {"numero": 213, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 180, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #180)", "estado": "Vigente", "pregunta": "¿QUÉ TIPO DE FIRMA DEBIÓ UTILIZARSE EN LA NOTIF ICACIÓN ELECTRÓNICA PRACTICADA?", "opciones": {"A": "La firma avanzada.", "B": "La firma reconocida.", "C": "La firma certificada.", "D": "La firma ordinaria."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015 y Ley 6/2020 de Servicios Electrónicos de Confianza", "articulo": "Art. 43 y Art. 10 LPACAP", "explicacion": "La práctica formal de notificaciones y comunicaciones fehacientes por medios electrónicos requiere el empleo de sistemas de firma electrónica reconocida o cualificada con certificado admitido."}, "tema_id": 22, "tema_title": "Tema 22: Firma y Certificación Electrónica (Ley 39/2015)"}, {"numero": 214, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 181, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #181)", "estado": "Vigente", "pregunta": "¿CUÁNDO SE ENTIENDE QUE UNA NOTIFICACIÓN ELECTR ÓNICA HA SIDO RECHAZADA?", "opciones": {"A": "Cuando haya transcurrido el plazo para recurr ir la resolución sin que se presente ningún recurso.", "B": "Cuando haya transcurrido el plazo de 10 días naturales desde que la persona interesada acceda a su contenido y no haya presentado recurso.", "C": "Nunca, ya que las notificaciones electrónicas no se puede rechazar.", "D": "Cuando hayan transcurrido 10 días naturales d esde la puesta disposición de la notificación sin que la persona interesada haya accedido a su contenido."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común", "articulo": "Art. 43.2", "explicacion": "Se entiende válidamente rechazada la notificación electrónica cuando hayan transcurrido 10 días naturales desde la puesta a disposición de la notificación sin que el destinatario acceda a su contenido."}, "tema_id": 25, "tema_title": "Tema 25: Comunicación Escrita y Notificaciones Administrativas"}, {"numero": 215, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 182, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #182)", "estado": "Vigente", "pregunta": "¿EN EL CASO PRESENTADO, DEBE SUSPENDERSE LA PUB LICACIÓN EN EL BOLETIN OFICIAL Y REALIZARSE UNA NUEVA NOTIFICACION POR MED IOS NO ELECTRÓNICOS?", "opciones": {"A": "No, porque la Ley 30/1992 prevé que tras los intentos de notificación se proceda a la publicación en los boletines oficiales correspondientes.", "B": "No, porque la administración ha realizado la notificación electrónica y, una vez rechazada, debe proceder a la publicación en los boletines oficiales.", "C": "Sí, porque la persona interesada no había señ alado ni consentido el uso de medios electrónicos para relacionarse con la administración.", "D": "Sí, porque una vez rechazada la notificación electrónica debe intentarse la notificación no electrónica. \u0001 \u0001 \u0001 \u0001 \u0001 \u0001 \u0001 \u0001 CASO Nº 6.- El Departamento de Educación tiene pres upuestado 1 millón de euros en crédito de pago para 2010, y 600.000 euros en crédi to de compromiso para 2011, para la construcción de centros escolares. Se va a proceder a la licitación de las obras de co nstrucción de un centro en Vitoria, con un coste estimado en 800.000 euros (200.000 euros para 2010 y 600.000 euros para 2011). Una vez finalizado el proceso de licitación, se pro pone adjudicar las obras a XYZ Empresa Constructora S.A., por un importe de 750.00 0 euros de los cuales se ejecutarán 150.000 en 2010 y 600.000 en 2011. La citada empresa va presentando las siguientes certificaciones de obra (facturas): Octubre 2010: 5.000 euros Noviembre 2010: 45.000 euros Diciembre 2010: 100.000 euros Enero 2011: 200.000 euros Febrero 2011: 200.000 euros Marzo 2011: 200.000 euros Los pagos se realizan de la siguiente forma: En 2010 se abonan las certificaciones de octubre y noviembre y el resto en 2011. Para facilitar los cálculos no se tiene en cuenta la problemática del I.V.A. \u0001 \u0001 \u0001"}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común", "articulo": "Art. 44", "explicacion": "La publicación edictal es estrictamente subsidiaria; si la persona no eligió medios electrónicos o no correspondía la vía edictal previa a intentar la notificación ordinaria en domicilio, procede suspender el anuncio edictal."}, "tema_id": 25, "tema_title": "Tema 25: Comunicación Escrita y Notificaciones Administrativas  p or utilizar un tercero ficticio en la tramitación de los documentos contables. \u0001"}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 9/2017 de Contratos del Sector Público (y D. Leg. 1/2011)", "articulo": "Art. 200 LCSP", "explicacion": "Los contratistas pueden ceder sus derechos de cobro frente a la Administración siempre que conste fehacientemente notificada dicha cesión al órgano competente de la Administración pagadora."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 224, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 191, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #191)", "estado": "Vigente", "pregunta": "¿QUÉ DOCUMENTO CONTABLE ES NECESARIO PARA CONTA BILIZAR LAS VENTAS AL CONTADO POR 1.500 EUROS E IMPUTARLAS AL PRESUPUESTO DE INGRESOS DEL EJERCICIO 2009?", "opciones": {"A": "“RI” para registrar simultáneamente el derech o reconocido y el cobro.", "B": "“R” para registrar el derecho reconocido.", "C": "“MI” para registrar los ingresos recaudados.", "D": "“R/” para registrar la anulación de los derec hos reconocidos."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Manual de Contabilidad Pública de Euskadi", "articulo": "Documentos Contables de Ingresos (RI)", "explicacion": "El documento contable RI se utiliza en el sistema contable para registrar de forma simultánea el reconocimiento del derecho y el cobro o ingreso material al contado."}, "tema_id": 15, "tema_title": "Tema 15: Presupuesto de Gastos: Ejecución, Créditos y Fases (D. Leg. 1/2011)"}, {"numero": 225, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico aso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 198, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #198)", "estado": "Vigente", "pregunta": "¿QUÉ DOCUMENTO CONTABLE ES NECESARIO PARA CONTA BILIZAR LOS COBROS DE 8.000 EUROS EN ENERO DE 2010?", "opciones": {"A": "“MI” con cargo al presupuesto 2009 para regis trar el cobro.", "B": "“RI” con cargo a residuos para registrar el d erecho reconocido y el derecho ingresado.", "C": "“MI” para registrar la recaudación obtenida c orrespondiente a derechos reconocidos en ejercicios anteriores.", "D": "“RR” para el registro en el ejercicio siguien te de los derechos reconocidos en los ejercicios anteriores pendientes de cobro. CASO Nº 8.- Personal del Servicio Técnico de Manten imiento estaba trabajando, en la sección de carpintería, en la víspera de las vacaci ones de Navidad. Por esta razón, trabajaban contra reloj, para terminar toda la tare a pendiente antes de iniciar las vacaciones. En medio de este trajín, Peio tropezó c on un tablón de madera que sobresalía del estante inferior de una de las mesas de trabajo. Después de golpearse la pierna con fuerza, cayó al suelo y un montón de tra stos frenó su desplazamiento. El resto del personal que estaba en el taller acudió a auxiliarlo y vio que Peio estaba aturdido y tenía en la rodilla una herida manchada con serrín. Como no sangraba mucho, le ayudaron a acercase al botiquín, donde le limpia ron la herida con alcohol. Ante las propuestas de vendarle la herida y después llamar a los Servicios Sanitarios, Peio comentó que la herida cicatrizaba antes si se dejab a “al aire” y que estaba perfectamente, así que todo el personal continuó con su trabajo."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Manual de Contabilidad Pública de Euskadi", "articulo": "Documentos de Cobro (MI)", "explicacion": "El documento MI formaliza el movimiento de ingreso de la recaudación materialmente transferida a la Tesorería General."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 232, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 199, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #199)", "estado": "Vigente", "pregunta": "¿CUÁL DE LAS SIGUIENTES AFIRMACIONES CONSIDERA CORRECTA?", "opciones": {"A": "Valorando la importancia de la herida, la sec uencia de actuación ha sido correcta.", "B": "La herida debiera haberse limpiado con agua o xigenada y taparse inmediatamente.", "C": "La actuación ha sido correcta, salvo en no ha ber dado parte a la Mutua de Accidentes de Trabajo.", "D": "Ninguna de las anteriores."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Manual de Primeros Auxilios de la Administración", "articulo": "Técnicas de Actuación ante Urgencias", "explicacion": "En primeros auxilios debe evaluarse con rigor la pertinencia de las actuaciones sin aplicar técnicas invasivas desaconsejadas."}, "tema_id": 22, "tema_title": "Tema 22: Firma y Certificación Electrónica (Ley 39/2015)"}, {"numero": 233, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 200, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #200)", "estado": "Vigente", "pregunta": "¿CUÁL DE LAS SIGUIENTES ACCIONES CONSIDERA QUE DEBIERA TENERSE EN CUENTA?", "opciones": {"A": "Lavar la herida con agua y jabón.", "B": "Dejar al descubierto la herida para favorecer la cicatrización.", "C": "Iniciar de forma inmediata la vacunación anti tetánica.", "D": "Utilizar una pomada antibiótica y tapar la he rida."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Manual de Primeros Auxilios de la Administración", "articulo": "Limpieza y Curación de Heridas Leves", "explicacion": "Ante una herida superficial, la primera actuación indispensable consiste en el lavado profuso con agua corriente y jabón neutro, secando con gasas estériles sin frotar."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 234, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 151-202)", "numero_en_examen": 201, "reserva": false, "origen": "IVAP - Cuerpo Administrativo 2010 - Teórico y Práctico (Pregunta #201)", "estado": "Vigente", "pregunta": "SI LA HERIDA HUBIESE CURSADO CON UNA HEMORRAGIA IMPORTANTE, ¿CUÁL SERÍA LA ACTUACIÓN MÁS ORDENADA?", "opciones": {"A": "Efectuar un torniquete.", "B": "Efectuar la maniobra de Heimlich.", "C": "Tumbar a la persona y tranquilizarla.", "D": "Todas las anteriores."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Manual de Primeros Auxilios de la Administración", "articulo": "Hemorragias y Shock Hipovolémico", "explicacion": "Ante una hemorragia severa es prioritario tumbar a la persona en posición decúbito supino para prevenir el shock, calmarla y ejercer presión directa sobre el foco del sangrado."}, "tema_id": 13, "tema_title": "Tema 13: Nociones Básicas de Primeros Auxilios"}, {"numero": 235, "examen_codigo": "2010", "examen_nombre": "Cuerpo Administrativo 2010 - Teórico y Práctico", "bloque_id": 6, "bloque_titulo": "OPE 2010 - Caso Práctico", "bloque_subtitulo": "Supuestos Prácticos de Gestión (Preguntas 1 uesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 4/2005, de 18 de febrero, para la Igualdad de Mujeres y Hombres (y Ley 1/2022)", "articulo": "Art. 3.4", "explicacion": "El artículo 3.4 de la Ley 4/2005 consagra la acción positiva como un principio general de actuación de los poderes públicos vascos para corregir situaciones patentes de desigualdad de hecho."}, "tema_id": 6, "tema_title": "Tema 6: Igualdad de Mujeres y Hombres (Ley 4/2005 y Ley 1/2022)"}, {"numero": 244, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 9, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #9)", "estado": "Vigente", "pregunta": "¿RESULTA PRECEPTIVO EL INFORME DE EMAKUNDE-INSTITUTO VASCO DE LA MUJER EN LOS PROYECTOS DE NORMAS QUE SE ELABOREN EN EL ÁMBITO DE LA ADMINISTRACIÓN DE LA COMUNIDAD AUTÓNOMA DE EUSKADI?", "opciones": {"A": "Es conveniente, pero no preceptivo.", "B": "No.", "C": "Sí.", "D": "Tan sólo si se trata de anteproyectos de Ley."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 4/2005, de 18 de febrero, para la Igualdad de Mujeres y Hombres", "articulo": "Art. 19.1", "explicacion": "El artículo 19.1 de la Ley 4/2005 preceptúa con carácter preceptivo el informe de impacto de género de Emakunde-Instituto Vasco de la Mujer para los anteproyectos de ley que apruebe el Gobierno Vasco."}, "tema_id": 2, "tema_title": "Tema 2: La organización territorial del Estado y Estatuto de Autonomía de Euskadi"}, {"numero": 245, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 10, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #10)", "estado": "Vigente", "pregunta": "¿LA LEY 40/2015, DE 1 DE OCTUBRE, DE RÉGIMEN JURÍDICO DEL SECTOR PÚBLICO, INCLUYE EXPRESAMENTE ENTRE LOS MOTIVOS DE ABSTENCIÓN “TENER VÍNCULO MATRIMONIAL O SITUACIÓN DE HECHO ASIMILABLE”?", "opciones": {"A": "No expresamente.", "B": "Tan sólo en determinadas circunstancias.", "C": "Únicamente en los procedimientos selectivos.", "D": "Sí."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público (LRJSP)", "articulo": "Art. 2.1", "explicacion": "El artículo 2.1 de la Ley 40/2015 establece explícitamente su aplicación al sector público institucional, el cual incluye a los organismos públicos y entidades de derecho público vinculados o dependientes de las Administraciones Públicas."}, "tema_id": 28, "tema_title": "Tema 28: Fuentes del Derecho Administrativo: Ley y Reglamento"}, {"numero": 246, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 11, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #11)", "estado": "Vigente", "pregunta": "DE ACUERDO CON EL ARTÍCULO 3.1.D) DE LA 40/2015, DE 1 DE OCTUBRE, LAS ADMINISTRACIONES PÚBLICAS DEBERÁN RESPETAR EN SU ACTUACIÓN Y RELACIONES LOS SIGUIENTES PRINCIPIOS:", "opciones": {"A": "Culpabilidad e irretroactividad.", "B": "Legalidad y non bis in ídem.", "C": "Buena fe, confianza legítima y lealtad institucional.", "D": "Proporcionalidad, seguridad jurídica y prescripción."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público (LRJSP)", "articulo": "Art. 3.1.e", "explicacion": "El artículo 3.1.e) de la Ley 40/2015 consagra entre los principios generales de actuación de las Administraciones Públicas los de «buena fe, confianza legítima y lealtad institucional»."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 247, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 12, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #12)", "estado": "Vigente", "pregunta": "CONFORME AL ART. 44 DE LA LEY 39/2015, QUE REGULA LA NOTIFICACIÓN INFRUCTUOSA, CUANDO EN UN PROCEDIMIENTO QUE INSTRUYE LA ADMINISTRACIÓN GENERAL DE LA COMUNIDAD AUTÓNOMA, INTENTADA L A NOTIFICACIÓN NO HUBIERA PODIDO PRACTICARSE:", "opciones": {"A": "La notificación deberá hacerse por medio de un anuncio publicado en el «Boletín Oficial del Estado», sin perjuicio de su publicación facultativa por otros medios.", "B": "La notificación deberá hacerse por medio de un anuncio publicado en el «Boletín Oficial del País Vasco», sin perjuicio de su publicación facultativa por otros medios.", "C": "La notificación deberá hacerse por medio de un anuncio publicado tanto en el «Boletín Oficial del País Vasco» como en el «Boletín Oficial del Estado». sin perjuicio de su publicación facultativa por otros medios.", "D": "La notificación deberá hacerse por medio de un anuncio publicado en el «Boletín Oficial del País Vasco» y en el tablón de edictos del Ayuntamiento del último domicil io del interesado o del Consulado o Sección Consular de la Embajada correspondiente, sin perjuicio de su publicación facultativa por otros medios."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 44", "explicacion": "El artículo 44 de la Ley 39/2015 dispone: «Cuando los interesados en un procedimiento sean desconocidos, se ignore el lugar de la notificación o bien, intentada ésta, no se hubiese podido practicar, la notificación se hará por medio de un anuncio publicado en el Boletín Oficial del Estado»."}, "tema_id": 2, "tema_title": "Tema 2: La organización territorial del Estado y Estatuto de Autonomía de Euskadi"}, {"numero": 248, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 13, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #13)", "estado": "Vigente", "pregunta": "DISPONE EL ART. 40 DE LA LEY 39/2015 EN MATERIA DE NOTIFICACIÓN: SEÑALESE LA INCORRECTA", "opciones": {"A": "Toda notificación deberá ser cursada dentro del plazo de diez días a partir de la fecha en que el acto haya sido dictado.", "B": "Con arreglo al apartado 2 del art. 40, toda notificación deberá contener el texto íntegro de l a resolución, con indicación de si pone fin o no a la vía administrativa, la expresión de los recursos que procedan, en su caso, en vía administrativa y judicial, el órgano ante el que hubieran de presentarse y el plazo para interponerlos, sin perjuicio de que los inter esados puedan ejercitar, en su caso, cualquier otro que estimen procedente.", "C": "A los solos efectos de entender cumplida la obligación del órgano administrativ o de notificar dentro del plazo máximo de duración de los procedimientos, será suficiente la noti ficación que contenga, cuando menos, el texto íntegro de la resolución, así como el intento de no tificación debidamente acreditado.", "D": "Las notificaciones que, aun conteniendo el texto íntegro del acto, omitiesen a lguno de los demás requisitos previstos en el apartado 2 del art. 40, no surtirán efecto en ningún caso."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 40.3", "explicacion": "El artículo 40.3 de la Ley 39/2015 preceptúa: «Las notificaciones que, conteniendo el texto íntegro del acto, omitiesen alguno de los demás requisitos previstos en el apartado anterior, surtirán efecto a partir de la fecha en que el interesado realice actuaciones que supongan el conocimiento del contenido y alcance de la resolución o acto objeto de la notificación, o interponga cualquier recurso que proceda»."}, "tema_id": 25, "tema_title": "Tema 25: Comunicación Escrita y Notificaciones Administrativas"}, {"numero": 249, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 14, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #14)", "estado": "Vigente", "pregunta": "EL ART. 15 DE LA LEY 39/2015 QUE REGULA LA LENGUA DE LOS PROCEDIMIE NTOS ESTABLECE: SEÑALESE LA INCORRECTA", "opciones": {"A": "La lengua de los procedimientos tramitados por la Administración General del E stado será el castellano. Los interesados que se dirijan a los órganos de la Administración Gen eral del Estado con sede en el territorio de una Comunidad Autónoma deberán utilizar preceptivamente el castellano.", "B": "En los procedimientos tramitados por las Administraciones de las Comunidades Autónomas, el uso de la lengua se ajustará a lo previsto en la legislación autonómica correspondiente.", "C": "La Administración Pública instructora deberá traducir al castellano los docum entos, expedientes o partes de los mismos que deban surtir efecto fuera del territorio de l a Comunidad Autónoma y los documentos dirigidos a los interesados que así lo solic iten expresamente. Si debieran surtir efectos en el territorio de una Comunidad Autónoma do nde sea cooficial esa misma lengua distinta del castellano, no será precisa su traducción.", "D": "En los procedimientos tramitados por las Entidades Locales, el uso de la lengua s e ajustará a lo previsto en la legislación autonómica correspondiente."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 15.1", "explicacion": "El artículo 15.1 de la Ley 39/2015 prevé: «La lengua de los procedimientos tramitados por la Administración General del Estado será el castellano. No obstante lo anterior, los interesados que se dirijan a los órganos de la Administración General del Estado con sede en el territorio de una Comunidad Autónoma podrán utilizar también la lengua que sea cooficial en ella»."}, "tema_id": 28, "tema_title": "Tema 28: Fuentes del Derecho Administrativo: Ley y Reglamento"}, {"numero": 250, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 15, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #15)", "estado": "Vigente", "pregunta": "EL ART. 14 DE LA LEY 39/2015 QUE REGULA EL DERECHO Y OBLIGACIÓN DE RELACIONARSE ELECTRÓNICAMENTE CON LAS ADMINISTRACIONES PÚBLICAS DISPONE: SEÑALESE LA RESPUESTA CORRECTA", "opciones": {"A": "Las personas físicas podrán elegir en todo momento si se comunican con las Administraciones Públicas para el ejercicio de sus derechos y obligaciones a través de medios electrónicos o no, salvo que estén obligadas a relacionarse a través de m edios electrónicos con las Administraciones Públicas.", "B": "Las personas jurídicas podrán elegir en todo momento si se comunican con las Administraciones Públicas para el ejercicio de sus derechos y obligaciones a través de medios electrónicos o no.", "C": "Las entidades sin personalidad jurídica podrán elegir en todo momento si se comuni can con las Administraciones Públicas para el ejercicio de sus derechos y obligac iones a través de medios electrónicos o no.", "D": "Los empleados de las Administraciones Públicas podrán elegir en todo momen to si se comunican con las Administraciones Públicas para el ejercicio de sus der echos y obligaciones a través de medios electrónicos o no, salvo que estén obligadas a relacionarse a través de medios electrónicos con las Administraciones Públicas 16 CONFORME AL ART."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 14.1", "explicacion": "El artículo 14.1 de la Ley 39/2015 consagra que «las personas físicas podrán elegir en todo momento si se comunican con las Administraciones Públicas para el ejercicio de sus derechos y obligaciones a través de medios electrónicos o no, salvo que estén obligadas a ello»."}, "tema_id": 28, "tema_title": "Tema 28: Fuentes del Derecho Administrativo: Ley y Reglamento"}, {"numero": 251, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 16, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #16)", "estado": "Vigente", "pregunta": "DE LA LEY 39/2015, LOS DOCUMENTOS QUE LO S INTERESADOS DIRIJAN A LOS ÓRGANOS DE LAS ADMINISTRACIONES PÚBLICAS PODRÁN PRESENTARSE: SEÑALESE LA INCORRECTA", "opciones": {"A": "En las oficinas de Correos.", "B": "En el registro electrónico de la Administración u Organismo al que se dirij an, así como en los restantes registros electrónicos de cualquiera de los sujetos a los que se ref iere el artículo 2.1 de la Ley 39/2015 del Procedimiento Administrativo Común de las Administraciones Públicas.", "C": "En las representaciones diplomáticas u oficinas consulares del extranjero en España.", "D": "En las oficinas de asistencia en materia de registros."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 16.4.c", "explicacion": "El artículo 16.4.c) de la Ley 39/2015 autoriza a presentar los documentos que los interesados dirijan a los órganos de las Administraciones Públicas en «las representaciones diplomáticas u oficinas consulares de España en el extranjero»."}, "tema_id": 29, "tema_title": "Tema 29: Órganos Administrativos y Colegiados (Ley 40/2015 y Ley 3/2022)"}, {"numero": 252, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 17, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #17)", "estado": "Vigente", "pregunta": "LOS ARTÍCULOS 21 Y 22 DE LA LEY 39/2015 DE PROCEDIMIENTO ADMINISTRATIVO COMÚN DE LAS ADMINISTRACIONES PÚBLICAS, QUE REGULAN LA OBLIGACIÓN DE RESOLVER DE LA ADMINISTRACIÓN, DISPONEN: (INDIQUESE LA RESPUESTA CORRECTA)", "opciones": {"A": "Cuando las normas reguladoras de los procedimientos no fijen el plazo máxim o, éste será de seis meses.", "B": "El plazo máximo en que debe notificarse la resolución expresa será el fijado por la norma reguladora del correspondiente procedimiento. Este plazo no podrá exceder de seis meses salvo que una norma con rango de Ley establezca uno mayor o así venga previ sto en el Derecho de la Unión Europea.", "C": "En los casos de prescripción, renuncia del derecho, caducidad del procedimiento o desistimiento de la solicitud, así como de desaparición sobrevenida del objeto del procedimiento, la Administración no está obligada a dictar la resolución expresa qu e le impone el párrafo primero del art. 21 de la Ley 39/2015", "D": "En ningún supuesto cabrá la suspensión del transcurso del plazo máximo legal para resolver un procedimiento y notificar la resolución."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 21.3", "explicacion": "El artículo 21.3 de la Ley 39/2015 determina que cuando las normas reguladoras de los procedimientos no fijen el plazo máximo, éste será de tres meses."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 253, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 18, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #18)", "estado": "Vigente", "pregunta": "CONFORME AL ART. 24. 3 DE LA LEY DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN DE LAS ADMINISTRACIONES PÚBLICAS:", "opciones": {"A": "En los casos de estimación por silencio administrativo, la resolución expresa posterior al vencimiento del plazo se adoptará por la Administración sin vinculación alg una al sentido del silencio.", "B": "En los casos de desestimación por silencio administrativo, la resolución expresa posterior a la producción del acto sólo podrá dictarse de ser confirmatoria del mismo.", "C": "En los casos de desestimación por silencio administrativo, la resolución expresa posterior al vencimiento del plazo se adoptará por la Administración sin vinculación alg una al sentido del silencio.", "D": "Tanto en los casos estimación como desestimación por silencio administrativo, no cabe que la Administración adopte resolución expresa con posterioridad al vencimiento del plazo máximo para dictarla y notificarla."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 24.3.b", "explicacion": "El artículo 24.3.b) de la Ley 39/2015 indica: «En los casos de desestimación por silencio administrativo, la resolución expresa posterior al vencimiento del plazo se adoptará por la Administración sin vinculación alguna al sentido del silencio»."}, "tema_id": 28, "tema_title": "Tema 28: Fuentes del Derecho Administrativo: Ley y Reglamento"}, {"numero": 254, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 19, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #19)", "estado": "Vigente", "pregunta": "ENTRE LOS DERECHOS QUE LA LEY 39/2015 RECONOCE A LOS INTERESADOS EN EL PROCEDIMIENTO SE HALLAN:", "opciones": {"A": "En el caso de procedimientos administrativos de naturaleza sancionadora, los presuntos responsables tendrán derecho a la presunción de no existencia de responsabili dad administrativa mientras no se demuestre lo contrario.", "B": "Tendrán derecho a identificar a las autoridades y al personal al servicio de las Administraciones Públicas bajo cuya responsabilidad se tramiten los procedimientos.", "C": "Tendrán derecho a cumplir las obligaciones de pago a través de los medios elec trónicos previstos en el artículo 98.2.", "D": "Todas son correctas."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 13", "explicacion": "El artículo 13 de la Ley 39/2015 reconoce los derechos de los ciudadanos a comunicarse a través del Punto de Acceso General Electrónico, a ser asistidos en el uso de medios electrónicos y a la obtención y utilización de medios de identificación y firma electrónica."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 255, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 20, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #20)", "estado": "Vigente", "pregunta": "DE CONFORMIDAD CON LA REGULACIÓN DE LA LEY 39/2015 EN MATERIA DE INICIO DEL PROCEDIMIENTO, UNA DE LAS SIGUIENTES AFIRMACIONES ES INCORRECTA:", "opciones": {"A": "Los procedimientos se iniciarán de oficio por acuerdo del órgano competente, bien por propia iniciativa o como consecuencia de orden superior, a petición razonada de otros órganos o por denuncia.", "B": "Los interesados sólo podrán solicitar el inicio de un procedimiento de responsabi lidad patrimonial, cuando no haya prescrito su derecho a reclamar. El derecho a rec lamar prescribirá al año de producido el hecho o el acto que motive la indemnización o s e manifieste su efecto lesivo. En caso de daños de carácter físico o psíquico a las personas, el pl azo empezará a computarse desde la curación o la determinación del alcance de las secuelas.", "C": "Si la solicitud de iniciación no reúne los requisitos que señala la norm ativa aplicable, se requerirá al interesado para que, en un plazo de veinte días, subsane la falta o acom pañe los documentos preceptivos, con indicación de que, si así no lo hiciera, se le tendrá po r desistido de su petición.", "D": "Las solicitudes que se formulen deberán contener, entre otros extremos, el Órgano, centr o o unidad administrativa a la que se dirige y su correspondiente código de identificación"}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 68.1", "explicacion": "El artículo 68.1 de la Ley 39/2015 preceptúa: «Si la solicitud de iniciación no reúne los requisitos... se requerirá al interesado para que, en un plazo de diez días, subsane la falta o acompañe los documentos preceptivos, con indicación de que, si así no lo hiciera, se le tendrá por desistido de su petición...»."}, "tema_id": 22, "tema_title": "Tema 22: Firma y Certificación Electrónica (Ley 39/2015)"}, {"numero": 256, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 22, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #22)", "estado": "Vigente", "pregunta": "INDÍQUESE CUAL DE LOS SIGUIENTES ENUNCIADOS NO SE CORRESPONDE CON LA RELACIÓN DE ACTOS QUE PONEN FIN A LA VÍA ADMINISTRATIVA QUE CONTIE NE EL ART. 114 DE LA LEY 39/2015:", "opciones": {"A": "Las resoluciones de los recursos de alzada.", "B": "Las resoluciones de los órganos administrativos que carezcan de superior jerárquico, salvo que una Ley establezca lo contrario.", "C": "Las resoluciones de los órganos colegiados.", "D": "La resolución administrativa de los procedimientos de responsabilidad patrimonial, cualquiera que fuese el tipo de relación, pública o privada, de que derive."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 114.1", "explicacion": "El artículo 114.1 de la Ley 39/2015 enumera los actos que ponen fin a la vía administrativa: las resoluciones de los recursos de alzada, las resoluciones de los procedimientos a que se refiere el art. 112.2, las de los órganos que carezcan de superior jerárquico, y los acuerdos, pactos o contratos que tengan la consideración de finalizadores."}, "tema_id": 34, "tema_title": "Tema 34: Responsabilidad Patrimonial de las Administraciones Públicas"}, {"numero": 257, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 23, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #23)", "estado": "Vigente", "pregunta": "INDIQUESE LA RESPUESTA INCORRECTA A LA LUZ DE LA LEY 39/2015:", "opciones": {"A": "El plazo para la interposición del recurso de alzada será de un mes, si el acto fuera expreso.", "B": "Si el acto no fuera expreso, el plazo será de tres meses y se contará, para soli citante y otros posibles interesados, a partir del día siguiente a aquel en que, de acuerdo con su normativa específica, se produzcan los efectos del silencio administrativo.", "C": "El plazo máximo para dictar y notificar la resolución será de tres meses.", "D": "El plazo para la interposición del recurso de reposición será de un mes, si el acto fuera expreso."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 124.1", "explicacion": "El artículo 124.1 de la Ley 39/2015 establece que el plazo para interponer recurso potestativo de reposición si el acto fuera expreso será de un mes, y si no fuera expreso podrá interponerse en cualquier momento a partir del día siguiente a aquel en que se produzca el acto presunto (es incorrecta la mención a 3 meses de la antigua Ley 30/1992)."}, "tema_id": 28, "tema_title": "Tema 28: Fuentes del Derecho Administrativo: Ley y Reglamento"}, {"numero": 258, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 24, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #24)", "estado": "Vigente", "pregunta": "INDIQUESE LA RESPUESTA CORRECTA A LA LUZ DE LA LEY 39/2015:", "opciones": {"A": "Contra las disposiciones administrativas de carácter general sólo cabrá el recurso po testativo de reposición.", "B": "Contra los actos firmes en vía administrativa, no cabe interponer recurso administr ativo alguno, salvo el recurso extraordinario de revisión.", "C": "Contra los actos de trámite no cabrá recurso en vía administrativa.", "D": "El error o la ausencia de la calificación del recurso por parte del recurrente será causa de inadmisión."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 125.1", "explicacion": "El artículo 125.1 de la Ley 39/2015 establece que «contra los actos firmes en vía administrativa, podrá interponerse el recurso extraordinario de revisión ante el órgano administrativo que los dictó, que también será el competente para su resolución» en las circunstancias tasadas de la ley."}, "tema_id": 28, "tema_title": "Tema 28: Fuentes del Derecho Administrativo: Ley y Reglamento"}, {"numero": 259, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 25, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #25)", "estado": "Vigente", "pregunta": "CON ARREGLO AL ART. 47 DE LA LEY 39/2015 SON NULOS DE PLENO DERECHO: INDIQUESE LA RESPUESTA INCORRECTA", "opciones": {"A": "Los actos que lesionen los derechos y libertades susceptibles de amparo constitucional.", "B": "Los actos expresos o presuntos contrarios al ordenamiento jurídico por los que se adquieren facultades o derechos cuando se carezca de los requisitos esenciales para su adquisición.", "C": "Los dictados por órgano manifiestamente incompetente por razón de la materia o de l territorio.", "D": "Los que incurran en desviación de poder."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 47 y Art. 48.1", "explicacion": "Conforme a los arts. 47 y 48 de la Ley 39/2015, la desviación de poder constituye causa de ANULABILIDAD del acto administrativo (art. 48.1), mientras que los actos que lesionen derechos fundamentales, prescindan del procedimiento o tengan contenido imposible son nulos de pleno derecho (art. 47.1)."}, "tema_id": 28, "tema_title": "Tema 28: Fuentes del Derecho Administrativo: Ley y Reglamento"}, {"numero": 260, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 26, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #26)", "estado": "Vigente", "pregunta": "¿CUAL DE ESTOS ENUNCIADOS ES CORRECTO?", "opciones": {"A": "Son anulables las disposiciones administrativas que vulneren la Constitución, las leyes u otras disposiciones administrativas de rango superior.", "B": "Son anulables las disposiciones administrativas que regulen materias reservadas a la Ley.", "C": "Son nulas de pleno derecho las disposiciones administrativas que establezcan la retroactividad de disposiciones sancionadoras no favorables o restrictivas de derec hos individuales.", "D": "Todos los enunciados son correctos."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 47.2", "explicacion": "El artículo 47.2 de la Ley 39/2015 dispone literalmente: «También serán nulas de pleno derecho las disposiciones administrativas que vulneren la Constitución, las leyes u otras disposiciones administrativas de rango superior, las que regulen materias reservadas a la Ley, y las que establezcan la retroactividad de disposiciones sancionadoras no favorables o restrictivas de derechos individuales»."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 261, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 27, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #27)", "estado": "Vigente", "pregunta": "NO DEBERÁN SER MOTIVADOS, CONFORME AL ART. 35 DE LA LEY 39/2015:", "opciones": {"A": "Los actos que se dicten en el ejercicio de potestades regladas.", "B": "Los actos que resuelvan recursos administrativos.", "C": "Los que acuerden el desistimiento por la Administración en procedimientos iniciados de oficio.", "D": "Los actos que acuerden la terminación del procedimiento por la imposibilidad materi al de continuarlo por causas sobrevenidas."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas (LPACAP)", "articulo": "Art. 35.1", "explicacion": "El artículo 35.1 de la Ley 39/2015 exige motivación específica para los actos que limiten derechos, los que resuelvan recursos y los que se separen del criterio precedente o de dictámenes consultivos, pero no existe una regla general de motivación obligatoria para todo acto dictado en ejercicio de potestades regladas que sea plenamente favorable al solicitante."}, "tema_id": 28, "tema_title": "Tema 28: Fuentes del Derecho Administrativo: Ley y Reglamento"}, {"numero": 262, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 29, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #29)", "estado": "Vigente", "pregunta": "LA CUANTÍA DE LA INDEMNIZACIÓN EN NUESTRO SISTEMA DE RESPONSABILIDAD PATRIMONIAL DEBE CALCULARSE:", "opciones": {"A": "Con referencia al día en el que se produjo el daño, pero debe actualizarse conforme al índ ice de garantía de la competitividad y con los intereses que procedan por demora.", "B": "Con referencia al día en que se dicte la resolución o sentencia que reconozca la responsabilidad.", "C": "Con referencia al día en que se produjo el daño, sin actualizaciones.", "D": "Con referencia al día de presentación de la reclamación, sin actualizaciones."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público (LRJSP)", "articulo": "Art. 34.2", "explicacion": "El artículo 34.2 de la Ley 40/2015 establece que «la indemnización se calculará con arreglo a los criterios de valoración establecidos en la legislación fiscal, de expropiación forzosa y demás normas aplicables... calculándose con referencia al día en que la lesión efectivamente se produjo»."}, "tema_id": 34, "tema_title": "Tema 34: Responsabilidad Patrimonial de las Administraciones Públicas"}, {"numero": 263, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 30, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #30)", "estado": "Vigente", "pregunta": "¿QUÉ DATOS, POR EXCEPCIÓN, PODRÁN SER MANTENIDOS EN SU INTEGRIDAD?", "opciones": {"A": "Los de valor histórico.", "B": "Los de valor estadístico.", "C": "Los de valor científico.", "D": "Todas las respuestas son correctas."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley Orgánica 3/2018 (LOPDGDD) y RGPD (UE 2016/679)", "articulo": "Art. 9 RGPD y Art. 9 LOPDGDD", "explicacion": "Los datos sobre ideología, afiliación sindical, religión y convicciones sólo pueden ser objeto de tratamiento mediante el consentimiento explícito del afectado o cuando concurran las excepciones legales tasadas de interés público esencial."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 264, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 31, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #31)", "estado": "Vigente", "pregunta": "¿EN QUÉ PLAZO DEBERÁN CANCELARSE LOS DATOS DE CARÁCTER PERSONAL?", "opciones": {"A": "A los 12 meses.", "B": "A los 3 años.", "C": "A los 5 años.", "D": "Cuando hayan dejado de ser necesarios o pertinentes."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley Orgánica 3/2018 (LOPDGDD) y RGPD (UE 2016/679)", "articulo": "Art. 5.1.e RGPD", "explicacion": "El principio de limitación del plazo de conservación (art. 5.1.e RGPD) obliga a que los datos personales se supriman o cancelen cuando hayan dejado de ser necesarios o pertinentes para los fines para los que fueron recogidos."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 265, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 32, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #32)", "estado": "Vigente", "pregunta": "SEÑALA CUÁL DE LOS SIGUIENTES ES UN PRINCIPIO POR EL QUE SE RIGE LA TESORERÍA GENERAL DEL PAÍS VASCO:", "opciones": {"A": "Puntualidad en la satisfacción de las obligaciones.", "B": "Máxima seguridad en la situación de fondos y valores y en las operaciones.", "C": "Centralización de la dirección sin perjuicio de su gestión descentralizada.", "D": "Todas las respuestas anteriores son correctas."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 31/1995, de 8 de noviembre, de Prevención de Riesgos Laborales (LPRL)", "articulo": "Art. 15.1 LPRL", "explicacion": "El artículo 15.1 de la LPRL enumera entre los principios de la acción preventiva: evitar los riesgos, evaluar los riesgos que no se puedan evitar, combatir los riesgos en su origen y adaptar el trabajo a la persona."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 266, cionadoras o de intervención."}, "tema_id": 25, "tema_title": "Tema 25: Comunicación Escrita y Notificaciones Administrativas"}, {"numero": 291, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 59, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #59)", "estado": "Vigente", "pregunta": "NUESTRO SISTEMA DE RESPONSABILIDAD PATRIMONIAL CONSAGRA UN MODELO DE REPARACIÓN:", "opciones": {"A": "Paliativo, que pretende atenuar los daños producidos.", "B": "Integral, que alcanza la totalidad de los daños producidos.", "C": "Únicamente alcanza a los daños producidos por culpa o negligencia del funcionario.", "D": "Tan sólo alcanza los daños producidos por el funcionamiento normal de los servicios públicos."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público (LRJSP)", "articulo": "Art. 32 y Art. 34.1", "explicacion": "El régimen de responsabilidad patrimonial de la Administración es de carácter objetivo e integral o reparador total del daño antijurídico causado, abarcando todos los perjuicios patrimoniales acreditados."}, "tema_id": 34, "tema_title": "Tema 34: Responsabilidad Patrimonial de las Administraciones Públicas"}, {"numero": 292, "examen_codigo": "2017", "examen_nombre": "Bolsa de Trabajo de Administrativos 2017", "bloque_id": 7, "bloque_titulo": "Bolsa 2017 - Bloque Único", "bloque_subtitulo": "Temario Completo y Casos de Atención (Preguntas 1-60)", "numero_en_examen": 60, "reserva": false, "origen": "IVAP - Bolsa de Trabajo de Administrativos 2017 (Pregunta #60)", "estado": "Vigente", "pregunta": "SEÑALA CUÁL DE LOS SIGUIENTES FACTORES DEBE DE TENERSE EN CUENT A EN UNA ATENCIÓN AL PÚBLICO DE CALIDAD:", "opciones": {"A": "Amabilidad.", "B": "Cercanía.", "C": "Accesibilidad.", "D": "Todas las respuestas son correctas."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Manual IVAP Tema 12 - Prevención de Riesgos y Pantallas de Datos (PVD)", "articulo": "RD 488/1997 sobre Pantallas de Visualización", "explicacion": "El diseño ergonómico del puesto de trabajo con PVD, la iluminación del entorno y la adopción de posturas correctas constituyen factores directos indispensables para prevenir la fatiga visual y los trastornos musculoesqueléticos."}, "tema_id": 24, "tema_title": "Tema 24: Atención a la Ciudadanía, Quejas y Sugerencias"}, {"numero": 293, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 1, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #1)", "estado": "Vigente", "pregunta": "Los derechos recogidos en los artículos 15-29 de la Constitución cuentan con un sistema reforzado de garantías, como son (indíquese la respuesta INCORRECTA):", "opciones": {"A": "Se regulan necesariamente por ley ordinaria y no por reglamento.", "B": "Su reforma exige un procedimiento agravado.", "C": "Protección del Tribunal Constitucional mediante el recurso de amparo.", "D": "Protección jurisdiccional de los tribunales ordinarios a través de un procedimiento preferente y sumario."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Constitución Española de 1978.", "articulo": "Art. 81.1 en relación con el art. 53.1 y 53.2 CE.", "explicacion": "Es la afirmación incorrecta (y por tanto la correcta del test) porque el desarrollo de los derechos fundamentales y de las libertades públicas (arts. 15 a 29 CE) está reservado expresamente a **Ley Orgánica**, no a ley ordinaria. Las opciones B (art. 168 CE), C (art. 53.2 CE) y D (art. 53.2 CE) son garantías ciertas."}, "tema_id": 1, "tema_title": "Tema 1: Constitución Española: derechos y libertades fundamentales"}, {"numero": 294, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 2, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #2)", "estado": "Vigente", "pregunta": "En relación con la Administración de Justicia en las Comunidades Autónomas, puede decirse que:", "opciones": {"A": "Un Tribunal Superior de Justicia, sin perjuicio de la jurisdicción que corresponde al Tribunal Supremo, culminará la organización judicial en el ámbito territorial de la Comunidad Autónoma.", "B": "Los Tribunales Superiores de Justicia son órganos jurisdiccionales de las Comunidades Autónomas.", "C": "El poder jurisdiccional está abierto, al igual que el legislativo y el ejecutivo, a la descentralización territorial.", "D": "La Constitución no recoge expresamente ninguna disposición sobre la organización judicial en el ámbito territorial de la Comunidad Autónoma."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Constitución Española de 1978.", "articulo": "Art. 152.1, párrafo segundo CE.", "explicacion": "\"Un Tribunal Superior de Justicia, sin perjuicio de la jurisdicción que corresponde al Tribunal Supremo, culminará la organización judicial en el ámbito territorial de la Comunidad Autónoma.\" El Poder Judicial es único del Estado (no descentralizado en CC.AA.)."}, "tema_id": 2, "tema_title": "Tema 2: La organización territorial del Estado y Estatuto de Autonomía de Euskadi"}, {"numero": 295, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 3, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #3)", "estado": "Vigente", "pregunta": "El reglamento de la Unión Europea es un tipo o categoría normativa:", "opciones": {"A": "Que, debido a su potencia normativa, se utiliza únicamente en ámbitos de competencia exclusiva de la Unión Europea.", "B": "Se utiliza exclusivamente en ámbitos de competencia compartida entre la UE y los Estados miembros.", "C": "Es una norma directamente aplicable en el Estado miembro.", "D": "Es una norma directamente aplicable si el Estado miembro así lo admite."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Tratado de Funcionamiento de la Unión Europea (TFUE).", "articulo": "Art. 288, párrafo segundo TFUE.", "explicacion": "\"El reglamento tendrá un alcance general. Será obligatorio en todos sus elementos y directamente aplicable en cada Estado miembro\" sin necesidad de transposición interna."}, "tema_id": 3, "tema_title": "Tema 3: Derecho de la Unión Europea e Instituciones"}, {"numero": 296, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 4, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #4)", "estado": "Vigente", "pregunta": "En cuanto a las lenguas, el Estatuto de Autonomía del País Vasco (señálese la respuesta INCORRECTA):", "opciones": {"A": "Establece el euskera y el castellano como lenguas propias del Pueblo Vasco.", "B": "Se refiere al euskera y al castellano como lenguas oficiales del Pueblo Vasco.", "C": "Establece el euskera como lengua propia del Pueblo Vasco.", "D": "Establece que nadie podrá ser discriminado por razón de la lengua."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Estatuto de Autonomía del País Vasco (Ley Orgánica 3/1979).", "articulo": "Art. 6.1 EAPV.", "explicacion": "Es la respuesta incorrecta porque el Estatuto establece que el **euskera es la lengua propia** del Pueblo Vasco (\"El euskera, lengua propia del Pueblo Vasco, tendrá, como el castellano, carácter de idioma oficial...\"). La condición de lengua propia corresponde exclusivamente al euskera."}, "tema_id": 4, "tema_title": "Tema 4: Organización política y administrativa de la CAE"}, {"numero": 297, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 8, "bloque_titulo": "OPE 2022 - Parte A", "bloque_subtitulo": "Cuestionario Teórico Oficial (Preguntas 1-40)", "numero_en_examen": 5, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #5)", "estado": "Vigente", "pregunta": "Dentro de las competencias de los Territorios Históricos que constituyen el núcleo esencial e intocable de la foralidad NO se encuentran:", "opciones": {"A": "Las competencias para conservar, restablecer y actualizar su organización e instituciones privativas de autogobierno.", "B": "Las competencias sobre carreteras y caminos.", "C": "Las competencias sobre organización, régimen y funcionamiento de sus propias instituciones.", "D": "Las competencias sobre conservación, modificación y desarrollo del Derecho civil Foral y especial."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Estatuto de Autonomía del País Vasco y Ley 27/1983 (LTH).", "articulo": "Art. 10.5 EAPV y Art. 7 LTH.", "explicacion": "La conservación, modificación y desarrollo del Derecho Civil foral y especial es una competencia exclusiva de las **Instituciones Comunes de la Comunidad Autónoma** (Parlamento Vasco), conforme al art. 10.5 del Estatuto de Gernika, y no forma parte de las competencias privativas forales de las Juntas Generales/Dipu
