a de resolución judicial firme, se tramitará la oportuna modificación presupuestaria para habilitar los créditos precisos conforme a la normativa de hacienda."}, "tema_id": 15, "tema_title": "Tema 15: Presupuesto de Gastos: Ejecución, Créditos y Fases (D. Leg. 1/2011)"}, {"numero": 354, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 81, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #81)", "estado": "Vigente", "pregunta": "Una persona, médica colegiada, se dirige a la administración para solicitar asistencia técnica en el uso de los medios electrónicos, a fin de participar en un procedimiento administrativo subvencional relativo a la escolarización de su hijo. ¿La administración ha de prestarle la asistencia solicitada?", "opciones": {"A": "La administración ha de prestar asistencia técnica para el uso de medios electrónicos únicamente a personas que no dispongan de título universitario.", "B": "La administración pública ha de prestarle la asistencia técnica solicitada.", "C": "La administración pública no puede prestar asistencia técnica a profesionales colegiados que actúan en procedimientos de concurrencia competitiva.", "D": "La administración pública no está obligada a prestar asistencia técnica a los profesionales para cuyo ejercicio profesional se requiere colegiación."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015 del Procedimiento Administrativo Común.", "articulo": "Art. 12 y Art. 14.3 Ley 39/2015.", "explicacion": "La obligación de relacionarse electrónicamente para colegiados rige cuando actúan en el ejercicio de su actividad profesional colegiada. Al solicitar una ayuda personal/familiar para la escolarización de su hijo, interviene como persona física ciudadana y tiene derecho a la asistencia en el uso de medios electrónicos prevista en el art. 12."}, "tema_id": 20, "tema_title": "Tema 20: Registros Electrónicos e Interoperabilidad"}, {"numero": 355, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 82, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #82)", "estado": "Vigente", "pregunta": "Una dirección del Gobierno Vasco notifica electrónicamente, a una persona interesada en un expediente, una resolución contra la que cabe interponer recurso de alzada. Tras la puesta a disposición de la notificación en la sede electrónica, transcurren 12 días hasta que la persona interesada accede a su buzón. ¿Cuál de las siguientes respuestas es correcta?", "opciones": {"A": "La persona interesada puede presentar el recurso que estime procedente contra la resolución que se le notificó, y el plazo para ello se cuenta desde el día siguiente a la recepción de la notificación.", "B": "La persona interesada rechaza la notificación y, con ello, renuncia a cuantas acciones le podían caber respecto a la resolución objeto de notificación.", "C": "La persona interesada no podrá acceder al contenido de la notificación, únicamente podrá tener constancia de que la resolución se le ha notificado.", "D": "La persona interesada rechaza la notificación y la administración debe realizar un nuevo intento de notificación."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015 del Procedimiento Administrativo Común.", "articulo": "Art. 43.2 Ley 39/2015.", "explicacion": "Al transcurrir más de 10 días naturales sin acceder, el trámite se tiene legalmente por efectuado y la notificación por rechazada, continuando el curso del procedimiento."}, "tema_id": 25, "tema_title": "Tema 25: Comunicación Escrita y Notificaciones Administrativas"}, {"numero": 356, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 83, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #83)", "estado": "Vigente", "pregunta": "Una persona que quiere concurrir electrónicamente en un procedimiento subvencional del Gobierno Vasco, consulta a la Administración cuáles se consideran días inhábiles. Dado que no hay disposición de rango legal o de derecho europeo que especialmente regule la cuestión para este procedimiento, ¿cuál de las respuestas siguientes es correcta?", "opciones": {"A": "Los domingos y festivos únicamente.", "B": "Los sábados, domingos y festivos de la Comunidad Autónoma.", "C": "Los días inhábiles en el municipio en el que reside la persona interesada.", "D": "Los días que así se determinen en la Administración del Estado."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015 del Procedimiento Administrativo Común.", "articulo": "Art. 30.2 y 31.3 Ley 39/2015.", "explicacion": "Son días inhábiles los sábados, los domingos y los declarados festivos en el calendario oficial de la Comunidad Autónoma competente (o del municipio fijado en la sede electrónica del órgano tramitador)."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 357, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 84, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #84)", "estado": "Vigente", "pregunta": "Su directora le comunica que desde mañana se va a encontrar de baja (ILT) por una operación quirúrgica y que como el decreto de estructura de su departamento establece que la competencia en caso de ausencia recae en otro director M.N., será éste quien firme los documentos pertinentes. ¿Cómo se llama esta figura?", "opciones": {"A": "Encomienda de gestión.", "B": "Delegación de firma.", "C": "Suplencia.", "D": "Delegación de competencias."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "Ley 40/2015 de Régimen Jurídico del Sector Público.", "articulo": "Art. 13 Ley 40/2015.", "explicacion": "\"En los supuestos de vacante, ausencia o enfermedad... los titulares de los órganos administrativos serán suplidos temporalmente por quien designe el órgano competente para el nombramiento de aquéllos o por quien determine el reglamento orgánico.\" La suplencia no altera la titularidad de la competencia."}, "tema_id": 29, "tema_title": "Tema 29: Órganos Administrativos y Colegiados (Ley 40/2015 y Ley 3/2022)"}, {"numero": 358, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 85, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #85)", "estado": "Vigente", "pregunta": "Le comunican que usted ha obtenido autorización para llevar a cabo un programa de cooperación internacional de la comisión europea en Bruselas por un periodo de un año. ¿Qué situación administrativa le correspondería?", "opciones": {"A": "Excedencia voluntaria por interés particular.", "B": "Servicio activo.", "C": "Servicios especiales.", "D": "Suspensión de funciones."}, "respuesta_correcta": "C", "respuesta_correcta_indice": 2, "fundamento_juridico": {"norma": "TREBEP y Ley 11/2022 de Empleo Público Vasco.", "articulo": "Art. 87.1.d TREBEP.", "explicacion": "Pasan a la situación de servicios especiales los funcionarios que sean adscritos a los servicios de organismos de la Unión Europea o de entidades internacionales oficiales o en programas de cooperación."}, "tema_id": 18, "tema_title": "Tema 18: Acceso al Empleo Público y Provisión de Puestos (Ley 11/2022 y TREBEP)"}, {"numero": 359, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 86, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #86)", "estado": "Vigente", "pregunta": "¿Por cuál de los siguientes procedimientos NO puede cubrirse su puesto de trabajo durante su ausencia?", "opciones": {"A": "Mediante comisión de servicios voluntaria.", "B": "Mediante concurso de traslados.", "C": "Mediante comisión de servicios forzosa.", "D": "Mediante nombramiento de personal funcionario interino."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común", "articulo": "Art. 16.4 Ley 39/2015", "explicacion": "El artículo 16.4 de la Ley 39/2015 determina los lugares admitidos para la presentación de solicitudes (registro electrónico del organismo, oficinas de Correos, representaciones diplomáticas u oficinas de asistencia registral). Las vías informales no registrales carecen de validez de entrada."}, "tema_id": 18, "tema_title": "Tema 18: Acceso al Empleo Público y Provisión de Puestos (Ley 11/2022 y TREBEP)"}, {"numero": 360, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 87, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #87)", "estado": "Vigente", "pregunta": "BLF representante de la asociación EKIN, se ha dirigido al departamento de Educación con la intención de solicitar el uso del instituto público Atenea para una actividad de una asociación a la que representa. Como se acerca la fecha de la actividad BLF necesita saber, y de forma telemática, en qué situación se encuentra el expediente, ¿dónde puede hacerlo?", "opciones": {"A": "En la carpeta ciudadana o “mi carpeta” de la Sede Electrónica.", "B": "Acudiendo a la Delegación de Educación.", "C": "En Giltza.", "D": "Todas las respuestas son incorrectas."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común", "articulo": "Art. 14.2.a Ley 39/2015", "explicacion": "El artículo 14.2.a) de la Ley 39/2015 impone la obligación estricta de relacionarse a través de medios electrónicos con las Administraciones Públicas a las personas jurídicas (asociaciones, fundaciones, sociedades mercantiles, etc.)."}, "tema_id": 7, "tema_title": "Tema 7: Administración Electrónica y Sede Electrónica"}, {"numero": 361, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 88, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #88)", "estado": "Vigente", "pregunta": "BLF se ha dirigido en euskera en el punto de información de la delegación de Educación y le han contestado en castellano, ya que en ese momento no se encuentra presente ninguna persona con las capacidades lingüísticas suficientes. BLF quiere poner la oportuna reclamación, ¿a qué organismo de los siguientes debería dirigir la reclamación?", "opciones": {"A": "A Izenpe.", "B": "A Elebide.", "C": "A Aurrerabide.", "D": "A Aukerak."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 10/1982, de 24 de noviembre, básica de normalización del uso del Euskera", "articulo": "Art. 6.1 Ley 10/1982", "explicacion": "El artículo 6.1 de la Ley 10/1982 reconoce a todos los ciudadanos el derecho a usar tanto el euskera como el castellano en sus relaciones con las Administraciones públicas de la CAE y a ser atendidos en la lengua oficial que elijan."}, "tema_id": 8, "tema_title": "Tema 8: Normalización Lingüística del uso del Euskera (Decreto 86/1997)"}, {"numero": 362, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 89, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #89)", "estado": "Vigente", "pregunta": "Junto con la solicitud tiene intención de presentar varios documentos privados, ¿cómo deberán gestionarse esos documentos?", "opciones": {"A": "Los documentos entregados serán fotocopiados y se devolverán los originales.", "B": "Los documentos entregados serán digitalizados, y los originales se devolverán al solicitante.", "C": "Quedarán anexos al expediente y se devolverán con la resolución.", "D": "Quedarán anexos al expediente y no se devolverán."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015 del Procedimiento Administrativo Común.", "articulo": "Art. 16.5 y 27 Ley 39/2015.", "explicacion": "Los documentos presentados de manera presencial ante las oficinas de asistencia en materia de registros serán digitalizados en el acto para su incorporación al expediente electrónico, devolviéndose los documentos originales al interesado."}, "tema_id": 20, "tema_title": "Tema 20: Registros Electrónicos e Interoperabilidad"}, {"numero": 363, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 90, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #90)", "estado": "Vigente", "pregunta": "El Departamento de Salud, a fecha de 20 de mayo, viernes, ha publicado en el BOPV la convocatoria de unas ayudas para proyectos de investigación, el plazo de presentación de solicitudes es de 40 días. AS tiene intención de solicitar dichas ayudas y necesita saber cómo debe de contar los plazos. ¿cuándo se iniciará el computo del plazo de 40 días?", "opciones": {"A": "El mismo día de la publicación, el 20 de mayo.", "B": "El día siguiente, 21 de mayo.", "C": "En la fecha de la resolución de la convocatoria.", "D": "El 23 de mayo, primer día hábil."}, "respuesta_correcta": "D", "respuesta_correcta_indice": 3, "fundamento_juridico": {"norma": "Ley 39/2015 del Procedimiento Administrativo Común.", "articulo": "Art. 30.3 y 30.7 Ley 39/2015.", "explicacion": "Si el plazo se fija en días y el día siguiente es inhábil (sábado 21 de mayo es inhábil según el art. 30.2), el cómputo se inicia el primer día hábil siguiente (lunes 23 de mayo)."}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 364, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 91, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #91)", "estado": "Vigente", "pregunta": "A efectos del cómputo de plazos en las actuaciones administrativas ¿cómo se deben contar los días en la Administración de la Comunidad Autónoma de Euskadi?", "opciones": {"A": "Días hábiles, exceptuando sábados, domingos y festivos.", "B": "Días hábiles, exceptuando domingos y festivos.", "C": "Días naturales.", "D": "Días hábiles, exceptuando los festivos de Vitoria-Gasteiz."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "Ley 39/2015 del Procedimiento Administrativo Común.", "articulo": "Art. 30.2 Ley 39/2015.", "explicacion": "\"Siempre que por Ley o en el Derecho de la Unión Europea no se exprese otro cómputo, cuando los plazos se señalen por días, se entiende que éstos son hábiles, excluyéndose del cómputo los sábados, los domingos y los declarados festivos.\""}, "tema_id": 31, "tema_title": "Tema 31: Principios del Procedimiento y Personas Interesadas"}, {"numero": 365, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 92, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #92)", "estado": "Vigente", "pregunta": "Una vez analizada la documentación entregada por AS, se observa que faltan algunos documentos y por lo tanto no está completa, ante ello:", "opciones": {"A": "La Administración denegará la solicitud.", "B": "La Administración le concederá un plazo de 10 días para subsanar la deficiencia.", "C": "La Administración le concederá un plazo de 5 días para subsanar la deficiencia.", "D": "La Administración le concederá un plazo de 20 días para subsanar la deficiencia."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "Ley 39/2015 del Procedimiento Administrativo Común.", "articulo": "Art. 68.1 Ley 39/2015.", "explicacion": "\"Si la solicitud de iniciación no reúne los requisitos que señala el artículo 66... se requerirá al interesado para que, en un plazo de diez días, subsane la falta o acompañe los documentos preceptivos, con indicación de que, si así no lo hiciera, se le tendrá por desistido de su petición...\""}, "tema_id": 32, "tema_title": "Tema 32: Desarrollo y Fases del Procedimiento Administrativo Común"}, {"numero": 366, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 93, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #93)", "estado": "Vigente", "pregunta": "JR ha sido padre recientemente, ¿cuáles son los permisos previstos en el artículo 49 del EBEP, a los que se puede acoger?", "opciones": {"A": "Permiso del progenitor diferente de la madre biológica por nacimiento, guarda con fines de adopción, acogimiento o adopción de un hijo o hija: tendrá una duración de dieciséis semanas.", "B": "Permiso del progenitor diferente de la madre biológica por nacimiento, guarda con fines de adopción, acogimiento o adopción de un hijo o hija: tendrá una duración de cuatro semanas.", "C": "Permiso por nacimiento tendrá una duración de seis semanas.", "D": "Permiso por nacimiento: tendrá una duración de catorce semanas."}, "respuesta_correcta": "A", "respuesta_correcta_indice": 0, "fundamento_juridico": {"norma": "TREBEP (Real Decreto Legislativo 5/2015).", "articulo": "Art. 49.c TREBEP.", "explicacion": "El permiso del progenitor diferente de la madre biológica por nacimiento, guarda con fines de adopción, acogimiento o adopción tiene una duración equiparada de **16 semanas**."}, "tema_id": 9, "tema_title": "Tema 9: Personal Empleado Público: Clases, derechos, deberes y régimen disciplinario"}, {"numero": 367, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 94, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #94)", "estado": "Vigente", "pregunta": "IL funcionario de carrera del organismo autónomo EUSTAT ha abandonado reiteradamente el puesto de trabajo el último mes. Al recriminársele la actitud, no ha ofrecido justificación alguna. ¿cómo se debe considerar dicha conducta?", "opciones": {"A": "Falta grave.", "B": "Falta muy grave.", "C": "Falta leve.", "D": "Ninguna respuesta es correcta."}, "respuesta_correcta": "B", "respuesta_correcta_indice": 1, "fundamento_juridico": {"norma": "TREBEP y Ley de Función Pública Vasca.", "articulo": "Art. 95.2.c TREBEP / Art. 83 Ley de la Función Pública Vasca.", "explicacion": "El abandono del servicio o la falta continuada de asistencia sin justificación es calificada como falta muy grave o grave según el alcance; el Tribunal fijó como falta muy grave el abandono reiterado del puesto."}, "tema_id": 9, "tema_title": "Tema 9: Personal Empleado Público: Clases, derechos, deberes y régimen disciplinario"}, {"numero": 368, "examen_codigo": "2022", "examen_nombre": "OPE 2022 Cuerpo Administrativo (BEC 18/09/2022)", "bloque_id": 10, "bloque_titulo": "OPE 2022 - Parte B (Opción 2)", "bloque_subtitulo": "Supuestos Prácticos: Notificaciones, Plazos y Lenguas", "numero_en_examen": 95, "reserva": false, "origen": "IVAP - OPE 2022 Cuerpo Administrativo (BEC 18/09/2022) (Pregunta #95)", "estado": "Vigente", "pregunta": "GN funcionario de carrera del Departamento de Medio Ambiente con 6 años de antigüedad, se está planteando solicitar una excedencia de tres años por interés particular, ¿tiene derecho a ello?", "opciones": {"A": "Sí, si lo motiva suficientemente.", "B": "No porque ha obtenido una plaza en el último concurso de traslados.", "C": "No, porque   <script>
    const { useState, useEffect, useMemo, useRef } = React;

    function App() {

      const [selectedTema, setSelectedTema] = useState('all');
      const [selectedExam, setSelectedExam] = useState('all');
      const [selectedEstado, setSelectedEstado] = useState('all');
      const [onlyFavorites, setOnlyFavorites] = useState(false);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [selectedOption, setSelectedOption] = useState(null);
      const [showExplanation, setShowExplanation] = useState(false);
      const [darkMode, setDarkMode] = useState(() => {
        try {
          return localStorage.getItem('ope_ivap_dark_mode') === 'true';
        } catch(e) { return false; }
      });
      const [searchQuery, setSearchQuery] = useState('');

      // LocalStorage persistence
      const [answersHistory, setAnswersHistory] = useState(() => {
        try {
          const saved = localStorage.getItem('ope_ivap_answers_v1');
          return saved ? JSON.parse(saved) : {};
        } catch (e) {
          return {};
        }
      });

      const [favorites, setFavorites] = useState(() => {
        try {
          const saved = localStorage.getItem('ope_ivap_favorites_v1');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      // Exam Mode States
      const [examQuestions, setExamQuestions] = useState([]);
      const [examAnswers, setExamAnswers] = useState({});
      const [examFinished, setExamFinished] = useState(false);
      const [examTime, setExamTime] = useState(3500);
      const timerRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem('ope_ivap_answers_v1', JSON.stringify(answersHistory));
        } catch (e) {}
      }, [answersHistory]);

      useEffect(() => {
        try {
          localStorage.setItem('ope_ivap_favorites_v1', JSON.stringify(favorites));
        } catch (e) {}
      }, [favorites]);

      useEffect(() => {
        try {
          localStorage.setItem('ope_ivap_dark_mode', darkMode);
        } catch(e) {}
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // Timer effect for exam
      useEffect(() => {
        if (mode === 'exam' && !examFinished && examTime > 0) {
          timerRef.current = setInterval(() => {
            setExamTime(t => {
              if (t <= 1) {
                clearInterval(timerRef.current);
                setExamFinished(true);
                return 0;
              }
              return t - 1;
            });
          }, 1000);
        } else {
          if (timerRef.current) clearInterval(timerRef.current);
        }
        return () => {
          if (timerRef.current) clearInterval(timerRef.current);
        };
      }, [mode, examFinished, examTime]);

      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      // Unique Temas (1 to 34)
      const temasList = useMemo(() => {
        const map = new Map();
        QUESTIONS_DATA.forEach(q => {
          if (q.tema_id && !map.has(q.tema_id)) {
            map.set(q.tema_id, q.tema_title);
          }
        });
        return Array.from(map.entries()).sort((a, b) => a[0] - b[0]);
      }, []);

      // Unique Exams
      const examsList = useMemo(() => {
        const map = new Map();
        QUESTIONS_DATA.forEach(q => {
          if (!map.has(q.examen_codigo)) {
            map.set(q.examen_codigo, q.examen_nombre);
          }
        });
        return Array.from(map.entries());
      }, []);

      // Filtered questions
      const filteredQuestions = useMemo(() => {
        return QUESTIONS_DATA.filter(q => {
          const matchTema = selectedTema === 'all' || q.tema_id === parseInt(selectedTema);
          const matchExam = selectedExam === 'all' || q.examen_codigo === selectedExam;
          let matchEstado = true;
          if (selectedEstado === 'vigente') matchEstado = q.estado === 'Vigente';
          else if (selectedEstado === 'reforma') matchEstado = q.estado.toLowerCase().includes('reforma');
          
          const matchFav = !onlyFavorites || favorites.includes(q.numero);
          let matchSearch = true;
          if (searchQuery.trim()) {
            const s = searchQuery.toLowerCase();
            const textMatch = q.pregunta.toLowerCase().includes(s);
            const numMatch = q.numero.toString() === s || q.numero_en_examen.toString() === s;
            const exMatch = q.examen_nombre.toLowerCase().includes(s);
            const normaMatch = q.fundamento_juridico?.norma?.toLowerCase().includes(s) || false;
            const explMatch = q.fundamento_juridico?.explicacion?.toLowerCase().includes(s) || false;
            const optsMatch = Object.values(q.opciones).some(opt => opt.toLowerCase().includes(s));
            matchSearch = textMatch || numMatch || exMatch || normaMatch || explMatch || optsMatch;
          }
          return matchTema && matchExam && matchEstado && matchFav && matchSearch;
        });
      }, [selectedTema, selectedExam, selectedEstado, onlyFavorites, searchQuery, favorites]);

      const currentQ = filteredQuestions[currentIndex] || filteredQuestions[0];

      useEffect(() => {
        if (currentQ && answersHistory[currentQ.numero]) {
          setSelectedOption(answersHistory[currentQ.numero].chosen);
          setShowExplanation(true);
        } else {
          setSelectedOption(null);
          setShowExplanation(false);
        }
      }, [currentIndex, currentQ]);

      const handleSelectOption = (letter) => {
        if (mode === 'study' && currentQ) {
          setSelectedOption(letter);
          setShowExplanation(true);
          const isCorrect = letter === currentQ.respuesta_correcta;
          setAnswersHistory(prev => ({
            ...prev,
            [currentQ.numero]: {
              isCorrect,
              chosen: letter,
              timestamp: Date.now()
            }
          }));
        } else if (mode === 'exam' && !examFinished && examQuestions[currentIndex]) {
          setExamAnswers(prev => ({
            ...prev,
            [examQuestions[currentIndex].numero]: letter
          }));
        }
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (mode === 'study') {
            if (e.key === 'ArrowRight') handleNext();
            else if (e.key === 'ArrowLeft') handlePrev();
            else if (['1', 'a', 'A'].includes(e.key)) handleSelectOption('A');
            else if (['2', 'b', 'B'].includes(e.key)) handleSelectOption('B');
            else if (['3', 'c', 'C'].includes(e.key)) handleSelectOption('C');
            else if (['4', 'd', 'D'].includes(e.key)) handleSelectOption('D');
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [mode, currentIndex, filteredQuestions, currentQ]);

      const handleNext = () => {
        if (currentIndex < filteredQuestions.length - 1) {
          setCurrentIndex(currentIndex + 1);
        }
      };

      const handlePrev = () => {
        if (currentIndex > 0) {
          setCurrentIndex(currentIndex - 1);
        }
      };

      const toggleFavorite = (num) => {
        setFavorites(prev =>
          prev.includes(num) ? prev.filter(x => x !== num) : [...prev, num]
        );
      };

      const startExam = (qCount = 50) => {
        const pool = selectedExam === 'all' 
          ? QUESTIONS_DATA 
          : QUESTIONS_DATA.filter(q => q.examen_codigo === selectedExam);
        const count = Math.min(qCount, pool.length);
        const shuffled = [...pool].sort(() => 0.5 - Math.random()).slice(0, count);
        setExamQuestions(shuffled);
        setExamAnswers({});
        setExamFinished(false);
        setExamTime(count * 70);
        setCurrentIndex(0);
        setMode('exam');
      };

      const totalAnswered = Object.keys(answersHistory).length;
      const totalCorrect = Object.values(answersHistory).filter(a => a.isCorrect).length;
      const accuracyRate = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;

      return React.createElement(
        "div",
        { className: "flex flex-col min-h-screen" },

        // Header
        React.createElement(
          "header",
          { className: "bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm transition-colors" },
          React.createElement(
            "div",
            { className: "max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between" },
            React.createElement(
              "div",
              { className: "flex items-center space-x-3" },
              React.createElement(
                "div",
                { className: "w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-500 flex items-center justify-center text-white shadow-md font-bold text-xl" },
                "🏛️"
              ),
              React.createElement(
                "div",
                null,
                React.createElement(
                  "h1",
                  { className: "text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-tight" },
                  "IVAP C1 — Exámenes Oficiales"
                ),
                React.createElement(
                  "p",
                  { className: "text-xs text-slate-500 dark:text-slate-400" },
                  "373 Preguntas Reales · Fundamentación Jurídica (ivap-gestion-preguntas)"
                )
              )
            ),

            // Tabs & Toggle
            React.createElement(
              "div",
              { className: "flex items-center space-x-2" },
              React.createElement(
                "nav",
                { className: "hidden md:flex bg-slate-100 dark:bg-slate-700/60 p-1 rounded-xl text-xs font-semibold" },
                React.createElement(
                  "button",
                  {
                    onClick: () => { setMode('study'); setCurrentIndex(0); },
                    className: `px-3 py-1.5 rounded-lg transition-all ${mode === 'study' ? 'bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900'}`
                  },
                  "📖 Modo Práctica"
                ),
                React.createElement(
                  "button",
                  {
                    onClick: () => startExam(50),
                    className: `px-3 py-1.5 rounded-lg transition-all ${mode === 'exam' ? 'bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900'}`
                  },
                  "⏱️ Examen (50q)"
                ),
                React.createElement(
                  "button",
                  {
                    onClick: () => setMode('search'),
                    className: `px-3 py-1.5 rounded-lg transition-all ${mode === 'search' ? 'bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900'}`
                  },
                  "🔍 Explorador"
                ),
                React.createElement(
                  "button",
                  {
                    onClick: () => setMode('stats'),
                    className: `px-3 py-1.5 rounded-lg transition-all ${mode === 'stats' ? 'bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 shadow-sm' : 'text-slate-600 dark:text-slate-300 hover:text-slate-900'}`
                  },
                  "📊 Estadísticas"
                )
              ),
              React.createElement(
                "button",
                {
                  onClick: () => setDarkMode(!darkMode),
                  className: "p-2 rounded-xl text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 bg-slate-100 dark:bg-slate-700/50",
                  title: "Cambiar tema oscuro/claro"
                },
                darkMode ? "☀️" : "🌙"
              )
            )
          )
        ),

        // Mobile Nav Bar
        React.createElement(
          "div",
          { className: "md:hidden bg-slate-100 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-2 flex justify-around text-xs font-semibold" },
          React.createElement(
            "button",
            {
              onClick: () => { setMode('study'); setCurrentIndex(0); },
              className: `px-2 py-1 rounded-md ${mode === 'study' ? 'bg-white dark:bg-slate-700 text-emerald-600 dark:text-emerald-400 font-bold' : 'text-slate-600 dark:text-slate-400'}`
            },
            "📖 Práctica"
          ),
          React.createElement(
            "button",
            {
              onClick: () => startExam(50),

                    {
                      onClick: () => setMode('study'),
                      className: "px-5 py-2.5 rounded-xl text-xs font-bold border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700"
                    },
                    "Volver a Práctica"
                  )
                )
              );
            })()
          ),

          // MODE: SEARCH
          mode === 'search' && React.createElement(
            "div",
            { className: "space-y-4" },
            React.createElement(
              "div",
              { className: "bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col sm:flex-row gap-3" },
              React.createElement("input", {
                type: "text",
                placeholder: "Buscar por texto de pregunta, ley, artículo, tema o número...",
                value: searchQuery,
                onChange: (e) => setSearchQuery(e.target.value),
                className: "flex-1 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 px-4 py-2.5 focus:ring-2 focus:ring-emerald-500"
              }),
              React.createElement(
                "select",
                {
                  value: selectedTema,
                  onChange: (e) => setSelectedTema(e.target.value),
                  className: "text-xs rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 px-3 py-2.5"
                },
                React.createElement("option", { value: "all" }, "Todos los temas (1-34)"),
                temasList.map(([tid, title]) =>
                  React.createElement("option", { key: tid, value: tid }, title)
                )
              )
            ),
            React.createElement(
              "div",
              { className: "text-xs text-slate-500 px-1 font-semibold" },
              `Mostrando ${filteredQuestions.length} de 373 preguntas`
            ),
            React.createElement(
              "div",
              { className: "space-y-3" },
              filteredQuestions.slice(0, 50).map(q =>
                React.createElement(
                  "div",
                  { key: q.numero, className: "bg-white dark:bg-slate-800 rounded-xl p-5 border border-slate-200 dark:border-slate-700 shadow-sm space-y-2" },
                  React.createElement(
                    "div",
                    { className: "flex items-center justify-between text-xs" },
                    React.createElement("span", { className: "font-bold text-emerald-600 dark:text-emerald-400" }, `Pregunta #${q.numero} · ${q.tema_title}`),
                    React.createElement("span", { className: "font-bold px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-200" }, `Respuesta: ${q.respuesta_correcta}`)
                  ),
                  React.createElement("div", { className: "text-sm font-semibold text-slate-900 dark:text-white" }, q.pregunta),
                  React.createElement(
                    "div",
                    { className: "text-xs text-slate-600 dark:text-slate-300 pt-2 border-t border-slate-100 dark:border-slate-700/60" },
                    React.createElement("strong", null, "Fundamento Jurídico (ivap-gestion-preguntas): "),
                    `${q.fundamento_juridico.norma} (${q.fundamento_juridico.articulo}). `,
                    React.createElement("em", null, `"${q.fundamento_juridico.explicacion}"`)
                  )
                )
              ),
              filteredQuestions.length > 50 && React.createElement(
                "div",
                { className: "text-center py-4 text-xs text-slate-400" },
                "Mostrando las primeras 50 preguntas. Refina tu búsqueda para ver más."
              )
            )
          ),

          // MODE: STATS
          mode === 'stats' && React.createElement(
            "div",
            { className: "max-w-3xl mx-auto bg-white dark:bg-slate-800 rounded-2xl p-8 border border-slate-200 dark:border-slate-700 shadow-sm space-y-6" },
            React.createElement(
              "h2",
              { className: "text-xl font-bold text-slate-900 dark:text-white flex items-center gap-2" },
              React.createElement("span", null, "📊"),
              " Estadísticas de Rendimiento"
            ),
            React.createElement(
              "div",
              { className: "grid grid-cols-2 sm:grid-cols-4 gap-4" },
              React.createElement(
                "div",
                { className: "p-4 rounded-xl bg-slate-50 dark:bg-slate-750 border border-slate-100 dark:border-slate-700 text-center" },
                React.createElement("div", { className: "text-2xl font-black text-slate-900 dark:text-white" }, totalAnswered),
                React.createElement("div", { className: "text-xs text-slate-500 mt-1" }, "Respondidas")
              ),
              React.createElement(
                "div",
                { className: "p-4 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-100 dark:border-emerald-800 text-center" },
                React.createElement("div", { className: "text-2xl font-black text-emerald-600 dark:text-emerald-400" }, totalCorrect),
                React.createElement("div", { className: "text-xs text-emerald-600 mt-1" }, "Aciertos")
              ),
              React.createElement(
                "div",
                { className: "p-4 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-100 dark:border-rose-800 text-center" },
                React.createElement("div", { className: "text-2xl font-black text-rose-600 dark:text-rose-400" }, Math.max(0, totalAnswered - totalCorrect)),
                React.createElement("div", { className: "text-xs text-rose-600 mt-1" }, "Fallos")
              ),
              React.createElement(
                "div",
                { className: "p-4 rounded-xl bg-teal-50 dark:bg-teal-950/40 border border-teal-100 dark:border-teal-800 text-center" },
                React.createElement("div", { className: "text-2xl font-black text-teal-600 dark:text-teal-400" }, `${accuracyRate}%`),
                React.createElement("div", { className: "text-xs text-teal-600 mt-1" }, "Tasa de Acierto")
              )
            ),
            React.createElement(
              "div",
              { className: "pt-4 border-t border-slate-100 dark:border-slate-700 flex justify-between items-center" },
              React.createElement(
                "span",
                { className: "text-xs text-slate-500" },
                "Preguntas en Favoritos: ",
                React.createElement("strong", null, favorites.length)
              ),
              React.createElement(
                "button",
                {
                  onClick: () => {
                    if (confirm("¿Deseas reiniciar todas tus estadísticas locales de práctica?")) {
                      setAnswersHistory({});
                      localStorage.removeItem('ope_ivap_answers_v1');
                    }
                  },
                  className: "text-xs text-rose-600 hover:text-rose-700 font-semibold"
                },
                "Reiniciar estadísticas"
              )
            )
          )
        ),

        // Footer
        React.createElement(
          "footer",
          { className: "bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-6 text-center text-xs text-slate-500 dark:text-slate-400" },
          React.createElement("p", null, "IVAP · Instituto Vasco de Administración Pública · Exámenes Oficiales C1"),
          React.createElement(
            "p",
            { className: "mt-1" },
            "Calibrado con el protocolo ",
            React.createElement("code", { className: "font-mono text-emerald-600 dark:text-emerald-400" }, "ivap-gestion-preguntas"),
            " · 373 preguntas oficiales verificadas"
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(App, null)
    );
  </script>
</body>
</html>
